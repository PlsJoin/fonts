<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VTuberネームロゴメーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
  background: #e8eaed;
  color: #222;
  display: flex;
  gap: 12px;
  padding: 12px;
}
.panel {
  background: #fff;
  width: 360px;
  min-width: 360px;
  height: 100%;
  padding: 14px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
}
.panel h1 { font-size: 17px; margin-bottom: 0; }
.panel .subtitle { color: #666; font-size: 11px; margin-bottom: 4px; }
.section {
  border-top: 1px solid #eee;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.section-title {
  font-size: 12px;
  font-weight: 700;
  color: #444;
  letter-spacing: .02em;
  margin-bottom: 2px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .row label {
  font-size: .78rem;
  font-weight: 600;
  color: #444;
}
.row { display: flex; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.inline-check {
  font-size: .78rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
input[type="text"], input[type="number"], select {
  width: 100%;
  padding: 7px 8px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-family: inherit;
  font-size: 13px;
  background: #fff;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  outline: none;
  border-color: #4a90e2;
  box-shadow: 0 0 0 2px rgba(74,144,226,.2);
}
input[type="color"] {
  width: 42px;
  height: 30px;
  cursor: pointer;
  border: 1px solid #ccc;
  padding: 2px;
  background: #fff;
  border-radius: 5px;
  flex-shrink: 0;
}
input[type="range"] { width: 100%; accent-color: #4a90e2; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4a90e2; flex-shrink: 0; }
button {
  padding: 9px 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  background: #4a90e2;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, transform .05s;
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: #357abd; }
button:active { background: #2868a8; transform: scale(.98); }
button.secondary { background: #f0f2f5; color: #333; }
button.secondary:hover { background: #e0e3e8; }
button.danger { background: #e74c3c; color: #fff; }
button.danger:hover { background: #c0392b; }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.mode { display: flex; gap: 4px; }
.mode button { flex: 1; }
.mode button.active { background: #2c6cb0; color: #fff; }
.value { font-size: 11px; color: #666; min-width: 28px; text-align: right; }
.hint {
  font-size: 10.5px;
  color: #888;
  line-height: 1.4;
  background: #f7f8fa;
  padding: 6px 8px;
  border-radius: 5px;
}
.canvas-area {
  flex: 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.canvas-wrap {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: auto;
  padding: 12px;
  background: #d0d4d8;
  border-radius: 8px;
  -webkit-overflow-scrolling: touch;
}
#canvas-container {
  background: #fff;
  border: 1px solid #bbb;
  box-shadow: 0 3px 14px rgba(0,0,0,.12);
  line-height: 0;
  flex-shrink: 0;
}
#c { display: block; touch-action: none; }
.status {
  flex-shrink: 0;
  font-size: 11px;
  color: #555;
  background: #fff;
  border-radius: 5px;
  padding: 7px 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.preload { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
@media (max-width: 900px) {
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { padding: 8px; gap: 8px; flex-direction: column; }
  .panel { width: 100%; min-width: 0; height: auto; max-height: none; }
  .canvas-area { width: 100%; min-height: 50vh; height: auto; }
}
@media (max-width: 480px) {
  body { padding: 6px; gap: 6px; }
  .panel { padding: 10px; }
  button { padding: 8px 6px; font-size: 11px; }
  .canvas-wrap { padding: 6px; }
}
</style>
</head>
<body>
<div class="preload" style="font-family:'Rampart One'">a</div>
<div class="preload" style="font-family:'Dela Gothic One'">a</div>
<div class="preload" style="font-family:'Hachi Maru Pop'">a</div>
<div class="preload" style="font-family:'M PLUS Rounded 1c'">a</div>

<div class="panel">
  <h1>VTuberロゴメーカー</h1>
  <p class="subtitle">テキストを追加 → 選択して色・縁・影を調整。ドラッグで移動できます。</p>

  <!-- テキスト追加 -->
  <div class="section" style="border-top:none;padding-top:0">
    <div class="section-title">① テキストを追加</div>
    <div class="field">
      <label>テキスト</label>
      <div class="row">
        <input type="text" id="textInput" value="ドル鯖" placeholder="名前を入力">
        <button id="addTextBtn">追加</button>
      </div>
    </div>
    <div class="field">
      <label>フォント</label>
      <select id="fontSelect">
        <option value="Rampart One" selected>Rampart One（立体）</option>
        <option value="Dela Gothic One">Dela Gothic One（太ゴ）</option>
        <option value="Yomogi">Yomogi（手書き）</option>
        <option value="Hachi Maru Pop">Hachi Maru Pop（ポップ）</option>
        <option value="Zen Maru Gothic">Zen Maru Gothic（丸ゴ）</option>
        <option value="M PLUS Rounded 1c">M PLUS Rounded</option>
        <option value="Noto Sans JP">Noto Sans JP</option>
        <option value="Noto Serif JP">Noto Serif JP（明朝）</option>
        <option value="Shippori Mincho">Shippori Mincho</option>
        <option value="Kaisei Decol">Kaisei Decol</option>
        <option value="Reggae One">Reggae One</option>
        <option value="Potta One">Potta One</option>
        <option value="Stick">Stick</option>
        <option value="RocknRoll One">RocknRoll One</option>
        <option value="DotGothic16">DotGothic16（ドット）</option>
        <option value="Sawarabi Gothic">Sawarabi Gothic</option>
        <option value="Sawarabi Mincho">Sawarabi Mincho</option>
        <option value="Kosugi Maru">Kosugi Maru</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Impact">Impact</option>
        <option value="Arial Black">Arial Black</option>
      </select>
    </div>
    <div class="field">
      <label>文字サイズ <span id="fontSizeVal" class="value">72</span></label>
      <input type="range" id="fontSize" min="20" max="180" value="72">
    </div>
  </div>

  <!-- 文字色・塗り -->
  <div class="section">
    <div class="section-title">② 文字の色</div>
    <div class="row">
      <div class="field" style="flex:1">
        <label>文字色</label>
        <div class="row">
          <input type="color" id="textColor" value="#0055ff">
          <span style="font-size:11px;color:#666">メイン</span>
        </div>
      </div>
      <div class="field" style="flex:1">
        <label>塗り色（下側）</label>
        <div class="row">
          <input type="color" id="midColor" value="#8ec8ff">
          <button class="secondary" id="syncMidBtn" style="padding:6px 8px;font-size:11px">文字色に合わせる</button>
        </div>
      </div>
    </div>
    <label class="inline-check">
      <input type="checkbox" id="gradient">
      グラデーション（上：文字色 → 下：塗り色）
    </label>
  </div>

  <!-- 縁 -->
  <div class="section">
    <div class="section-title">③ 縁（アウトライン）</div>
    <div class="row">
      <div class="field" style="flex:1">
        <label>縁の色</label>
        <input type="color" id="strokeColor" value="#ff2200">
      </div>
      <div class="field" style="flex:1">
        <label>縁の太さ <span id="strokeWidthVal" class="value">12</span></label>
        <input type="range" id="strokeWidth" min="0" max="40" value="12">
      </div>
    </div>
    <label class="inline-check">
      <input type="checkbox" id="outer" checked>
      外側のみ（文字の中を潰さない）
    </label>
    <p class="hint">チェックON＝縁は文字の外側だけに付きます。OFF＝通常の縁（中も少し染まります）。</p>
  </div>

  <!-- 影 -->
  <div class="section">
    <div class="section-title">④ 影</div>
    <div class="grid2">
      <div class="field">
        <label>影の色</label>
        <input type="color" id="shadowColor" value="#000000">
      </div>
      <div class="field">
        <label>ぼかし</label>
        <input type="number" id="shadowBlur" min="0" max="80" value="8">
      </div>
    </div>
    <div class="field">
      <label>影のズレ <span id="shadowOffsetVal" class="value">5</span></label>
      <input type="range" id="shadowOffset" min="-40" max="40" value="5">
    </div>
  </div>

  <!-- 描画モード -->
  <div class="section">
    <div class="section-title">⑤ 描画・編集</div>
    <div class="mode">
      <button id="selectBtn" class="active">選択・移動</button>
      <button id="penBtn">ペン</button>
      <button id="eraserBtn">消しゴム</button>
    </div>
    <div class="row">
      <input type="color" id="penColor" value="#000000">
      <input type="range" id="penWidth" min="1" max="40" value="6">
      <span class="value" id="penWidthVal">6</span>
    </div>
    <p class="hint">「選択・移動」でオブジェクトをドラッグして動かせます。ダブルクリックで文字編集。</p>
  </div>

  <!-- 図形・画像 -->
  <div class="section">
    <div class="section-title">⑥ 図形・画像を追加</div>
    <div class="grid2">
      <button id="addRectBtn" class="secondary">□ 四角</button>
      <button id="addCircleBtn" class="secondary">○ 丸</button>
      <button id="addTriangleBtn" class="secondary">△ 三角</button>
      <button id="importImageBtn" class="secondary">🖼 画像</button>
    </div>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
  </div>

  <!-- 整列・削除 -->
  <div class="section">
    <div class="section-title">⑦ 並べ替え・削除</div>
    <div class="grid2">
      <button id="bringForwardBtn" class="secondary">前面へ</button>
      <button id="sendBackwardBtn" class="secondary">背面へ</button>
      <button id="deleteBtn" class="danger">選択を削除</button>
      <button id="clearBtn" class="danger">全部消す</button>
    </div>
    <div class="grid2" style="margin-top:4px">
      <button id="undoBtn" class="secondary">↩ 戻る</button>
      <button id="redoBtn" class="secondary">進む ↪</button>
    </div>
  </div>

  <!-- 保存 -->
  <div class="section">
    <div class="section-title">⑧ 保存</div>
    <div class="row">
      <select id="exportScale" style="width:auto;min-width:70px">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
      </select>
      <button id="downloadBtn" style="flex:1">背景透過PNGで保存</button>
    </div>
  </div>
</div>

<div class="canvas-area">
  <div class="canvas-wrap">
    <div id="canvas-container">
      <canvas id="c" width="900" height="520"></canvas>
    </div>
  </div>
  <div class="status">
    <span id="statusInfo">準備完了 — 「追加」でテキストを入れて、ドラッグで移動できます</span>
  </div>
</div>

<script>
(function () {
  // Google Fonts
  const fontLink = document.createElement('link');
  fontLink.href = 'https://fonts.googleapis.com/css2?family=Yomogi&family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Rampart+One&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Kaisei+Decol:wght@400;500;700&family=Reggae+One&family=Potta+One&family=Stick&family=RocknRoll+One&family=DotGothic16&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Kosugi+Maru&display=swap';
  fontLink.rel = 'stylesheet';
  document.head.appendChild(fontLink);

  const canvas = new fabric.Canvas('c', {
    backgroundColor: '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    allowTouchScrolling: false,
    stopContextMenu: true
  });

  // テキストのコントロールを大きくして掴みやすく
  fabric.Object.prototype.set({
    transparentCorners: false,
    borderColor: '#4a90e2',
    cornerColor: '#4a90e2',
    cornerStyle: 'circle',
    cornerSize: 12,
    padding: 6
  });

  let isEraser = false;
  let isInternal = false;
  let isRestoring = false;
  const history = [];
  let historyIndex = -1;
  const MAX_HISTORY = 40;

  // 外側縁を少し太くするための加算（見た目が自然になる）
  const OUTER_EXTRA_RATIO = 1.35;
  const OUTER_EXTRA_MIN = 8;

  const $ = id => document.getElementById(id);
  const textInput = $('textInput');
  const addTextBtn = $('addTextBtn');
  const fontSelect = $('fontSelect');
  const fontSize = $('fontSize');
  const fontSizeVal = $('fontSizeVal');
  const textColor = $('textColor');
  const midColor = $('midColor');
  const syncMidBtn = $('syncMidBtn');
  const gradient = $('gradient');
  const strokeColor = $('strokeColor');
  const strokeWidth = $('strokeWidth');
  const strokeWidthVal = $('strokeWidthVal');
  const outer = $('outer');
  const shadowColor = $('shadowColor');
  const shadowBlur = $('shadowBlur');
  const shadowOffset = $('shadowOffset');
  const shadowOffsetVal = $('shadowOffsetVal');
  const penColor = $('penColor');
  const penWidth = $('penWidth');
  const penWidthVal = $('penWidthVal');
  const penBtn = $('penBtn');
  const eraserBtn = $('eraserBtn');
  const selectBtn = $('selectBtn');
  const bringForwardBtn = $('bringForwardBtn');
  const sendBackwardBtn = $('sendBackwardBtn');
  const deleteBtn = $('deleteBtn');
  const addRectBtn = $('addRectBtn');
  const addCircleBtn = $('addCircleBtn');
  const addTriangleBtn = $('addTriangleBtn');
  const importImageBtn = $('importImageBtn');
  const imageInput = $('imageInput');
  const downloadBtn = $('downloadBtn');
  const clearBtn = $('clearBtn');
  const undoBtn = $('undoBtn');
  const redoBtn = $('redoBtn');
  const exportScale = $('exportScale');
  const statusInfo = $('statusInfo');

  function setStatus(msg) {
    statusInfo.textContent = msg;
  }

  // ---------- History ----------
  function saveHistory() {
    if (isRestoring || isInternal) return;
    history.splice(historyIndex + 1);
    history.push(canvas.toJSON([
      'selectable', 'evented', 'isOutline', 'ownerId', 'textId',
      'outlineW', 'outlineCol', 'outerOnly',
      'shadowOn', 'shadowBlurVal', 'shadowOffVal', 'shadowColVal',
      'gradOn', 'textColVal', 'fillColVal'
    ]));
    if (history.length > MAX_HISTORY) history.shift();
    else historyIndex++;
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    undoBtn.disabled = historyIndex <= 0;
    redoBtn.disabled = historyIndex >= history.length - 1;
  }

  function restoreHistory(idx) {
    if (idx < 0 || idx >= history.length) return;
    isRestoring = true;
    canvas.loadFromJSON(history[idx], () => {
      canvas.getObjects().forEach(o => {
        if (o.isOutline) {
          o.selectable = false;
          o.evented = false;
        }
      });
      canvas.renderAll();
      isRestoring = false;
      historyIndex = idx;
      updateHistoryButtons();
      setStatus('履歴を復元しました');
    });
  }

  // ---------- Outline helpers ----------
  function getOutline(textObj) {
    if (!textObj || textObj.isOutline || !textObj.textId) return null;
    return canvas.getObjects().find(o => o.isOutline && o.ownerId === textObj.textId) || null;
  }

  function calcOuterWidth(w) {
    w = Math.max(0, parseInt(w) || 0);
    if (!w) return 0;
    return w + Math.max(OUTER_EXTRA_MIN, Math.round(w * OUTER_EXTRA_RATIO));
  }

  function makeGradient(obj) {
    if (!obj.gradOn) return obj.fillColVal || midColor.value;
    const h = Math.max(obj.height || obj.fontSize || 72, 1);
    return new fabric.Gradient({
      type: 'linear',
      coords: { x1: 0, y1: -h / 2, x2: 0, y2: h / 2 },
      colorStops: [
        { offset: 0, color: obj.textColVal || textColor.value },
        { offset: 1, color: obj.fillColVal || midColor.value }
      ]
    });
  }

  function makeShadow(obj) {
    if (!obj.shadowOn) return null;
    const off = parseInt(obj.shadowOffVal) || 0;
    return new fabric.Shadow({
      color: obj.shadowColVal || shadowColor.value,
      blur: parseInt(obj.shadowBlurVal) || 0,
      offsetX: off,
      offsetY: off
    });
  }

  function createText(text) {
    const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const w = parseInt(strokeWidth.value) || 0;
    const obj = new fabric.IText(text, {
      left: canvas.width / 2,
      top: canvas.height / 2,
      originX: 'center',
      originY: 'center',
      fontFamily: fontSelect.value,
      fontSize: parseInt(fontSize.value),
      fill: gradient.checked ? null : textColor.value,
      stroke: null,
      strokeWidth: 0,
      paintFirst: 'fill',
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      editable: true,
      objectCaching: false,
      selectable: true,
      evented: true,
      hasControls: true,
      hasBorders: true,
      lockMovementX: false,
      lockMovementY: false,
      // custom props
      textId: id,
      outlineW: w,
      outlineCol: strokeColor.value,
      outerOnly: outer.checked,
      shadowOn: true,
      shadowColVal: shadowColor.value,
      shadowBlurVal: parseInt(shadowBlur.value) || 0,
      shadowOffVal: parseInt(shadowOffset.value) || 0,
      gradOn: gradient.checked,
      textColVal: textColor.value,
      fillColVal: midColor.value
    });
    obj.fill = makeGradient(obj);
    obj.shadow = makeShadow(obj);
    return obj;
  }

  function createOutline(textObj) {
    const useOuter = textObj.outerOnly !== false;
    const ow = useOuter
      ? calcOuterWidth(textObj.outlineW)
      : Math.max(0, parseInt(textObj.outlineW) || 0);
    const col = textObj.outlineCol || strokeColor.value;
    return new fabric.IText(textObj.text, {
      left: textObj.left,
      top: textObj.top,
      originX: textObj.originX,
      originY: textObj.originY,
      scaleX: textObj.scaleX,
      scaleY: textObj.scaleY,
      angle: textObj.angle,
      skewX: textObj.skewX,
      skewY: textObj.skewY,
      flipX: textObj.flipX,
      flipY: textObj.flipY,
      fontFamily: textObj.fontFamily,
      fontSize: textObj.fontSize,
      fontWeight: textObj.fontWeight,
      fontStyle: textObj.fontStyle,
      charSpacing: textObj.charSpacing,
      lineHeight: textObj.lineHeight,
      fill: col,
      stroke: col,
      strokeWidth: ow,
      paintFirst: 'stroke',
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      selectable: false,
      evented: false,
      editable: false,
      objectCaching: false,
      hasControls: false,
      hasBorders: false,
      isOutline: true,
      ownerId: textObj.textId,
      opacity: ow > 0 ? 1 : 0
    });
  }

  function syncOutline(obj) {
    if (!obj || obj.isOutline || !['i-text', 'text'].includes(obj.type)) return;
    const o = getOutline(obj);
    if (!o) return;
    const useOuter = obj.outerOnly !== false;
    const ow = useOuter
      ? calcOuterWidth(obj.outlineW)
      : Math.max(0, parseInt(obj.outlineW) || 0);
    const col = obj.outlineCol || strokeColor.value;
    o.set({
      left: obj.left,
      top: obj.top,
      scaleX: obj.scaleX,
      scaleY: obj.scaleY,
      angle: obj.angle,
      skewX: obj.skewX,
      skewY: obj.skewY,
      flipX: obj.flipX,
      flipY: obj.flipY,
      text: obj.text,
      fontFamily: obj.fontFamily,
      fontSize: obj.fontSize,
      fontWeight: obj.fontWeight,
      fontStyle: obj.fontStyle,
      charSpacing: obj.charSpacing,
      lineHeight: obj.lineHeight,
      fill: col,
      stroke: col,
      strokeWidth: ow,
      opacity: ow > 0 ? 1 : 0,
      objectCaching: false
    });
    o.initDimensions();
    o.setCoords();
    o.dirty = true;
    // アウトラインをテキストのすぐ後ろに保つ
    const idx = canvas.getObjects().indexOf(obj);
    if (idx > 0) {
      const oIdx = canvas.getObjects().indexOf(o);
      if (oIdx !== idx - 1) {
        canvas.moveTo(o, Math.max(0, idx - 1));
      }
    }
    canvas.requestRenderAll();
  }

  function addTextWithOutline(obj) {
    const outline = createOutline(obj);
    isInternal = true;
    canvas.add(outline);
    canvas.add(obj);
    isInternal = false;
    canvas.setActiveObject(obj);
    canvas.requestRenderAll();
    // 編集状態に入ると移動しにくくなるので、追加直後は編集しない
    setTimeout(() => {
      try {
        if (obj.enterEditing) {
          // 意図的に編集モードにしない（移動優先）
        }
      } catch (e) {}
    }, 0);
    saveHistory();
  }

  function removeTextWithOutline(obj) {
    if (!obj) return;
    const o = getOutline(obj);
    isInternal = true;
    if (o) canvas.remove(o);
    canvas.remove(obj);
    isInternal = false;
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    saveHistory();
  }

  // ---------- Events: keep outline in sync ----------
  canvas.on('object:modified', e => {
    if (!isRestoring && e.target && !e.target.isOutline) {
      syncOutline(e.target);
    }
    if (!isInternal) saveHistory();
  });

  canvas.on('object:added', () => {
    if (!isRestoring && !isInternal) saveHistory();
  });

  canvas.on('object:removed', () => {
    if (!isRestoring && !isInternal) saveHistory();
  });

  canvas.on('path:created', () => {
    if (!isInternal) saveHistory();
  });

  ['moving', 'scaling', 'rotating', 'skewing'].forEach(ev => {
    canvas.on('object:' + ev, e => {
      if (e.target && !e.target.isOutline) syncOutline(e.target);
    });
  });

  canvas.on('text:changed', e => {
    if (e.target && !e.target.isOutline) {
      syncOutline(e.target);
      if (!isInternal) saveHistory();
    }
  });

  // 選択時にアウトラインを掴んでしまわないように
  canvas.on('selection:created', e => {
    const t = e.selected && e.selected[0];
    if (t && t.isOutline) {
      canvas.discardActiveObject();
      const owner = canvas.getObjects().find(o => o.textId === t.ownerId);
      if (owner) canvas.setActiveObject(owner);
      canvas.requestRenderAll();
    }
    updateControlsFromObject();
  });

  canvas.on('selection:updated', updateControlsFromObject);

  // ---------- Mode ----------
  function setMode(mode) {
    [penBtn, eraserBtn, selectBtn].forEach(b => b.classList.remove('active'));
    canvas.isDrawingMode = false;
    isEraser = false;
    if (mode === 'pen') {
      penBtn.classList.add('active');
      canvas.isDrawingMode = true;
      const brush = new fabric.PencilBrush(canvas);
      brush.color = penColor.value;
      brush.width = parseInt(penWidth.value);
      brush.globalCompositeOperation = 'source-over';
      canvas.freeDrawingBrush = brush;
      setStatus('ペンモード — 線を描けます');
    } else if (mode === 'eraser') {
      eraserBtn.classList.add('active');
      canvas.isDrawingMode = true;
      const brush = new fabric.PencilBrush(canvas);
      brush.color = '#000';
      brush.width = parseInt(penWidth.value) * 2;
      brush.globalCompositeOperation = 'destination-out';
      canvas.freeDrawingBrush = brush;
      isEraser = true;
      setStatus('消しゴムモード — 透過で消します');
    } else {
      selectBtn.classList.add('active');
      setStatus('選択・移動モード — オブジェクトをドラッグして動かせます');
    }
  }

  // ---------- UI bindings ----------
  addTextBtn.onclick = () => {
    const text = textInput.value.trim() || 'テキスト';
    const f = fontSelect.value;
    document.fonts.load(`16px "${f}"`)
      .then(() => {
        addTextWithOutline(createText(text));
        setMode('select');
        setStatus('テキストを追加しました — ドラッグで移動、ダブルクリックで編集');
      })
      .catch(() => {
        addTextWithOutline(createText(text));
        setMode('select');
        setStatus('テキストを追加しました — ドラッグで移動、ダブルクリックで編集');
      });
  };

  textInput.onkeydown = e => {
    if (e.key === 'Enter') addTextBtn.click();
  };

  fontSelect.onchange = () => {
    const a = canvas.getActiveObject();
    if (!a || !['i-text', 'text'].includes(a.type)) return;
    const f = fontSelect.value;
    document.fonts.load(`16px "${f}"`).finally(() => {
      a.set({ fontFamily: f, objectCaching: false });
      a.initDimensions();
      syncOutline(a);
      canvas.requestRenderAll();
      saveHistory();
      setStatus('フォント変更: ' + f);
    });
  };

  fontSize.oninput = () => {
    fontSizeVal.textContent = fontSize.value;
    const a = canvas.getActiveObject();
    if (a && ['i-text', 'text'].includes(a.type)) {
      a.set('fontSize', parseInt(fontSize.value));
      a.initDimensions();
      syncOutline(a);
      canvas.requestRenderAll();
    }
  };
  fontSize.onchange = saveHistory;

  function applyTextColors() {
    const a = canvas.getActiveObject();
    if (!a || !['i-text', 'text'].includes(a.type)) return;
    a.textColVal = textColor.value;
    a.fillColVal = midColor.value;
    a.gradOn = gradient.checked;
    if (a.isEditing && a.selectionStart !== a.selectionEnd) {
      a.setSelectionStyles({ fill: textColor.value }, a.selectionStart, a.selectionEnd);
    } else {
      a.set('fill', makeGradient(a));
    }
    a.dirty = true;
    syncOutline(a);
    canvas.requestRenderAll();
  }

  textColor.oninput = applyTextColors;
  textColor.onchange = saveHistory;
  midColor.oninput = applyTextColors;
  midColor.onchange = saveHistory;
  gradient.onchange = () => {
    applyTextColors();
    saveHistory();
  };

  syncMidBtn.onclick = () => {
    midColor.value = textColor.value;
    applyTextColors();
    setStatus('塗り色を文字色に合わせました');
    saveHistory();
  };

  function updateStroke() {
    strokeWidthVal.textContent = strokeWidth.value;
    const a = canvas.getActiveObject();
    if (!a) return;
    const w = parseInt(strokeWidth.value) || 0;
    if (['i-text', 'text'].includes(a.type)) {
      a.set({
        stroke: null,
        strokeWidth: 0,
        paintFirst: 'fill',
        objectCaching: false,
        outlineW: w,
        outlineCol: strokeColor.value,
        outerOnly: outer.checked
      });
      syncOutline(a);
    } else if (['rect', 'circle', 'triangle'].includes(a.type)) {
      a.set({
        stroke: w > 0 ? strokeColor.value : null,
        strokeWidth: w
      });
    }
    canvas.requestRenderAll();
  }

  strokeColor.oninput = updateStroke;
  strokeWidth.oninput = updateStroke;
  outer.onchange = () => {
    updateStroke();
    saveHistory();
  };
  strokeColor.onchange = saveHistory;
  strokeWidth.onchange = saveHistory;

  function updateShadow() {
    const a = canvas.getActiveObject();
    if (!a || !['i-text', 'text'].includes(a.type)) return;
    a.shadowOn = true;
    a.shadowColVal = shadowColor.value;
    a.shadowBlurVal = parseInt(shadowBlur.value) || 0;
    a.shadowOffVal = parseInt(shadowOffset.value) || 0;
    a.shadow = makeShadow(a);
    canvas.requestRenderAll();
  }

  shadowColor.oninput = updateShadow;
  shadowBlur.oninput = updateShadow;
  shadowOffset.oninput = () => {
    shadowOffsetVal.textContent = shadowOffset.value;
    updateShadow();
  };
  shadowColor.onchange = saveHistory;
  shadowBlur.onchange = saveHistory;
  shadowOffset.onchange = saveHistory;

  penWidth.oninput = () => {
    penWidthVal.textContent = penWidth.value;
    if (canvas.isDrawingMode && canvas.freeDrawingBrush) {
      canvas.freeDrawingBrush.width = isEraser
        ? parseInt(penWidth.value) * 2
        : parseInt(penWidth.value);
    }
  };
  penColor.oninput = () => {
    if (canvas.isDrawingMode && !isEraser && canvas.freeDrawingBrush) {
      canvas.freeDrawingBrush.color = penColor.value;
    }
  };

  penBtn.onclick = () => setMode('pen');
  eraserBtn.onclick = () => setMode('eraser');
  selectBtn.onclick = () => setMode('select');

  function moveWithOutline(obj, dir) {
    const o = getOutline(obj);
    if (dir === 'forward') canvas.bringForward(obj);
    else canvas.sendBackwards(obj);
    if (o) {
      const idx = canvas.getObjects().indexOf(obj);
      if (idx > 0) canvas.moveTo(o, idx - 1);
      else canvas.sendToBack(o);
    }
  }

  bringForwardBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) moveWithOutline(a, 'forward');
    else canvas.bringForward(a);
    canvas.requestRenderAll();
    saveHistory();
  };

  sendBackwardBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) moveWithOutline(a, 'backward');
    else canvas.sendBackwards(a);
    canvas.requestRenderAll();
    saveHistory();
  };

  deleteBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) removeTextWithOutline(a);
    else {
      canvas.remove(a);
      canvas.discardActiveObject();
      canvas.requestRenderAll();
      saveHistory();
    }
  };

  function addShape(type) {
    const w = parseInt(strokeWidth.value) || 0;
    const common = {
      left: canvas.width / 2,
      top: canvas.height / 2,
      originX: 'center',
      originY: 'center',
      fill: midColor.value,
      stroke: w > 0 ? strokeColor.value : null,
      strokeWidth: w,
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      objectCaching: false
    };
    let s;
    if (type === 'rect') s = new fabric.Rect({ ...common, width: 120, height: 120, rx: 8, ry: 8 });
    else if (type === 'circle') s = new fabric.Circle({ ...common, radius: 60 });
    else if (type === 'triangle') s = new fabric.Triangle({ ...common, width: 120, height: 110 });
    if (!s) return;
    canvas.add(s);
    canvas.setActiveObject(s);
    canvas.requestRenderAll();
    setMode('select');
    setStatus(type === 'rect' ? '四角を追加' : type === 'circle' ? '丸を追加' : '三角を追加');
    saveHistory();
  }

  addRectBtn.onclick = () => addShape('rect');
  addCircleBtn.onclick = () => addShape('circle');
  addTriangleBtn.onclick = () => addShape('triangle');

  importImageBtn.onclick = () => imageInput.click();
  imageInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      fabric.Image.fromURL(ev.target.result, img => {
        const max = 400;
        if (img.width > max || img.height > max) {
          img.scale(Math.min(max / img.width, max / img.height));
        }
        img.set({
          left: canvas.width / 2,
          top: canvas.height / 2,
          originX: 'center',
          originY: 'center'
        });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.requestRenderAll();
        setMode('select');
        setStatus('画像を追加しました');
        saveHistory();
      });
    };
    reader.readAsDataURL(file);
    imageInput.value = '';
  };

  downloadBtn.onclick = () => {
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    const bg = canvas.backgroundColor;
    canvas.backgroundColor = null;
    canvas.requestRenderAll();
    const scale = parseInt(exportScale.value) || 2;
    const data = canvas.toDataURL({ format: 'png', quality: 1, multiplier: scale });
    canvas.backgroundColor = bg;
    canvas.requestRenderAll();
    const a = document.createElement('a');
    a.download = 'vtuber-logo.png';
    a.href = data;
    a.click();
    setStatus(`背景透過PNGを保存しました（${scale}x）`);
  };

  clearBtn.onclick = () => {
    if (confirm('キャンバスをすべて消去しますか？')) {
      isInternal = true;
      canvas.clear();
      isInternal = false;
      canvas.backgroundColor = '#ffffff';
      canvas.requestRenderAll();
      saveHistory();
      setStatus('すべて消去しました');
    }
  };

  undoBtn.onclick = () => { if (historyIndex > 0) restoreHistory(historyIndex - 1); };
  redoBtn.onclick = () => { if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1); };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (historyIndex > 0) restoreHistory(historyIndex - 1);
        return;
      }
      if (e.key.toLowerCase() === 'y') {
        e.preventDefault();
        if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
        return;
      }
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (canvas.getActiveObject()?.isEditing || document.activeElement === textInput) return;
      const a = canvas.getActiveObject();
      if (!a) return;
      if (['i-text', 'text'].includes(a.type)) removeTextWithOutline(a);
      else {
        canvas.remove(a);
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        saveHistory();
      }
    }
  });

  function updateControlsFromObject() {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) {
      if (a.fontFamily && Array.from(fontSelect.options).some(o => o.value === a.fontFamily)) {
        fontSelect.value = a.fontFamily;
      }
      if (a.textColVal) textColor.value = a.textColVal;
      if (a.fillColVal) midColor.value = a.fillColVal;
      if (typeof a.outlineW === 'number') {
        strokeWidth.value = a.outlineW;
        strokeWidthVal.textContent = a.outlineW;
      }
      if (a.outlineCol) strokeColor.value = a.outlineCol;
      if (typeof a.fontSize === 'number') {
        fontSize.value = a.fontSize;
        fontSizeVal.textContent = a.fontSize;
      }
      if (typeof a.shadowColVal === 'string') shadowColor.value = a.shadowColVal;
      if (typeof a.shadowBlurVal === 'number') shadowBlur.value = a.shadowBlurVal;
      if (typeof a.shadowOffVal === 'number') {
        shadowOffset.value = a.shadowOffVal;
        shadowOffsetVal.textContent = a.shadowOffVal;
      }
      gradient.checked = !!a.gradOn;
      outer.checked = a.outerOnly !== false;
    } else if (['rect', 'circle', 'triangle'].includes(a.type)) {
      if (a.fill && typeof a.fill === 'string') midColor.value = a.fill;
      if (a.stroke && typeof a.stroke === 'string') strokeColor.value = a.stroke;
      if (typeof a.strokeWidth === 'number') {
        strokeWidth.value = a.strokeWidth;
        strokeWidthVal.textContent = a.strokeWidth;
      }
    }
  }

  // キャンバスサイズフィット
  function fitCanvas() {
    const wrap = document.querySelector('.canvas-wrap');
    if (!wrap) return;
    const padding = 20;
    const aw = wrap.clientWidth - padding;
    const ah = wrap.clientHeight - padding;
    const baseW = 900, baseH = 520;
    const ratio = baseW / baseH;
    let nw, nh;
    if (aw / ah > ratio) {
      nh = Math.min(baseH, ah);
      nw = nh * ratio;
    } else {
      nw = Math.min(baseW, aw);
      nh = nw / ratio;
    }
    nw = Math.max(100, Math.round(nw));
    nh = Math.max(60, Math.round(nh));
    if (Math.abs(canvas.getWidth() - nw) > 4 || Math.abs(canvas.getHeight() - nh) > 4) {
      canvas.setDimensions({ width: nw, height: nh });
      canvas.requestRenderAll();
    }
  }

  window.addEventListener('resize', () => setTimeout(fitCanvas, 100));
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 200));

  setMode('select');
  setStatus('準備完了 — 「追加」でテキストを入れて、ドラッグで移動できます');
  setTimeout(() => {
    fitCanvas();
    saveHistory();
  }, 400);
})();
</script>
</body>
</html>
