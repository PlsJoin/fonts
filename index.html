<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VTuberネームロゴメーカー（修正版3）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
  background: #f0f2f5;
  color: #333;
  display: flex;
  gap: 16px;
  padding: 16px;
}

/* =========================
   左側パネル
========================= */

.panel {
  background: #fff;
  width: 340px;
  height: 100%;
  padding: 15px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
}

.panel h1 {
  font-size: 16px;
  margin-bottom: 2px;
}

.panel small {
  color: #777;
  font-size: 11px;
}

.section {
  border-top: 1px solid #eee;
  padding-top: 10px;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.row label,
.field label {
  font-size: .8rem;
  font-weight: bold;
}

.row label {
  flex: 1;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.inline-check {
  font-size: .8rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* =========================
   入力
========================= */

input[type="text"],
input[type="number"],
select {
  width: 100%;
  padding: 6px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  background: #fff;
}

input[type="text"]:focus,
input[type="number"]:focus,
select:focus {
  outline: none;
  border-color: #4a90e2;
}

input[type="color"] {
  width: 40px;
  height: 28px;
  cursor: pointer;
  border: 1px solid #ccc;
  padding: 1px;
  background: #fff;
  border-radius: 4px;
  flex-shrink: 0;
}

input[type="range"] {
  width: 100%;
}

input[type="checkbox"] {
  flex-shrink: 0;
}

/* =========================
   ボタン
========================= */

button {
  padding: 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  background: #4a90e2;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .1s;
  -webkit-tap-highlight-color: transparent;
}

button:hover {
  background: #357abd;
}

button:active {
  background: #2868a8;
}

button.secondary {
  background: #eee;
  color: #333;
}

button.secondary:hover {
  background: #ddd;
}

button.danger {
  background: #d9534f;
  color: #fff;
}

button.danger:hover {
  background: #c9302c;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* =========================
   モードボタン
========================= */

.mode {
  display: flex;
  gap: 4px;
}

.mode button {
  flex: 1;
}

.mode button.active {
  background: #357abd;
  color: #fff;
}

/* =========================
   数値表示
========================= */

.value {
  font-size: 11px;
  color: #666;
  min-width: 30px;
  text-align: right;
}

/* =========================
   キャンバス側
========================= */

.canvas-area {
  flex: 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.canvas-wrap {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: auto;
  padding: 12px;
  background: #e5e5e5;
  -webkit-overflow-scrolling: touch;
}

#canvas-container {
  background: #fff;
  border: 1px solid #ccc;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
  line-height: 0;
  flex-shrink: 0;
}

#c {
  display: block;
  touch-action: none;
}

/* =========================
   ステータス
========================= */

.status {
  flex-shrink: 0;
  font-size: 11px;
  color: #666;
  background: #fff;
  border-radius: 4px;
  padding: 7px 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

/* =========================
   フォント読み込み用
========================= */

.preload {
  position: absolute;
  left: -9999px;
  opacity: 0;
}

/* =========================
   PC
========================= */

@media (min-width: 901px) {

  body {
    flex-direction: row;
  }

    width: 340px;
    min-width: 340px;
  }

  .canvas-area {
    height: 100%;
  }

}

/* =========================
   タブレット
========================= */

@media (max-width: 900px) {

  html,
  body {
    overflow: auto;
    height: auto;
    min-height: 100%;
  }

  body {
    padding: 10px;
    gap: 10px;
    flex-direction: column;
  }

  .panel {

  }

    width: 100%;
    min-height: 55vh;
    height: auto;
  }

}

/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

  body {
    padding: 6px;
    gap: 8px;
  }

  .panel {
    padding: 12px;
  }

  .grid2 {
    gap: 6px;
  }

  button {
    padding: 9px 7px;
  }

  .canvas-wrap {
    padding: 6px;
  }

}

<body>

<div class="preload" style="font-family:'Rampart One'">a</div>

<div class="preload" style="font-family:'Hachi Maru Pop'">a</div>

<div class="panel">

  <h1>VTuberロゴメーカー</h1>
  <small>テキストの細かい色・縁・影まで調整できます。</small>

  <div class="field">
    <label>テキスト</label>
    <div class="row">

      <option value="Reggae One">Reggae One</option>
      <option value="Potta One">Potta One</option>

  <div class="field">
    <label>文字サイズ <span id="fontSizeVal">72</span></label>
    <input type="range" id="fontSize" min="20" max="160" value="72">
  </div>

  <div class="field">
    <label>文字色</label>
    <div class="row">
      <input type="color" id="textColor" value="#0055ff">
      <span>内側・文字色</span>
    </div>
  </div>

    <label>塗り色</label>

  <div class="section">

<div class="canvas-area">

  <div class="canvas-wrap">
    <div id="canvas-container">

  <div class="status">
    <span id="statusInfo">準備完了</span>
  </div>

</div>

<script>

const fontLink=document.createElement('link');

fontLink.href='https://fonts.googleapis.com/css2?family=Yomogi&family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Rampart+One&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Kaisei+Decol:wght@400;500;700&family=Reggae+One&family=Potta+One&family=Stick&family=RocknRoll+One&family=DotGothic16&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Kosugi+Maru&display=swap';

fontLink.rel='stylesheet';

document.head.appendChild(fontLink);

const canvas=new fabric.Canvas('c',{
  backgroundColor:'#fff',
  preserveObjectStacking:true,
  selection:true,
  allowTouchScrolling:false
});

let isEraser=false,
    isInternalOperation=false,
    isRestoring=false;

const history=[];
let historyIndex=-1;

const MAX_HISTORY=50;
const CONNECTED_OUTLINE_BASE_EXTRA=10;

const $=id=>document.getElementById(id);

const textInput=$('textInput'),
      addTextBtn=$('addTextBtn'),
      fontSelect=$('fontSelect'),
      fontSize=$('fontSize'),
      fontSizeVal=$('fontSizeVal');

const textColor=$('textColor'),
      midColor=$('midColor'),
      syncMidBtn=$('syncMidBtn'),
      gradient=$('gradient'),
      gradientColor=$('gradientColor');

const strokeColor=$('strokeColor'),
      strokeWidth=$('strokeWidth'),
      strokeWidthVal=$('strokeWidthVal'),
      outer=$('outer');

const shadowColor=$('shadowColor'),
      shadowBlur=$('shadowBlur'),
      shadowOffset=$('shadowOffset'),
      shadowOffsetVal=$('shadowOffsetVal');

const penColor=$('penColor'),
      penWidth=$('penWidth'),
      penWidthVal=$('penWidthVal');

const penBtn=$('penBtn'),
      eraserBtn=$('eraserBtn'),
      selectBtn=$('selectBtn');

const bringForwardBtn=$('bringForwardBtn'),
      sendBackwardBtn=$('sendBackwardBtn'),
      deleteBtn=$('deleteBtn');

const addRectBtn=$('addRectBtn'),
      addCircleBtn=$('addCircleBtn'),
      addTriangleBtn=$('addTriangleBtn');

const importImageBtn=$('importImageBtn'),
      imageInput=$('imageInput'),
      downloadBtn=$('downloadBtn'),
      clearBtn=$('clearBtn');

const undoBtn=$('undoBtn'),
      redoBtn=$('redoBtn'),
      exportScale=$('exportScale'),
      statusInfo=$('statusInfo');


function setStatus(msg){
  statusInfo.textContent=msg;
}


function saveHistory(){

  if(isRestoring||isInternalOperation)return;

  history.splice(historyIndex+1);

  history.push(
    canvas.toJSON([
      'selectable',
      'evented',
      'isConnectedOutline',
      'outlineOwnerId',
      'textObjectId',
      'outlineWidth',
      'outlineColor',
      'shadowEnabled',
      'shadowBlurValue',
      'shadowOffsetValue',
      'gradientEnabled',
      'gradientColorValue',
      'innerStrokeWidth',
      'outerOnly',
      'textColorValue',
      'shadowColorValue'
    ])
  );

  if(history.length>MAX_HISTORY){
    history.shift();
  }else{
    historyIndex++;
  }

  updateHistoryButtons();
}


function updateHistoryButtons(){

  undoBtn.disabled=historyIndex<=0;
  redoBtn.disabled=historyIndex>=history.length-1;

}


function restoreHistory(index){

  if(index<0||index>=history.length)return;

  isRestoring=true;

  canvas.loadFromJSON(history[index],()=>{

    canvas.getObjects().forEach(o=>{

      if(o.isConnectedOutline){
        o.selectable=false;
        o.evented=false;
      }

    });

    canvas.renderAll();

    isRestoring=false;

    historyIndex=index;

    updateHistoryButtons();

    setStatus('履歴を復元しました');

  });

}


setTimeout(saveHistory,300);


canvas.on('object:modified',e=>{

  if(!isRestoring &&
     e.target &&
     !e.target.isConnectedOutline){

    syncConnectedOutline(e.target);

  }

  if(!isInternalOperation){
    saveHistory();
  }

});


canvas.on('object:added',()=>{

  if(!isRestoring&&!isInternalOperation){
    saveHistory();
  }

});


canvas.on('object:removed',()=>{

  if(!isRestoring&&!isInternalOperation){
    saveHistory();
  }

});


canvas.on('path:created',()=>{

  if(!isInternalOperation){
    saveHistory();
  }

});


['moving','scaling','rotating','skewing'].forEach(ev=>{

  canvas.on('object:'+ev,e=>{

    if(e.target&&!e.target.isConnectedOutline){
      syncConnectedOutline(e.target);
    }

  });

});


canvas.on('text:changed',e=>{

  if(e.target&&!e.target.isConnectedOutline){

    syncConnectedOutline(e.target);

    if(!isInternalOperation){
      saveHistory();
    }

  }

});


canvas.on('mouse:down',()=>{

  if(isEraser&&canvas.freeDrawingBrush){

    canvas.freeDrawingBrush.globalCompositeOperation='destination-out';

  }

});


function setMode(mode){

  [penBtn,eraserBtn,selectBtn].forEach(
    b=>b.classList.remove('active')
  );

  canvas.isDrawingMode=false;
  isEraser=false;

  if(mode==='pen'){

    penBtn.classList.add('active');

    canvas.isDrawingMode=true;

    const brush=new fabric.PencilBrush(canvas);

    brush.color=penColor.value;
    brush.width=parseInt(penWidth.value);
    brush.globalCompositeOperation='source-over';

    canvas.freeDrawingBrush=brush;

    setStatus('ペンモード');

  }

  else if(mode==='eraser'){

    eraserBtn.classList.add('active');

    canvas.isDrawingMode=true;

    const brush=new fabric.PencilBrush(canvas);

    brush.color='#000';
    brush.width=parseInt(penWidth.value)*2;
    brush.globalCompositeOperation='destination-out';

    canvas.freeDrawingBrush=brush;

    isEraser=true;

    setStatus('消しゴムモード（透過で消します）');

  }

  else{

    selectBtn.classList.add('active');

    setStatus('選択モード');

  }

}


function getConnectedOutline(obj){

  return obj &&
         !obj.isConnectedOutline &&
         obj.textObjectId
    ? canvas.getObjects().find(
        o=>o.isConnectedOutline &&
            o.outlineOwnerId===obj.textObjectId
      )||null
    : null;

}


function getOuterStrokeWidth(obj){

  const w=Math.max(
    0,
    parseInt(obj.outlineWidth)||0
  );

  if(!w)return 0;

  return w+
         Math.max(
           CONNECTED_OUTLINE_BASE_EXTRA,
           Math.round(w*1.4)
         );

}


function makeGradient(obj){

  if(!obj.gradientEnabled){
    return obj.fill||midColor.value;
  }

  const h=Math.max(
    obj.height||obj.fontSize||72,
    1
  );

  const g=new fabric.Gradient({

    type:'linear',

    coords:{
      x1:0,
      y1:-h/2,
      x2:0,
      y2:h/2
    },

    colorStops:[
      {
        offset:0,
        color:obj.textColorValue||textColor.value
      },
      {
        offset:1,
        color:obj.gradientColorValue||gradientColor.value
      }
    ]

  });

  return g;

}


function makeShadow(obj){

  if(!obj.shadowEnabled)return null;

  const off=parseInt(
    obj.shadowOffsetValue
  )||0;

  return new fabric.Shadow({

    color:obj.shadowColorValue||shadowColor.value,

    blur:parseInt(
      obj.shadowBlurValue
    )||0,

    offsetX:off,
    offsetY:off

  });

}


function createTextObject(text){

  const w=parseInt(strokeWidth.value)||0;

  const id=
    'text_'+
    Date.now()+
    '_'+
    Math.random().toString(36).slice(2,8);

  const obj=new fabric.IText(text,{

    left:canvas.width/2,
    top:canvas.height/2,

    originX:'center',
    originY:'center',

    fontFamily:fontSelect.value,

    fontSize:parseInt(fontSize.value),

    fill:textColor.value,

    stroke:null,
    strokeWidth:0,

    paintFirst:'fill',

    strokeLineJoin:'round',
    strokeLineCap:'round',

    editable:true,

    objectCaching:false,

    outlineWidth:w,

    outlineColor:strokeColor.value,

    textObjectId:id,

    shadowEnabled:true,

    shadowColorValue:shadowColor.value,

    shadowBlurValue:
      parseInt(shadowBlur.value)||0,

    shadowOffsetValue:
      parseInt(shadowOffset.value)||0,

    gradientEnabled:gradient.checked,

    gradientColorValue:gradientColor.value,

    innerStrokeWidth:0,

    outerOnly:outer.checked,

    textColorValue:textColor.value

  });

  obj.shadow=makeShadow(obj);

  return obj;

}


function createConnectedOutline(textObj){

  const outerW=
    outer.checked
      ? getOuterStrokeWidth(textObj)
      : Math.max(
          0,
          parseInt(textObj.outlineWidth)||0
        );

  const col=
    textObj.outlineColor||
    strokeColor.value;

  return new fabric.IText(textObj.text,{

    left:textObj.left,
    top:textObj.top,

    originX:textObj.originX,
    originY:textObj.originY,

    scaleX:textObj.scaleX,
    scaleY:textObj.scaleY,

    angle:textObj.angle,

    skewX:textObj.skewX,
    skewY:textObj.skewY,

    flipX:textObj.flipX,
    flipY:textObj.flipY,

    fontFamily:textObj.fontFamily,
    fontSize:textObj.fontSize,

    fontWeight:textObj.fontWeight,
    fontStyle:textObj.fontStyle,

    charSpacing:textObj.charSpacing,
    lineHeight:textObj.lineHeight,

    fill:col,
    stroke:col,

    strokeWidth:outerW,

    paintFirst:'stroke',

    strokeLineJoin:'round',
    strokeLineCap:'round',

    selectable:false,
    evented:false,
    editable:false,

    objectCaching:false,

    isConnectedOutline:true,

    outlineOwnerId:textObj.textObjectId,

    opacity:outerW>0?1:0

  });

}


function syncConnectedOutline(obj){

  if(
    !obj||
    obj.isConnectedOutline||
    !['i-text','text'].includes(obj.type)
  )return;

  const o=getConnectedOutline(obj);

  if(!o)return;

  const ow=
    obj.outerOnly===false
      ? Math.max(
          0,
          parseInt(obj.outlineWidth)||0
        )
      : getOuterStrokeWidth(obj);

  const col=
    obj.outlineColor||
    strokeColor.value;

  o.set({

    left:obj.left,
    top:obj.top,

    scaleX:obj.scaleX,
    scaleY:obj.scaleY,

    angle:obj.angle,

    skewX:obj.skewX,
    skewY:obj.skewY,

    flipX:obj.flipX,
    flipY:obj.flipY,

    text:obj.text,

    fontFamily:obj.fontFamily,
    fontSize:obj.fontSize,

    fontWeight:obj.fontWeight,
    fontStyle:obj.fontStyle,

    charSpacing:obj.charSpacing,
    lineHeight:obj.lineHeight,

    fill:col,
    stroke:col,

    strokeWidth:ow,

    opacity:ow>0?1:0,

    objectCaching:false

  });

  o.initDimensions();
  o.setCoords();

  o.dirty=true;

  canvas.requestRenderAll();

}


function addTextWithOutline(obj){

  const outline=createConnectedOutline(obj);

  isInternalOperation=true;

  canvas.add(outline);
  canvas.add(obj);

  isInternalOperation=false;

  canvas.setActiveObject(obj);

  try{

    obj.enterEditing();
    obj.selectAll();

  }catch(e){}

  canvas.requestRenderAll();

  saveHistory();

}


function removeTextWithOutline(obj){

  if(!obj)return;

  const o=getConnectedOutline(obj);

  isInternalOperation=true;

  if(o)canvas.remove(o);

  canvas.remove(obj);

  isInternalOperation=false;

  canvas.discardActiveObject();

  canvas.requestRenderAll();

  saveHistory();

}

function applyTextColor(){

  const a=canvas.getActiveObject();

  if(
    !a||
    !['i-text','text'].includes(a.type)
  )return;

  if(
    a.isEditing &&
    a.selectionStart!==a.selectionEnd
  ){

    a.setSelectionStyles(
      {fill:textColor.value},
      a.selectionStart,
      a.selectionEnd
    );

  }

  else{

    a.set({
      fill:textColor.value,
      textColorValue:textColor.value
    });

  }

  if(
    !gradient.checked &&
    !a.isEditing
  ){

    a.set(
      'fill',
      textColor.value
    );

  }

  a.dirty=true;

  canvas.requestRenderAll();

}


textColor.oninput=applyTextColor;
textColor.onchange=saveHistory;


function applyFill(){

  const a=canvas.getActiveObject();

  if(!a)return;

  if(
    ['i-text','text'].includes(a.type)
  ){

    if(
      a.isEditing &&
      a.selectionStart!==a.selectionEnd
    ){

      a.setSelectionStyles(
        {fill:midColor.value},
        a.selectionStart,
        a.selectionEnd
      );

    }

    else{

      a.textColorValue=
        midColor.value;

      if(!gradient.checked){

        a.set(
          'fill',
          midColor.value
        );

      }

    }

    a.gradientEnabled=
      gradient.checked;

    a.gradientColorValue=
      gradientColor.value;

    if(
      !a.isEditing||
      a.selectionStart===a.selectionEnd
    ){

      a.set(
        'fill',
        gradient.checked
          ? makeGradient(a)
          : a.textColorValue
      );

    }

    a.dirty=true;

    syncConnectedOutline(a);

  }

  else if(
    ['rect','circle','triangle'].includes(a.type)
  ){

    a.set(
      'fill',
      midColor.value
    );

  }

  canvas.requestRenderAll();

}

function updateStroke(){

  strokeWidthVal.textContent=
    strokeWidth.value;

  const a=canvas.getActiveObject();

  if(!a)return;

  const w=
    parseInt(strokeWidth.value)||0;

  if(
    ['i-text','text'].includes(a.type)
  ){

    a.set({

      stroke:null,

      strokeWidth:0,

      paintFirst:'fill',

      objectCaching:false,

      outlineWidth:w,

      outlineColor:
        strokeColor.value,

      outerOnly:
        outer.checked,

      innerStrokeWidth:0

    });

    syncConnectedOutline(a);

  }

  else if(
    ['rect','circle','triangle'].includes(a.type)
  ){

    a.set({

      stroke:
        w>0
          ? strokeColor.value
          : null,

      strokeWidth:w

    });

  }

  canvas.requestRenderAll();

}

function updateShadow(){

  const a=canvas.getActiveObject();

  if(!a)return;

  if(
    ['i-text','text'].includes(a.type)

    a.shadowEnabled=true;

    a.shadowColorValue=

    a.shadow=null;

function moveTextWithOutline(obj,dir){

  const o=getConnectedOutline(obj);

  if(dir==='forward'){
    canvas.bringForward(obj);
  }
  else{
    canvas.sendBackwards(obj);
  }

  if(o){

    const idx=
      canvas.getObjects().indexOf(obj);

    if(idx>0){
      canvas.moveTo(o,idx-1);
    }
    else{
      canvas.sendToBack(o);
    }

  }

}

function addShape(type){

  const w=
    parseInt(strokeWidth.value)||0;

  const common={

    left:canvas.width/2,
    top:canvas.height/2,

    originX:'center',
    originY:'center',

    fill:midColor.value,

    stroke:
      w>0
        ? strokeColor.value
        : null,

    strokeWidth:w,

    strokeLineJoin:'round',
    strokeLineCap:'round',

    objectCaching:false

  };

  let s;

  if(type==='rect'){

    s=new fabric.Rect({

      ...common,

      width:120,
      height:120,
      rx:8,
      ry:8

    });

  }

  else if(type==='circle'){

    s=new fabric.Circle({

      ...common,

      radius:60

    });

  }

  else if(type==='triangle'){

    s=new fabric.Triangle({

      ...common,

      width:120,
      height:110

    });

  }

  if(!s)return;

  canvas.add(s);

  canvas.setActiveObject(s);

  canvas.requestRenderAll();

  setMode('select');

  setStatus(
    type==='rect'
      ? '四角を追加'
      : type==='circle'
        ? '丸を追加'
        : '三角を追加'
  );

  saveHistory();

}

imageInput.onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=ev=>{

    fabric.Image.fromURL(
      ev.target.result,
      img=>{

        const max=400;

        if(
          img.width>max||
          img.height>max
        ){

          img.scale(
            Math.min(
              max/img.width,
              max/img.height
            )
          );

        }

        img.set({

          left:canvas.width/2,
          top:canvas.height/2,

          originX:'center',
          originY:'center'

        });

        canvas.add(img);

        canvas.setActiveObject(img);

        canvas.requestRenderAll();

        setMode('select');

        setStatus(
          '画像を追加しました'
        );

        saveHistory();

      }
    );

  };

  reader.readAsDataURL(file);

  imageInput.value='';

};

document.addEventListener(
  'keydown',
  e=>{

    if(e.ctrlKey||e.metaKey){

      if(
        e.key.toLowerCase()==='z'
      ){

        e.preventDefault();

        if(historyIndex>0){

          restoreHistory(
            historyIndex-1
          );

        }

        return;

      }

      if(
        e.key.toLowerCase()==='y'
      ){

        e.preventDefault();

        if(
          historyIndex<
          history.length-1
        ){

          restoreHistory(
            historyIndex+1
          );

        }

        return;

      }

    }

    if(
      e.key==='Delete'||
      e.key==='Backspace'
    ){

      if(
        canvas.getActiveObject()?.isEditing||
        document.activeElement===textInput
      )return;

      const a=
        canvas.getActiveObject();

      if(!a)return;

      if(
        ['i-text','text'].includes(a.type)
      ){

        removeTextWithOutline(a);

      }

      else{

        canvas.remove(a);

        canvas.discardActiveObject();

        canvas.requestRenderAll();

        saveHistory();

      }

    }

  }
);


function updateControlsFromObject(){

  const a=canvas.getActiveObject();

  if(!a)return;

  if(
    ['i-text','text'].includes(a.type)
  ){

    if(
      a.fontFamily &&
      Array.from(
        fontSelect.options
      ).some(
        o=>o.value===a.fontFamily
      )
    ){

      fontSelect.value=
        a.fontFamily;

    }

    if(
      typeof a.fill==='string'
    ){

      textColor.value=
        a.fill;

      midColor.value=
        a.fill;

    }

    if(a.textColorValue){

      textColor.value=
        a.textColorValue;

    }

    if(
      typeof a.outlineWidth==='number'
    ){

      strokeWidth.value=
        a.outlineWidth;

      strokeWidthVal.textContent=
        a.outlineWidth;

    }

    if(a.outlineColor){

      strokeColor.value=
        a.outlineColor;

    }

    if(
      typeof a.fontSize==='number'
    ){

      fontSize.value=
        a.fontSize;

      fontSizeVal.textContent=
        a.fontSize;

    }

    if(
      typeof a.shadowColorValue==='string'
    ){

      shadowColor.value=
        a.shadowColorValue;

    }

    if(
      typeof a.shadowBlurValue==='number'
    ){

      shadowBlur.value=
        a.shadowBlurValue;

    }

    if(
      typeof a.shadowOffsetValue==='number'
    ){

      shadowOffset.value=
        a.shadowOffsetValue;

      shadowOffsetVal.textContent=
        a.shadowOffsetValue;

    }

    gradient.checked=
      !!a.gradientEnabled;

    if(a.gradientColorValue){

      gradientColor.value=
        a.gradientColorValue;

    }

  }

  else if(
    ['rect','circle','triangle'].includes(a.type)
  ){

    if(
      a.fill &&
      typeof a.fill==='string'
    ){

      midColor.value=
        a.fill;

    }

    if(
      a.stroke &&
      typeof a.stroke==='string'
    ){

      strokeColor.value=
        a.stroke;

    }

    if(
      typeof a.strokeWidth==='number'
    ){

      strokeWidth.value=
        a.strokeWidth;

      strokeWidthVal.textContent=
        a.strokeWidth;

    }

  }

}


canvas.on(
  'selection:created',
  updateControlsFromObject
);

canvas.on(

function fitCanvas(){

  const wrap=
    document.querySelector(
      '.canvas-wrap'
    );

  if(!wrap)return;

  const padding=20;

  const aw=
    wrap.clientWidth-padding;

  const ah=
    wrap.clientHeight-padding;

  const baseW=900;
  const baseH=520;

  const ratio=
    baseW/baseH;

  let nw,
      nh;

  if(
    aw/ah>ratio
  ){

    nh=
      Math.min(
        baseH,
        ah
      );

    nw=
      nh*ratio;

  }

  else{

    nw=
      Math.min(
        baseW,
        aw
      );

    nh=
      nw/ratio;

  }

  nw=
    Math.max(
      100,
      Math.round(nw)
    );

  nh=
    Math.max(
      60,
      Math.round(nh)
    );

  if(
    Math.abs(
      canvas.getWidth()-nw
    )>4||
    Math.abs(
      canvas.getHeight()-nh
    )>4
  ){

    canvas.setDimensions({

      width:nw,
      height:nh

    });

    canvas.requestRenderAll();

  }

}


window.addEventListener(

  ()=>setTimeout(
    fitCanvas,
    100
  )
);


window.addEventListener(
  'orientationchange',
  ()=>setTimeout(
    fitCanvas,
    200
  )
);

setStatus('準備完了');

setTimeout(
