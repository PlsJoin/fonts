<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VTuberネームロゴメーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
  background: #f3f3f3;
  color: #222;
  display: flex;
  flex-direction: column;
}
.toolbar {
  background: #fff;
  border-bottom: 1px solid #d0d0d0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  flex-shrink: 0;
  z-index: 10;
}
.toolbar-row {
  display: flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 0;
  border-bottom: 1px solid #eee;
  padding: 0 4px;
}
.toolbar-row:last-child { border-bottom: none; }
.group {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-right: 1px solid #e8e8e8;
  flex-shrink: 0;
}
.group:last-child { border-right: none; }
.group-label {
  font-size: 10px;
  color: #888;
  text-align: center;
  width: 100%;
  margin-top: 2px;
  letter-spacing: .02em;
}
.group-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.group-controls {
  display: flex;
  align-items: center;
  gap: 5px;
}
input[type="text"] {
  padding: 5px 8px;
  border: 1px solid #ccc;
  border-radius: 3px;
  font-family: inherit;
  font-size: 13px;
  width: 140px;
  background: #fff;
}
input[type="text"]:focus { outline: none; border-color: #4a90e2; }
select {
  padding: 5px 6px;
  border: 1px solid #ccc;
  border-radius: 3px;
  font-family: inherit;
  font-size: 12px;
  background: #fff;
  max-width: 200px;
}
select:focus { outline: none; border-color: #4a90e2; }
input[type="color"] {
  width: 28px;
  height: 26px;
  cursor: pointer;
  border: 1px solid #ccc;
  padding: 1px;
  background: #fff;
  border-radius: 3px;
  flex-shrink: 0;
}
input[type="range"] {
  width: 80px;
  accent-color: #4a90e2;
  vertical-align: middle;
}
input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: #4a90e2;
  flex-shrink: 0;
}
.val {
  font-size: 11px;
  color: #555;
  min-width: 22px;
  text-align: right;
}
button {
  padding: 5px 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  background: #f0f0f0;
  color: #333;
  border: 1px solid #ccc;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .1s;
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: #e4e4e4; }
button:active { background: #d8d8d8; }
button.primary {
  background: #4a90e2;
  color: #fff;
  border-color: #3a7bc8;
}
button.primary:hover { background: #357abd; }
button.danger {
  background: #fff;
  color: #c0392b;
  border-color: #e0b0b0;
}
button.danger:hover { background: #fdecea; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.active {
  background: #4a90e2;
  color: #fff;
  border-color: #3a7bc8;
}
.chk {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #c8ccd0;
}
.canvas-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
#canvas-container {
  background: #fff;
  border: 1px solid #aaa;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
  line-height: 0;
  flex-shrink: 0;
}
#c { display: block; touch-action: none; }
.status {
  flex-shrink: 0;
  font-size: 11px;
  color: #555;
  background: #f0f0f0;
  border-top: 1px solid #d0d0d0;
  padding: 4px 12px;
}
.preload { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
@media (max-width: 900px) {
  .toolbar-row { flex-wrap: wrap; }
  .group { border-right: none; border-bottom: 1px solid #eee; }
  input[type="text"] { width: 110px; }
  select { max-width: 160px; }
  input[type="range"] { width: 60px; }
}
</style>
</head>
<body>
<div class="preload" style="font-family:'Rampart One'">a</div>
<div class="preload" style="font-family:'Dela Gothic One'">a</div>
<div class="preload" style="font-family:'Hachi Maru Pop'">a</div>
<div class="preload" style="font-family:'M PLUS Rounded 1c'">a</div>

<div class="toolbar">
  <div class="toolbar-row">
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <input type="text" id="textInput" value="ドル鯖" placeholder="テキスト">
          <button class="primary" id="addTextBtn">追加</button>
        </div>
        <div class="group-label">テキスト</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <select id="fontSelect">
            <option value="Rampart One" selected>Rampart One（立体）</option>
            <option value="Dela Gothic One">Dela Gothic One（太ゴ）</option>
            <option value="Yomogi">Yomogi（手書き）</option>
            <option value="Hachi Maru Pop">Hachi Maru Pop（ポップ）</option>
            <option value="Zen Maru Gothic">Zen Maru Gothic（丸ゴ）</option>
            <option value="M PLUS Rounded 1c">M PLUS Rounded</option>
            <option value="Noto Sans JP">Noto Sans JP</option>
            <option value="Noto Serif JP">Noto Serif JP（明朝）</option>
            <option value="Shippori Mincho">Shippori Mincho</option>
            <option value="Kaisei Decol">Kaisei Decol</option>
            <option value="Reggae One">Reggae One</option>
            <option value="Potta One">Potta One</option>
            <option value="Stick">Stick</option>
            <option value="RocknRoll One">RocknRoll One</option>
            <option value="DotGothic16">DotGothic16（ドット）</option>
            <option value="Sawarabi Gothic">Sawarabi Gothic</option>
            <option value="Sawarabi Mincho">Sawarabi Mincho</option>
            <option value="Kosugi Maru">Kosugi Maru</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Impact">Impact</option>
            <option value="Arial Black">Arial Black</option>
          </select>
        </div>
        <div class="group-label">フォント</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <input type="range" id="fontSize" min="20" max="180" value="72">
          <span class="val" id="fontSizeVal">72</span>
        </div>
        <div class="group-label">サイズ</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <input type="color" id="textColor" value="#0055ff" title="文字色">
          <input type="color" id="midColor" value="#8ec8ff" title="塗り色">
          <label class="chk"><input type="checkbox" id="gradient"> グラデ</label>
        </div>
        <div class="group-label">文字色 / 塗り色</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <input type="color" id="strokeColor" value="#ff2200" title="縁色">
          <input type="range" id="strokeWidth" min="0" max="40" value="12">
          <span class="val" id="strokeWidthVal">12</span>
          <label class="chk"><input type="checkbox" id="outer" checked> 外側のみ</label>
        </div>
        <div class="group-label">縁</div>
      </div>
    </div>
  </div>
  <div class="toolbar-row">
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <button id="selectBtn" class="active">選択</button>
          <button id="penBtn">ペン</button>
          <button id="eraserBtn">消</button>
          <input type="color" id="penColor" value="#000000" title="ペン色">
          <input type="range" id="penWidth" min="1" max="40" value="6">
          <span class="val" id="penWidthVal">6</span>
        </div>
        <div class="group-label">モード</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <button id="addRectBtn">□ 四角</button>
          <button id="addCircleBtn">○ 丸</button>
          <button id="addTriangleBtn">△ 三角</button>
          <button id="importImageBtn">画像</button>
        </div>
        <div class="group-label">図形</div>
      </div>
    </div>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <span style="font-size:11px;color:#666">角丸</span>
          <input type="range" id="cornerRadius" min="0" max="60" value="0" title="四角の角の丸み">
          <span class="val" id="cornerRadiusVal">0</span>
        </div>
        <div class="group-label">四角の角</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <button id="bringForwardBtn">前面へ</button>
          <button id="sendBackwardBtn">背面へ</button>
          <button id="bringToFrontBtn">最前面</button>
          <button id="sendToBackBtn">最背面</button>
        </div>
        <div class="group-label">重ね順</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <button id="deleteBtn" class="danger">削除</button>
          <button id="clearBtn" class="danger">全消</button>
          <button id="undoBtn">↩</button>
          <button id="redoBtn">↪</button>
        </div>
        <div class="group-label">操作 / 履歴</div>
      </div>
    </div>
    <div class="group">
      <div class="group-inner">
        <div class="group-controls">
          <select id="exportScale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
          <button class="primary" id="downloadBtn">PNG保存</button>
        </div>
        <div class="group-label">保存</div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="canvas-wrap">
    <div id="canvas-container">
      <canvas id="c" width="900" height="520"></canvas>
    </div>
  </div>
  <div class="status">
    <span id="statusInfo">準備完了 — テキスト追加 → ドラッグで移動</span>
  </div>
</div>

<script>
(function () {
  const fontLink = document.createElement('link');
  fontLink.href = 'https://fonts.googleapis.com/css2?family=Yomogi&family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Rampart+One&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Kaisei+Decol:wght@400;500;700&family=Reggae+One&family=Potta+One&family=Stick&family=RocknRoll+One&family=DotGothic16&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Kosugi+Maru&display=swap';
  fontLink.rel = 'stylesheet';
  document.head.appendChild(fontLink);

  const canvas = new fabric.Canvas('c', {
    backgroundColor: '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    allowTouchScrolling: false,
    stopContextMenu: true
  });

  fabric.Object.prototype.set({
    transparentCorners: false,
    borderColor: '#4a90e2',
    cornerColor: '#4a90e2',
    cornerStyle: 'circle',
    cornerSize: 12,
    padding: 6
  });

  let isEraser = false;
  let isInternal = false;
  let isRestoring = false;
  const history = [];
  let historyIndex = -1;
  const MAX_HISTORY = 40;
  const OUTER_EXTRA_RATIO = 1.35;
  const OUTER_EXTRA_MIN = 8;

  const $ = id => document.getElementById(id);
  const textInput = $('textInput');
  const addTextBtn = $('addTextBtn');
  const fontSelect = $('fontSelect');
  const fontSize = $('fontSize');
  const fontSizeVal = $('fontSizeVal');
  const textColor = $('textColor');
  const midColor = $('midColor');
  const gradient = $('gradient');
  const strokeColor = $('strokeColor');
  const strokeWidth = $('strokeWidth');
  const strokeWidthVal = $('strokeWidthVal');
  const outer = $('outer');
  const cornerRadius = $('cornerRadius');
  const cornerRadiusVal = $('cornerRadiusVal');
  const penColor = $('penColor');
  const penWidth = $('penWidth');
  const penWidthVal = $('penWidthVal');
  const penBtn = $('penBtn');
  const eraserBtn = $('eraserBtn');
  const selectBtn = $('selectBtn');
  const bringForwardBtn = $('bringForwardBtn');
  const sendBackwardBtn = $('sendBackwardBtn');
  const bringToFrontBtn = $('bringToFrontBtn');
  const sendToBackBtn = $('sendToBackBtn');
  const deleteBtn = $('deleteBtn');
  const addRectBtn = $('addRectBtn');
  const addCircleBtn = $('addCircleBtn');
  const addTriangleBtn = $('addTriangleBtn');
  const importImageBtn = $('importImageBtn');
  const imageInput = $('imageInput');
  const downloadBtn = $('downloadBtn');
  const clearBtn = $('clearBtn');
  const undoBtn = $('undoBtn');
  const redoBtn = $('redoBtn');
  const exportScale = $('exportScale');
  const statusInfo = $('statusInfo');

  function setStatus(msg) { statusInfo.textContent = msg; }

  function saveHistory() {
    if (isRestoring || isInternal) return;
    history.splice(historyIndex + 1);
    history.push(canvas.toJSON([
      'selectable', 'evented', 'isOutline', 'ownerId', 'textId',
      'outlineW', 'outlineCol', 'outerOnly',
      'gradOn', 'textColVal', 'fillColVal'
    ]));
    if (history.length > MAX_HISTORY) history.shift();
    else historyIndex++;
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    undoBtn.disabled = historyIndex <= 0;
    redoBtn.disabled = historyIndex >= history.length - 1;
  }

  function restoreHistory(idx) {
    if (idx < 0 || idx >= history.length) return;
    isRestoring = true;
    canvas.loadFromJSON(history[idx], () => {
      canvas.getObjects().forEach(o => {
        if (o.isOutline) { o.selectable = false; o.evented = false; }
      });
      canvas.renderAll();
      isRestoring = false;
      historyIndex = idx;
      updateHistoryButtons();
      setStatus('履歴を復元');
    });
  }

  function getOutline(textObj) {
    if (!textObj || textObj.isOutline || !textObj.textId) return null;
    return canvas.getObjects().find(o => o.isOutline && o.ownerId === textObj.textId) || null;
  }

  function calcOuterWidth(w) {
    w = Math.max(0, parseInt(w) || 0);
    if (!w) return 0;
    return w + Math.max(OUTER_EXTRA_MIN, Math.round(w * OUTER_EXTRA_RATIO));
  }

  function makeGradient(obj) {
    if (!obj.gradOn) return obj.fillColVal || midColor.value;
    const h = Math.max(obj.height || obj.fontSize || 72, 1);
    return new fabric.Gradient({
      type: 'linear',
      coords: { x1: 0, y1: -h / 2, x2: 0, y2: h / 2 },
      colorStops: [
        { offset: 0, color: obj.textColVal || textColor.value },
        { offset: 1, color: obj.fillColVal || midColor.value }
      ]
    });
  }

  function createText(text) {
    const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const w = parseInt(strokeWidth.value) || 0;
    const obj = new fabric.IText(text, {
      left: canvas.width / 2,
      top: canvas.height / 2,
      originX: 'center',
      originY: 'center',
      fontFamily: fontSelect.value,
      fontSize: parseInt(fontSize.value),
      fill: gradient.checked ? null : textColor.value,
      stroke: null,
      strokeWidth: 0,
      paintFirst: 'fill',
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      editable: true,
      objectCaching: false,
      selectable: true,
      evented: true,
      hasControls: true,
      hasBorders: true,
      lockMovementX: false,
      lockMovementY: false,
      textId: id,
      outlineW: w,
      outlineCol: strokeColor.value,
      outerOnly: outer.checked,
      gradOn: gradient.checked,
      textColVal: textColor.value,
      fillColVal: midColor.value
    });
    obj.fill = makeGradient(obj);
    return obj;
  }

  function createOutline(textObj) {
    const useOuter = textObj.outerOnly !== false;
    const ow = useOuter
      ? calcOuterWidth(textObj.outlineW)
      : Math.max(0, parseInt(textObj.outlineW) || 0);
    const col = textObj.outlineCol || strokeColor.value;
    return new fabric.IText(textObj.text, {
      left: textObj.left,
      top: textObj.top,
      originX: textObj.originX,
      originY: textObj.originY,
      scaleX: textObj.scaleX,
      scaleY: textObj.scaleY,
      angle: textObj.angle,
      skewX: textObj.skewX,
      skewY: textObj.skewY,
      flipX: textObj.flipX,
      flipY: textObj.flipY,
      fontFamily: textObj.fontFamily,
      fontSize: textObj.fontSize,
      fontWeight: textObj.fontWeight,
      fontStyle: textObj.fontStyle,
      charSpacing: textObj.charSpacing,
      lineHeight: textObj.lineHeight,
      fill: col,
      stroke: col,
      strokeWidth: ow,
      paintFirst: 'stroke',
      strokeLineJoin: 'round',
      strokeLineCap: 'round',
      selectable: false,
      evented: false,
      editable: false,
      objectCaching: false,
      hasControls: false,
      hasBorders: false,
      isOutline: true,
      ownerId: textObj.textId,
      opacity: ow > 0 ? 1 : 0
    });
  }

  function syncOutline(obj) {
    if (!obj || obj.isOutline || !['i-text', 'text'].includes(obj.type)) return;
    const o = getOutline(obj);
    if (!o) return;
    const useOuter = obj.outerOnly !== false;
    const ow = useOuter
      ? calcOuterWidth(obj.outlineW)
      : Math.max(0, parseInt(obj.outlineW) || 0);
    const col = obj.outlineCol || strokeColor.value;
    o.set({
      left: obj.left, top: obj.top,
      scaleX: obj.scaleX, scaleY: obj.scaleY,
      angle: obj.angle, skewX: obj.skewX, skewY: obj.skewY,
      flipX: obj.flipX, flipY: obj.flipY,
      text: obj.text,
      fontFamily: obj.fontFamily, fontSize: obj.fontSize,
      fontWeight: obj.fontWeight, fontStyle: obj.fontStyle,
      charSpacing: obj.charSpacing, lineHeight: obj.lineHeight,
      fill: col, stroke: col, strokeWidth: ow,
      opacity: ow > 0 ? 1 : 0,
      objectCaching: false
    });
    o.initDimensions();
    o.setCoords();
    o.dirty = true;
    const idx = canvas.getObjects().indexOf(obj);
    if (idx > 0) {
      const oIdx = canvas.getObjects().indexOf(o);
      if (oIdx !== idx - 1) canvas.moveTo(o, Math.max(0, idx - 1));
    }
    canvas.requestRenderAll();
  }

  function addTextWithOutline(obj) {
    const outline = createOutline(obj);
    isInternal = true;
    canvas.add(outline);
    canvas.add(obj);
    isInternal = false;
    canvas.setActiveObject(obj);
    canvas.requestRenderAll();
    saveHistory();
  }

  function removeTextWithOutline(obj) {
    if (!obj) return;
    const o = getOutline(obj);
    isInternal = true;
    if (o) canvas.remove(o);
    canvas.remove(obj);
    isInternal = false;
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    saveHistory();
  }

  function moveObjectLayer(obj, action) {
    if (!obj || obj.isOutline) return;
    const outline = getOutline(obj);
    isInternal = true;
    if (action === 'forward') {
      canvas.bringForward(obj);
      if (outline) {
        const idx = canvas.getObjects().indexOf(obj);
        canvas.moveTo(outline, Math.max(0, idx - 1));
      }
    } else if (action === 'backward') {
      if (outline) canvas.sendBackwards(outline);
      canvas.sendBackwards(obj);
      if (outline) {
        const idx = canvas.getObjects().indexOf(obj);
        canvas.moveTo(outline, Math.max(0, idx - 1));
      }
    } else if (action === 'front') {
      canvas.bringToFront(obj);
      if (outline) {
        const idx = canvas.getObjects().indexOf(obj);
        canvas.moveTo(outline, Math.max(0, idx - 1));
      }
    } else if (action === 'back') {
      if (outline) canvas.sendToBack(outline);
      canvas.sendToBack(obj);
      if (outline) {
        const idx = canvas.getObjects().indexOf(obj);
        if (idx > 0) canvas.moveTo(outline, idx - 1);
        else canvas.sendToBack(outline);
      }
    }
    isInternal = false;
    canvas.requestRenderAll();
    saveHistory();
  }

  canvas.on('object:modified', e => {
    if (!isRestoring && e.target && !e.target.isOutline) syncOutline(e.target);
    if (!isInternal) saveHistory();
  });
  canvas.on('object:added', () => { if (!isRestoring && !isInternal) saveHistory(); });
  canvas.on('object:removed', () => { if (!isRestoring && !isInternal) saveHistory(); });
  canvas.on('path:created', () => { if (!isInternal) saveHistory(); });
  ['moving', 'scaling', 'rotating', 'skewing'].forEach(ev => {
    canvas.on('object:' + ev, e => {
      if (e.target && !e.target.isOutline) syncOutline(e.target);
    });
  });
  canvas.on('text:changed', e => {
    if (e.target && !e.target.isOutline) {
      syncOutline(e.target);
      if (!isInternal) saveHistory();
    }
  });
  canvas.on('selection:created', e => {
    const t = e.selected && e.selected[0];
    if (t && t.isOutline) {
      canvas.discardActiveObject();
      const owner = canvas.getObjects().find(o => o.textId === t.ownerId);
      if (owner) canvas.setActiveObject(owner);
      canvas.requestRenderAll();
    }
    updateControlsFromObject();
  });
  canvas.on('selection:updated', updateControlsFromObject);

  function setMode(mode) {
    [penBtn, eraserBtn, selectBtn].forEach(b => b.classList.remove('active'));
    canvas.isDrawingMode = false;
    isEraser = false;
    if (mode === 'pen') {
      penBtn.classList.add('active');
      canvas.isDrawingMode = true;
      const brush = new fabric.PencilBrush(canvas);
      brush.color = penColor.value;
      brush.width = parseInt(penWidth.value);
      brush.globalCompositeOperation = 'source-over';
      canvas.freeDrawingBrush = brush;
      setStatus('ペンモード');
    } else if (mode === 'eraser') {
      eraserBtn.classList.add('active');
      canvas.isDrawingMode = true;
      const brush = new fabric.PencilBrush(canvas);
      brush.color = '#000';
      brush.width = parseInt(penWidth.value) * 2;
      brush.globalCompositeOperation = 'destination-out';
      canvas.freeDrawingBrush = brush;
      isEraser = true;
      setStatus('消しゴム');
    } else {
      selectBtn.classList.add('active');
      setStatus('選択・移動 — ドラッグで移動、ダブルクリックで編集');
    }
  }

  addTextBtn.onclick = () => {
    const text = textInput.value.trim() || 'テキスト';
    const f = fontSelect.value;
    document.fonts.load('16px "' + f + '"')
      .then(() => { addTextWithOutline(createText(text)); setMode('select'); setStatus('テキスト追加 — ドラッグで移動'); })
      .catch(() => { addTextWithOutline(createText(text)); setMode('select'); setStatus('テキスト追加 — ドラッグで移動'); });
  };
  textInput.onkeydown = e => { if (e.key === 'Enter') addTextBtn.click(); };

  fontSelect.onchange = () => {
    const a = canvas.getActiveObject();
    if (!a || !['i-text', 'text'].includes(a.type)) return;
    const f = fontSelect.value;
    document.fonts.load('16px "' + f + '"').finally(() => {
      a.set({ fontFamily: f, objectCaching: false });
      a.initDimensions();
      syncOutline(a);
      canvas.requestRenderAll();
      saveHistory();
    });
  };

  fontSize.oninput = () => {
    fontSizeVal.textContent = fontSize.value;
    const a = canvas.getActiveObject();
    if (a && ['i-text', 'text'].includes(a.type)) {
      a.set('fontSize', parseInt(fontSize.value));
      a.initDimensions();
      syncOutline(a);
      canvas.requestRenderAll();
    }
  };
  fontSize.onchange = saveHistory;

  function applyTextColors() {
    const a = canvas.getActiveObject();
    if (!a || !['i-text', 'text'].includes(a.type)) return;
    a.textColVal = textColor.value;
    a.fillColVal = midColor.value;
    a.gradOn = gradient.checked;
    if (a.isEditing && a.selectionStart !== a.selectionEnd) {
      a.setSelectionStyles({ fill: textColor.value }, a.selectionStart, a.selectionEnd);
    } else {
      a.set('fill', makeGradient(a));
    }
    a.dirty = true;
    syncOutline(a);
    canvas.requestRenderAll();
  }
  textColor.oninput = applyTextColors;
  textColor.onchange = saveHistory;
  midColor.oninput = applyTextColors;
  midColor.onchange = saveHistory;
  gradient.onchange = () => { applyTextColors(); saveHistory(); };

  function updateStroke() {
    strokeWidthVal.textContent = strokeWidth.value;
    const a = canvas.getActiveObject();
    if (!a) return;
    const w = parseInt(strokeWidth.value) || 0;
    if (['i-text', 'text'].includes(a.type)) {
      a.set({
        stroke: null, strokeWidth: 0, paintFirst: 'fill', objectCaching: false,
        outlineW: w, outlineCol: strokeColor.value, outerOnly: outer.checked
      });
      syncOutline(a);
    } else if (['rect', 'circle', 'triangle'].includes(a.type)) {
      a.set({ stroke: w > 0 ? strokeColor.value : null, strokeWidth: w });
    }
    canvas.requestRenderAll();
  }
  strokeColor.oninput = updateStroke;
  strokeWidth.oninput = updateStroke;
  outer.onchange = () => { updateStroke(); saveHistory(); };
  strokeColor.onchange = saveHistory;
  strokeWidth.onchange = saveHistory;

  cornerRadius.oninput = () => {
    cornerRadiusVal.textContent = cornerRadius.value;
    const a = canvas.getActiveObject();
    if (a && a.type === 'rect') {
      const r = parseInt(cornerRadius.value) || 0;
      a.set({ rx: r, ry: r });
      canvas.requestRenderAll();
    }
  };
  cornerRadius.onchange = saveHistory;

  penWidth.oninput = () => {
    penWidthVal.textContent = penWidth.value;
    if (canvas.isDrawingMode && canvas.freeDrawingBrush) {
      canvas.freeDrawingBrush.width = isEraser ? parseInt(penWidth.value) * 2 : parseInt(penWidth.value);
    }
  };
  penColor.oninput = () => {
    if (canvas.isDrawingMode && !isEraser && canvas.freeDrawingBrush) {
      canvas.freeDrawingBrush.color = penColor.value;
    }
  };
  penBtn.onclick = () => setMode('pen');
  eraserBtn.onclick = () => setMode('eraser');
  selectBtn.onclick = () => setMode('select');

  bringForwardBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) { setStatus('オブジェクトを選択してください'); return; }
    if (['i-text', 'text'].includes(a.type)) moveObjectLayer(a, 'forward');
    else { canvas.bringForward(a); canvas.requestRenderAll(); saveHistory(); }
    setStatus('前面へ移動');
  };
  sendBackwardBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) { setStatus('オブジェクトを選択してください'); return; }
    if (['i-text', 'text'].includes(a.type)) moveObjectLayer(a, 'backward');
    else { canvas.sendBackwards(a); canvas.requestRenderAll(); saveHistory(); }
    setStatus('背面へ移動');
  };
  bringToFrontBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) { setStatus('オブジェクトを選択してください'); return; }
    if (['i-text', 'text'].includes(a.type)) moveObjectLayer(a, 'front');
    else { canvas.bringToFront(a); canvas.requestRenderAll(); saveHistory(); }
    setStatus('最前面へ');
  };
  sendToBackBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) { setStatus('オブジェクトを選択してください'); return; }
    if (['i-text', 'text'].includes(a.type)) moveObjectLayer(a, 'back');
    else { canvas.sendToBack(a); canvas.requestRenderAll(); saveHistory(); }
    setStatus('最背面へ');
  };

  deleteBtn.onclick = () => {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) removeTextWithOutline(a);
    else {
      canvas.remove(a);
      canvas.discardActiveObject();
      canvas.requestRenderAll();
      saveHistory();
    }
  };

  function addShape(type) {
    const w = parseInt(strokeWidth.value) || 0;
    const r = parseInt(cornerRadius.value) || 0;
    const common = {
      left: canvas.width / 2, top: canvas.height / 2,
      originX: 'center', originY: 'center',
      fill: midColor.value,
      stroke: w > 0 ? strokeColor.value : null,
      strokeWidth: w,
      strokeLineJoin: 'miter',
      strokeLineCap: 'butt',
      objectCaching: false,
      selectable: true,
      evented: true
    };
    let s;
    if (type === 'rect') {
      s = new fabric.Rect({ ...common, width: 120, height: 120, rx: r, ry: r });
    } else if (type === 'circle') {
      s = new fabric.Circle({ ...common, radius: 60 });
    } else if (type === 'triangle') {
      s = new fabric.Triangle({ ...common, width: 120, height: 110 });
    }
    if (!s) return;
    canvas.add(s);
    canvas.setActiveObject(s);
    canvas.requestRenderAll();
    setMode('select');
    setStatus(type === 'rect' ? '四角を追加' : type === 'circle' ? '丸を追加' : '三角を追加');
    saveHistory();
  }
  addRectBtn.onclick = () => addShape('rect');
  addCircleBtn.onclick = () => addShape('circle');
  addTriangleBtn.onclick = () => addShape('triangle');

  importImageBtn.onclick = () => imageInput.click();
  imageInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      fabric.Image.fromURL(ev.target.result, img => {
        const max = 400;
        if (img.width > max || img.height > max) img.scale(Math.min(max / img.width, max / img.height));
        img.set({ left: canvas.width / 2, top: canvas.height / 2, originX: 'center', originY: 'center' });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.requestRenderAll();
        setMode('select');
        saveHistory();
      });
    };
    reader.readAsDataURL(file);
    imageInput.value = '';
  };

  downloadBtn.onclick = () => {
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    const bg = canvas.backgroundColor;
    canvas.backgroundColor = null;
    canvas.requestRenderAll();
    const scale = parseInt(exportScale.value) || 2;
    const data = canvas.toDataURL({ format: 'png', quality: 1, multiplier: scale });
    canvas.backgroundColor = bg;
    canvas.requestRenderAll();
    const a = document.createElement('a');
    a.download = 'vtuber-logo.png';
    a.href = data;
    a.click();
    setStatus('PNG保存完了（' + scale + 'x）');
  };

  clearBtn.onclick = () => {
    if (confirm('すべて消去しますか？')) {
      isInternal = true;
      canvas.clear();
      isInternal = false;
      canvas.backgroundColor = '#ffffff';
      canvas.requestRenderAll();
      saveHistory();
      setStatus('すべて消去');
    }
  };

  undoBtn.onclick = () => { if (historyIndex > 0) restoreHistory(historyIndex - 1); };
  redoBtn.onclick = () => { if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1); };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key.toLowerCase() === 'z') { e.preventDefault(); if (historyIndex > 0) restoreHistory(historyIndex - 1); return; }
      if (e.key.toLowerCase() === 'y') { e.preventDefault(); if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1); return; }
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (canvas.getActiveObject() && canvas.getActiveObject().isEditing) return;
      if (document.activeElement === textInput) return;
      const a = canvas.getActiveObject();
      if (!a) return;
      if (['i-text', 'text'].includes(a.type)) removeTextWithOutline(a);
      else {
        canvas.remove(a);
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        saveHistory();
      }
    }
  });

  function updateControlsFromObject() {
    const a = canvas.getActiveObject();
    if (!a) return;
    if (['i-text', 'text'].includes(a.type)) {
      if (a.fontFamily && Array.from(fontSelect.options).some(o => o.value === a.fontFamily)) fontSelect.value = a.fontFamily;
      if (a.textColVal) textColor.value = a.textColVal;
      if (a.fillColVal) midColor.value = a.fillColVal;
      if (typeof a.outlineW === 'number') { strokeWidth.value = a.outlineW; strokeWidthVal.textContent = a.outlineW; }
      if (a.outlineCol) strokeColor.value = a.outlineCol;
      if (typeof a.fontSize === 'number') { fontSize.value = a.fontSize; fontSizeVal.textContent = a.fontSize; }
      gradient.checked = !!a.gradOn;
      outer.checked = a.outerOnly !== false;
    } else if (['rect', 'circle', 'triangle'].includes(a.type)) {
      if (a.fill && typeof a.fill === 'string') midColor.value = a.fill;
      if (a.stroke && typeof a.stroke === 'string') strokeColor.value = a.stroke;
      if (typeof a.strokeWidth === 'number') { strokeWidth.value = a.strokeWidth; strokeWidthVal.textContent = a.strokeWidth; }
      if (a.type === 'rect') {
        const r = typeof a.rx === 'number' ? a.rx : 0;
        cornerRadius.value = r;
        cornerRadiusVal.textContent = r;
      }
    }
  }

  function fitCanvas() {
    const wrap = document.querySelector('.canvas-wrap');
    if (!wrap) return;
    const padding = 24;
    const aw = wrap.clientWidth - padding;
    const ah = wrap.clientHeight - padding;
    const baseW = 900, baseH = 520;
    const ratio = baseW / baseH;
    let nw, nh;
    if (aw / ah > ratio) { nh = Math.min(baseH, ah); nw = nh * ratio; }
    else { nw = Math.min(baseW, aw); nh = nw / ratio; }
    nw = Math.max(100, Math.round(nw));
    nh = Math.max(60, Math.round(nh));
    if (Math.abs(canvas.getWidth() - nw) > 4 || Math.abs(canvas.getHeight() - nh) > 4) {
      canvas.setDimensions({ width: nw, height: nh });
      canvas.requestRenderAll();
    }
  }

  window.addEventListener('resize', () => setTimeout(fitCanvas, 100));
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 200));

  setMode('select');
  setStatus('準備完了 — テキスト追加 → ドラッグで移動');
  setTimeout(() => { fitCanvas(); saveHistory(); }, 400);
})();
</script>
</body>
</html>
