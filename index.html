<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VTuberネームロゴメーカー（修正版3）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
      background: #f0f0f0;
      color: #333;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    .title-bar {
      background: #fff;
      border-bottom: 1px solid #d0d0d0;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #555;
      user-select: none;
      flex-shrink: 0;
    }
    .title-bar h1 { font-size: 14px; font-weight: 600; color: #222; }
    .ribbon {
      background: #fff;
      border-bottom: 1px solid #d0d0d0;
      padding: 4px 8px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: flex-start;
      flex-shrink: 0;
      max-height: 42vh;
      overflow-y: auto;
    }
    .ribbon-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 8px;
      border-right: 1px solid #e8e8e8;
      min-width: 50px;
    }
    .ribbon-group:last-child { border-right: none; }
    .ribbon-group-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-align: center;
    }
    .ribbon-buttons {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      background: #f8f8f8;
      color: #333;
      cursor: pointer;
      transition: all 0.1s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #e8e8e8; border-color: #999; }
    button:active { background: #d8d8d8; }
    button.active {
      background: #cce4ff;
      border-color: #5b9bd5;
      color: #1a5276;
    }
    button.primary {
      background: #5b9bd5;
      border-color: #2e86c1;
      color: #fff;
    }
    button.primary:hover { background: #2e86c1; }
    button.danger { color: #c0392b; }
    button.danger:hover {
      background: #fdecea;
      border-color: #e74c3c;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="text"] {
      padding: 4px 8px;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      font-size: 12px;
      width: 140px;
    }
    input[type="text"]:focus { outline: none; border-color: #5b9bd5; }
    select {
      padding: 4px 6px;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      font-size: 12px;
      background: #fff;
      max-width: 150px;
    }
    input[type="color"] {
      width: 28px;
      height: 24px;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      padding: 1px;
      cursor: pointer;
      background: #fff;
    }
    input[type="range"] { width: 70px; vertical-align: middle; }
    .value-label {
      font-size: 11px;
      color: #666;
      min-width: 20px;
      display: inline-block;
    }
    .workspace {
      flex: 1;
      display: flex;
      background: #e5e5e5;
      overflow: hidden;
      min-height: 0;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }
    #canvas-container {
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      border: 1px solid #ccc;
      line-height: 0;
    }
    #c { touch-action: none; display: block; }
    .status-bar {
      background: #f8f8f8;
      border-top: 1px solid #d0d0d0;
      padding: 3px 12px;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }
    .status-bar span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .ctrl label { color: #555; white-space: nowrap; }
    .mode-group {
      display: flex;
      border: 1px solid #c0c0c0;
      border-radius: 3px;
      overflow: hidden;
    }
    .mode-group button {
      border: none;
      border-radius: 0;
      border-right: 1px solid #c0c0c0;
      margin: 0;
      padding: 5px 12px;
    }
    .mode-group button:last-child { border-right: none; }
    @media (max-width: 768px) {
      .title-bar { padding: 8px 12px; }
      .title-bar h1 { font-size: 13px; }
      .ribbon { padding: 6px 4px 8px; gap: 0; max-height: 45vh; }
      .ribbon-group { padding: 4px 6px; min-width: 44px; border-right: 1px solid #eee; }
      .ribbon-group-label { font-size: 10px; margin-top: 3px; }
      button { padding: 8px 11px; font-size: 13px; min-height: 36px; }
      .mode-group button { padding: 8px 14px; }
      input[type="text"] { width: 110px; padding: 6px 8px; font-size: 14px; min-height: 36px; }
      select { padding: 6px 6px; font-size: 13px; min-height: 36px; max-width: 130px; }
      input[type="color"] { width: 36px; height: 32px; }
      input[type="range"] { width: 60px; }
      .canvas-wrap { padding: 8px; }
      .status-bar { font-size: 10px; padding: 4px 8px; }
    }
    @media (max-width: 480px) {
      .ribbon-group-label { display: none; }
      .ribbon-group { padding: 3px 4px; }
      input[type="text"] { width: 90px; }
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <h1>VTuberネームロゴメーカー（修正版3）</h1>
    <span style="color:#999;">|</span>
    <span>消しゴム完全修正 + 縁色独立強化</span>
  </div>

  <div class="ribbon">
    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <button id="undoBtn" title="元に戻す (Ctrl+Z)">＜ 戻る</button>
        <button id="redoBtn" title="やり直し (Ctrl+Y)">進む ＞</button>
      </div>
      <div class="ribbon-group-label">履歴</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <input type="text" id="textInput" placeholder="テキストを入力" value="ドル鯖">
        <button id="addTextBtn" class="primary">追加</button>
      </div>
      <div class="ribbon-group-label">テキスト</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <select id="fontSelect">
          <option value="Yomogi">Yomogi（手書き）</option>
          <option value="Hachi Maru Pop">Hachi Maru Pop（ポップ）</option>
          <option value="Zen Maru Gothic">Zen Maru Gothic（丸ゴ）</option>
          <option value="M PLUS Rounded 1c">M PLUS Rounded</option>
          <option value="Rampart One" selected>Rampart One（立体）</option>
          <option value="Dela Gothic One">Dela Gothic One（太ゴ）</option>
          <option value="Noto Sans JP">Noto Sans JP</option>
          <option value="Noto Serif JP">Noto Serif JP（明朝）</option>
          <option value="Shippori Mincho">Shippori Mincho</option>
          <option value="Kaisei Decol">Kaisei Decol</option>
          <option value="Reggae One">Reggae One</option>
          <option value="Potta One">Potta One</option>
          <option value="Stick">Stick</option>
          <option value="RocknRoll One">RocknRoll One</option>
          <option value="DotGothic16">DotGothic16（ドット）</option>
          <option value="Sawarabi Gothic">Sawarabi Gothic</option>
          <option value="Sawarabi Mincho">Sawarabi Mincho</option>
          <option value="Kosugi Maru">Kosugi Maru</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
          <option value="Impact">Impact</option>
          <option value="Arial Black">Arial Black</option>
        </select>
      </div>
      <div class="ribbon-group-label">フォント</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <div class="ctrl">
          <label>サイズ</label>
          <input type="range" id="fontSize" min="20" max="160" value="72">
          <span class="value-label" id="fontSizeVal">72</span>
        </div>
      </div>
      <div class="ribbon-group-label">文字サイズ</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <div class="ctrl">
          <label>文字色</label>
          <input type="color" id="textColor" value="#000000">
        </div>
        <div class="ctrl">
          <label>塗り</label>
          <input type="color" id="midColor" value="#8ec8ff">
        </div>
        <div class="ctrl">
          <button id="syncMidBtn" title="塗りを文字色と同じにする" style="padding:5px 8px;font-size:11px;">塗り＝文字色</button>
        </div>
        <div class="ctrl">
          <label>縁色</label>
          <input type="color" id="strokeColor" value="#000000">
        </div>
        <div class="ctrl">
          <label>縁幅</label>
          <input type="range" id="strokeWidth" min="0" max="24" value="8">
          <span class="value-label" id="strokeWidthVal">8</span>
        </div>
      </div>
      <div class="ribbon-group-label">色・縁</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <div class="mode-group">
          <button id="selectBtn" class="active">選択</button>
          <button id="penBtn">ペン</button>
          <button id="eraserBtn">消しゴム</button>
        </div>
        <div class="ctrl">
          <input type="color" id="penColor" value="#000000">
          <input type="range" id="penWidth" min="1" max="40" value="6">
          <span class="value-label" id="penWidthVal">6</span>
        </div>
      </div>
      <div class="ribbon-group-label">描画</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <button id="addRectBtn" title="四角を追加" style="font-size:16px;padding:6px 12px;">⬜</button>
        <button id="addCircleBtn" title="丸を追加" style="font-size:16px;padding:6px 12px;">⚪</button>
        <button id="addTriangleBtn" title="三角を追加" style="font-size:16px;padding:6px 12px;">△</button>
      </div>
      <div class="ribbon-group-label">図形</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <button id="bringForwardBtn">前面</button>
        <button id="sendBackwardBtn">背面</button>
        <button id="deleteBtn" class="danger">削除</button>
      </div>
      <div class="ribbon-group-label">配置</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <button id="importImageBtn">画像</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
      </div>
      <div class="ribbon-group-label">画像</div>
    </div>

    <div class="ribbon-group">
      <div class="ribbon-buttons">
        <select id="exportScale">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
        </select>
        <button id="downloadBtn" class="primary">PNG保存</button>
        <button id="clearBtn" class="danger">全消去</button>
      </div>
      <div class="ribbon-group-label">ファイル</div>
    </div>
  </div>

  <div class="workspace">
    <div class="canvas-wrap">
      <div id="canvas-container">
        <canvas id="c" width="900" height="520"></canvas>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span>外側の黒＝縁色　正面の色＝塗り　立体の側面はフォント依存</span>
    <span id="statusInfo">準備完了</span>
  </div>

  <script>
    const fontLink = document.createElement('link');
    fontLink.href = 'https://fonts.googleapis.com/css2?family=Yomogi&family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Rampart+One&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Kaisei+Decol:wght@400;500;700&family=Reggae+One&family=Potta+One&family=Stick&family=RocknRoll+One&family=DotGothic16&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Kosugi+Maru&display=swap';
    fontLink.rel = 'stylesheet';
    document.head.appendChild(fontLink);

    const canvas = new fabric.Canvas('c', {
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      selection: true,
      allowTouchScrolling: false
    });

    let isEraser = false;
    let isInternalOperation = false;
    const CONNECTED_OUTLINE_BASE_EXTRA = 10;

    const history = [];
    let historyIndex = -1;
    let isRestoring = false;
    const MAX_HISTORY = 50;

    function saveHistory() {
      if (isRestoring || isInternalOperation) return;
      history.splice(historyIndex + 1);
      history.push(canvas.toJSON([
        'selectable', 'evented', 'isConnectedOutline',
        'outlineOwnerId', 'textObjectId', 'outlineWidth', 'outlineColor'
      ]));
      if (history.length > MAX_HISTORY) history.shift();
      else historyIndex++;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      document.getElementById('undoBtn').disabled = historyIndex <= 0;
      document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
    }

    function restoreHistory(index) {
      if (index < 0 || index >= history.length) return;
      isRestoring = true;
      canvas.loadFromJSON(history[index], () => {
        canvas.getObjects().forEach(obj => {
          if (obj.isConnectedOutline) {
            obj.selectable = false;
            obj.evented = false;
          }
        });
        canvas.renderAll();
        isRestoring = false;
        historyIndex = index;
        updateHistoryButtons();
        setStatus('履歴を復元しました');
      });
    }

    setTimeout(saveHistory, 400);

    canvas.on('object:modified', (e) => {
      if (!isRestoring && e.target && !e.target.isConnectedOutline) {
        syncConnectedOutline(e.target);
      }
      if (!isInternalOperation) saveHistory();
    });
    canvas.on('object:added', () => {
      if (!isRestoring && !isInternalOperation) saveHistory();
    });
    canvas.on('object:removed', () => {
      if (!isRestoring && !isInternalOperation) saveHistory();
    });
    canvas.on('path:created', () => {
      if (!isInternalOperation) saveHistory();
    });
    canvas.on('object:moving', (e) => {
      if (e.target && !e.target.isConnectedOutline) syncConnectedOutline(e.target);
    });
    canvas.on('object:scaling', (e) => {
      if (e.target && !e.target.isConnectedOutline) syncConnectedOutline(e.target);
    });
    canvas.on('object:rotating', (e) => {
      if (e.target && !e.target.isConnectedOutline) syncConnectedOutline(e.target);
    });
    canvas.on('object:skewing', (e) => {
      if (e.target && !e.target.isConnectedOutline) syncConnectedOutline(e.target);
    });
    canvas.on('text:changed', (e) => {
      if (e.target && !e.target.isConnectedOutline) {
        syncConnectedOutline(e.target);
        if (!isInternalOperation) saveHistory();
      }
    });

    // 消しゴムを確実に効かせるためにマウスダウンでも強制
    canvas.on('mouse:down', () => {
      if (isEraser && canvas.freeDrawingBrush) {
        canvas.freeDrawingBrush.globalCompositeOperation = 'destination-out';
      }
    });

    const textInput = document.getElementById('textInput');
    const addTextBtn = document.getElementById('addTextBtn');
    const fontSelect = document.getElementById('fontSelect');
    const fontSize = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const textColor = document.getElementById('textColor');
    const midColor = document.getElementById('midColor');
    const syncMidBtn = document.getElementById('syncMidBtn');
    const strokeColor = document.getElementById('strokeColor');
    const strokeWidth = document.getElementById('strokeWidth');
    const strokeWidthVal = document.getElementById('strokeWidthVal');
    const penColor = document.getElementById('penColor');
    const penWidth = document.getElementById('penWidth');
    const penWidthVal = document.getElementById('penWidthVal');
    const penBtn = document.getElementById('penBtn');
    const eraserBtn = document.getElementById('eraserBtn');
    const selectBtn = document.getElementById('selectBtn');
    const bringForwardBtn = document.getElementById('bringForwardBtn');
    const sendBackwardBtn = document.getElementById('sendBackwardBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const addRectBtn = document.getElementById('addRectBtn');
    const addCircleBtn = document.getElementById('addCircleBtn');
    const addTriangleBtn = document.getElementById('addTriangleBtn');
    const importImageBtn = document.getElementById('importImageBtn');
    const imageInput = document.getElementById('imageInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusInfo = document.getElementById('statusInfo');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const exportScale = document.getElementById('exportScale');

    function setStatus(msg) {
      statusInfo.textContent = msg;
    }

    // ========== モード（消しゴム完全修正） ==========
    function setMode(mode) {
      [penBtn, eraserBtn, selectBtn].forEach(b => b.classList.remove('active'));
      canvas.isDrawingMode = false;
      isEraser = false;

      if (mode === 'pen') {
        penBtn.classList.add('active');
        canvas.isDrawingMode = true;
        const brush = new fabric.PencilBrush(canvas);
        brush.color = penColor.value;
        brush.width = parseInt(penWidth.value);
        brush.globalCompositeOperation = 'source-over';
        canvas.freeDrawingBrush = brush;
        setStatus('ペンモード');
      } else if (mode === 'eraser') {
        eraserBtn.classList.add('active');
        canvas.isDrawingMode = true;
        const brush = new fabric.PencilBrush(canvas);
        brush.color = '#000000';  // 色は無視されるが、白にしない
        brush.width = parseInt(penWidth.value) * 2;
        brush.globalCompositeOperation = 'destination-out';
        canvas.freeDrawingBrush = brush;
        isEraser = true;
        setStatus('消しゴムモード（透過で消します）');
      } else {
        selectBtn.classList.add('active');
        setStatus('選択モード');
      }
    }

    // ========== テキスト作成 ==========
    function createTextObject(text) {
      const outlineW = parseInt(strokeWidth.value) || 0;
      const id = 'text_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

      return new fabric.IText(text, {
        left: canvas.width / 2,
        top: canvas.height / 2,
        originX: 'center',
        originY: 'center',
        fontFamily: fontSelect.value,
        fontSize: parseInt(fontSize.value),
        fill: midColor.value,                          // 塗り
        stroke: outlineW > 0 ? textColor.value : null, // 文字色（細い内側）
        strokeWidth: outlineW > 0 ? Math.min(2.5, outlineW) : 0,
        paintFirst: 'stroke',
        strokeLineJoin: 'round',
        strokeLineCap: 'round',
        editable: true,
        objectCaching: false,
        outlineWidth: outlineW,
        outlineColor: strokeColor.value,               // 縁色（外側）
        textObjectId: id
      });
    }

    function getConnectedOutline(textObj) {
      if (!textObj || textObj.isConnectedOutline || !textObj.textObjectId) return null;
      return canvas.getObjects().find(obj =>
        obj.isConnectedOutline && obj.outlineOwnerId === textObj.textObjectId
      ) || null;
    }

    function getOuterStrokeWidth(textObj) {
      const width = Math.max(0, parseInt(textObj.outlineWidth) || 0);
      if (width === 0) return 0;
      const extra = Math.max(CONNECTED_OUTLINE_BASE_EXTRA, Math.round(width * 1.4));
      return width + extra;
    }

    // 縁色を絶対に独立させる
    function createConnectedOutline(textObj) {
      const outerW = getOuterStrokeWidth(textObj);
      const outlineCol = textObj.outlineColor || strokeColor.value;

      return new fabric.IText(textObj.text, {
        left: textObj.left,
        top: textObj.top,
        originX: textObj.originX,
        originY: textObj.originY,
        scaleX: textObj.scaleX,
        scaleY: textObj.scaleY,
        angle: textObj.angle,
        skewX: textObj.skewX,
        skewY: textObj.skewY,
        flipX: textObj.flipX,
        flipY: textObj.flipY,
        fontFamily: textObj.fontFamily,
        fontSize: textObj.fontSize,
        fontWeight: textObj.fontWeight,
        fontStyle: textObj.fontStyle,
        charSpacing: textObj.charSpacing,
        lineHeight: textObj.lineHeight,
        fill: outlineCol,
        stroke: outlineCol,
        strokeWidth: outerW,
        paintFirst: 'stroke',
        strokeLineJoin: 'round',
        strokeLineCap: 'round',
        selectable: false,
        evented: false,
        editable: false,
        objectCaching: false,
        isConnectedOutline: true,
        outlineOwnerId: textObj.textObjectId
      });
    }

    function syncConnectedOutline(textObj) {
      if (!textObj || textObj.isConnectedOutline) return;
      if (textObj.type !== 'i-text' && textObj.type !== 'text') return;

      const outline = getConnectedOutline(textObj);
      if (!outline) return;

      const outerW = getOuterStrokeWidth(textObj);
      const outlineCol = textObj.outlineColor || strokeColor.value;

      outline.set({
        left: textObj.left,
        top: textObj.top,
        scaleX: textObj.scaleX,
        scaleY: textObj.scaleY,
        angle: textObj.angle,
        skewX: textObj.skewX,
        skewY: textObj.skewY,
        flipX: textObj.flipX,
        flipY: textObj.flipY,
        text: textObj.text,
        fontFamily: textObj.fontFamily,
        fontSize: textObj.fontSize,
        fontWeight: textObj.fontWeight,
        fontStyle: textObj.fontStyle,
        charSpacing: textObj.charSpacing,
        lineHeight: textObj.lineHeight,
        fill: outlineCol,
        stroke: outlineCol,
        strokeWidth: outerW,
        objectCaching: false
      });
      outline.set('opacity', outerW > 0 ? 1 : 0);
      outline.initDimensions();
      outline.setCoords();
      outline.dirty = true;
    }

    function addTextWithOutline(textObj) {
      const outline = createConnectedOutline(textObj);
      isInternalOperation = true;
      canvas.add(outline);
      canvas.add(textObj);
      isInternalOperation = false;
      canvas.setActiveObject(textObj);
      try {
        textObj.enterEditing();
        textObj.selectAll();
      } catch (e) {}
      canvas.requestRenderAll();
      saveHistory();
    }

    function removeTextWithOutline(textObj) {
      if (!textObj) return;
      const outline = getConnectedOutline(textObj);
      isInternalOperation = true;
      if (outline) canvas.remove(outline);
      canvas.remove(textObj);
      isInternalOperation = false;
      canvas.discardActiveObject();
      canvas.requestRenderAll();
      saveHistory();
    }

    addTextBtn.addEventListener('click', () => {
      const text = textInput.value.trim() || 'テキスト';
      const newFont = fontSelect.value;

      document.fonts.load(`16px "${newFont}"`).then(() => {
        const textObj = createTextObject(text);
        addTextWithOutline(textObj);
        setMode('select');
        setStatus('テキストを追加しました');
      }).catch(() => {
        const textObj = createTextObject(text);
        addTextWithOutline(textObj);
        setMode('select');
        setStatus('テキストを追加しました（フォント注意）');
      });
    });

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTextBtn.click();
    });

    function applyFontToActive() {
      const active = canvas.getActiveObject();
      if (!active || (active.type !== 'i-text' && active.type !== 'text')) return;

      const newFont = fontSelect.value;
      document.fonts.load(`16px "${newFont}"`).then(() => {
        active.set({ fontFamily: newFont, objectCaching: false });
        active.dirty = true;
        active.initDimensions();
        active.setCoords();
        syncConnectedOutline(active);
        canvas.requestRenderAll();
        saveHistory();
        setStatus('フォント変更: ' + newFont);
      }).catch(() => {
        active.set({ fontFamily: newFont, objectCaching: false });
        active.dirty = true;
        active.initDimensions();
        syncConnectedOutline(active);
        canvas.requestRenderAll();
        setStatus('フォント変更（読み込み確認失敗）');
      });
    }
    fontSelect.addEventListener('change', applyFontToActive);

    fontSize.addEventListener('input', () => {
      fontSizeVal.textContent = fontSize.value;
      const active = canvas.getActiveObject();
      if (active && (active.type === 'i-text' || active.type === 'text')) {
        active.set('fontSize', parseInt(fontSize.value));
        active.initDimensions();
        syncConnectedOutline(active);
        canvas.requestRenderAll();
      }
    });
    fontSize.addEventListener('change', saveHistory);

    textColor.addEventListener('input', () => {
      const active = canvas.getActiveObject();
      if (active && (active.type === 'i-text' || active.type === 'text')) {
        const w = active.outlineWidth || 0;
        if (w > 0) {
          active.set('stroke', textColor.value);
          active.dirty = true;
          canvas.requestRenderAll();
        }
      }
    });
    textColor.addEventListener('change', saveHistory);

    midColor.addEventListener('input', () => {
      const active = canvas.getActiveObject();
      if (!active) return;

      if (active.type === 'i-text' || active.type === 'text') {
        if (active.isEditing && active.selectionStart !== active.selectionEnd) {
          active.setSelectionStyles({ fill: midColor.value }, active.selectionStart, active.selectionEnd);
        } else {
          active.set('fill', midColor.value);
        }
        active.dirty = true;
        // 塗りを変えても縁色は絶対に触らない
        syncConnectedOutline(active);
        canvas.requestRenderAll();
      } else if (['rect', 'circle', 'triangle'].includes(active.type)) {
        active.set('fill', midColor.value);
        active.dirty = true;
        canvas.requestRenderAll();
      }
    });
    midColor.addEventListener('change', saveHistory);

    syncMidBtn.addEventListener('click', () => {
      midColor.value = textColor.value;
      midColor.dispatchEvent(new Event('input'));
      setStatus('塗りを文字色と同じにしました');
    });

    function updateStroke() {
      strokeWidthVal.textContent = strokeWidth.value;
      const active = canvas.getActiveObject();
      if (!active) return;

      const w = parseInt(strokeWidth.value) || 0;

      if (active.type === 'i-text' || active.type === 'text') {
        active.set({
          fill: midColor.value,
          stroke: w > 0 ? textColor.value : null,
          strokeWidth: w > 0 ? Math.min(2.5, w) : 0,
          paintFirst: 'stroke',
          strokeLineJoin: 'round',
          strokeLineCap: 'round',
          objectCaching: false,
          outlineWidth: w,
          outlineColor: strokeColor.value   // 縁色を強制保存
        });
        active.dirty = true;
        syncConnectedOutline(active);
      } else if (['rect', 'circle', 'triangle'].includes(active.type)) {
        active.set({
          fill: midColor.value,
          stroke: w > 0 ? strokeColor.value : null,
          strokeWidth: w
        });
        active.dirty = true;
      }
      canvas.requestRenderAll();
    }

    strokeColor.addEventListener('input', updateStroke);
    strokeWidth.addEventListener('input', updateStroke);
    strokeColor.addEventListener('change', saveHistory);
    strokeWidth.addEventListener('change', saveHistory);

    penWidth.addEventListener('input', () => {
      penWidthVal.textContent = penWidth.value;
      if (canvas.isDrawingMode && canvas.freeDrawingBrush) {
        canvas.freeDrawingBrush.width = isEraser
          ? parseInt(penWidth.value) * 2
          : parseInt(penWidth.value);
      }
    });
    penColor.addEventListener('input', () => {
      if (canvas.isDrawingMode && !isEraser && canvas.freeDrawingBrush) {
        canvas.freeDrawingBrush.color = penColor.value;
      }
    });

    penBtn.addEventListener('click', () => setMode('pen'));
    eraserBtn.addEventListener('click', () => setMode('eraser'));
    selectBtn.addEventListener('click', () => setMode('select'));

    function moveTextWithOutline(textObj, direction) {
      const outline = getConnectedOutline(textObj);
      if (direction === 'forward') canvas.bringForward(textObj);
      else canvas.sendBackwards(textObj);
      if (outline) {
        const idx = canvas.getObjects().indexOf(textObj);
        if (idx > 0) canvas.moveTo(outline, idx - 1);
        else canvas.sendToBack(outline);
      }
    }

    bringForwardBtn.addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (!active) return;
      if (active.type === 'i-text' || active.type === 'text') {
        moveTextWithOutline(active, 'forward');
      } else {
        canvas.bringForward(active);
      }
      canvas.requestRenderAll();
      saveHistory();
    });

    sendBackwardBtn.addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (!active) return;
      if (active.type === 'i-text' || active.type === 'text') {
        moveTextWithOutline(active, 'backward');
      } else {
        canvas.sendBackwards(active);
      }
      canvas.requestRenderAll();
      saveHistory();
    });

    deleteBtn.addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (!active) return;
      if (active.type === 'i-text' || active.type === 'text') {
        removeTextWithOutline(active);
      } else {
        canvas.remove(active);
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        saveHistory();
      }
    });

    function addShape(type) {
      const w = parseInt(strokeWidth.value) || 0;
      const common = {
        left: canvas.width / 2,
        top: canvas.height / 2,
        originX: 'center',
        originY: 'center',
        fill: midColor.value,
        stroke: w > 0 ? strokeColor.value : null,
        strokeWidth: w,
        strokeLineJoin: 'round',
        strokeLineCap: 'round',
        objectCaching: false
      };

      let shape;
      if (type === 'rect') shape = new fabric.Rect({ ...common, width: 120, height: 120, rx: 8, ry: 8 });
      else if (type === 'circle') shape = new fabric.Circle({ ...common, radius: 60 });
      else if (type === 'triangle') shape = new fabric.Triangle({ ...common, width: 120, height: 110 });
      if (!shape) return;

      canvas.add(shape);
      canvas.setActiveObject(shape);
      canvas.requestRenderAll();
      setMode('select');
      setStatus(type === 'rect' ? '四角を追加' : type === 'circle' ? '丸を追加' : '三角を追加');
      saveHistory();
    }

    addRectBtn.addEventListener('click', () => addShape('rect'));
    addCircleBtn.addEventListener('click', () => addShape('circle'));
    addTriangleBtn.addEventListener('click', () => addShape('triangle'));

    importImageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        fabric.Image.fromURL(event.target.result, (img) => {
          const maxSize = 400;
          if (img.width > maxSize || img.height > maxSize) {
            img.scale(Math.min(maxSize / img.width, maxSize / img.height));
          }
          img.set({
            left: canvas.width / 2,
            top: canvas.height / 2,
            originX: 'center',
            originY: 'center'
          });
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.requestRenderAll();
          setMode('select');
          setStatus('画像を追加しました');
          saveHistory();
        });
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    });

    downloadBtn.addEventListener('click', () => {
      canvas.discardActiveObject();
      canvas.requestRenderAll();

      const originalBg = canvas.backgroundColor;
      canvas.backgroundColor = null;
      canvas.requestRenderAll();

      const scale = parseInt(exportScale.value) || 2;
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1,
        multiplier: scale
      });

      canvas.backgroundColor = originalBg;
      canvas.requestRenderAll();

      const link = document.createElement('a');
      link.download = 'vtuber-logo.png';
      link.href = dataURL;
      link.click();
      setStatus(`背景透過PNGを保存しました（${scale}x）`);
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('キャンバスをすべて消去しますか？')) {
        isInternalOperation = true;
        canvas.clear();
        isInternalOperation = false;
        canvas.backgroundColor = '#ffffff';
        canvas.requestRenderAll();
        saveHistory();
        setStatus('すべて消去しました');
      }
    });

    undoBtn.addEventListener('click', () => {
      if (historyIndex > 0) restoreHistory(historyIndex - 1);
    });
    redoBtn.addEventListener('click', () => {
      if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z' || e.key === 'Z') {
          e.preventDefault();
          if (historyIndex > 0) restoreHistory(historyIndex - 1);
          return;
        }
        if (e.key === 'y' || e.key === 'Y') {
          e.preventDefault();
          if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
          return;
        }
      }

      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (canvas.getActiveObject()?.isEditing) return;
        if (document.activeElement === textInput) return;

        const active = canvas.getActiveObject();
        if (!active) return;

        if (active.type === 'i-text' || active.type === 'text') {
          removeTextWithOutline(active);
        } else {
          canvas.remove(active);
          canvas.discardActiveObject();
          canvas.requestRenderAll();
          saveHistory();
        }
      }
    });

    function updateControlsFromObject() {
      const active = canvas.getActiveObject();
      if (!active) return;

      if (active.type === 'i-text' || active.type === 'text') {
        if (active.fontFamily) {
          const opt = Array.from(fontSelect.options).find(o => o.value === active.fontFamily);
          if (opt) fontSelect.value = active.fontFamily;
        }
        if (active.fill && typeof active.fill === 'string') {
          midColor.value = active.fill;
        }
        if (active.stroke && typeof active.stroke === 'string') {
          textColor.value = active.stroke;
        }
        if (typeof active.outlineWidth === 'number') {
          strokeWidth.value = active.outlineWidth;
          strokeWidthVal.textContent = active.outlineWidth;
        }
        if (active.outlineColor) {
          strokeColor.value = active.outlineColor;
        }
        if (typeof active.fontSize === 'number') {
          fontSize.value = active.fontSize;
          fontSizeVal.textContent = active.fontSize;
        }
      } else if (['rect', 'circle', 'triangle'].includes(active.type)) {
        if (active.fill && typeof active.fill === 'string') {
          midColor.value = active.fill;
        }
        if (active.stroke && typeof active.stroke === 'string') {
          strokeColor.value = active.stroke;
        }
        if (typeof active.strokeWidth === 'number') {
          strokeWidth.value = active.strokeWidth;
          strokeWidthVal.textContent = active.strokeWidth;
        }
      }
    }

    canvas.on('selection:created', updateControlsFromObject);
    canvas.on('selection:updated', updateControlsFromObject);

    function fitCanvasToScreen() {
      const wrap = document.querySelector('.canvas-wrap');
      if (!wrap) return;

      const padding = 16;
      const availableW = wrap.clientWidth - padding;
      const availableH = wrap.clientHeight - padding;
      const baseW = 900, baseH = 520, ratio = baseW / baseH;

      let newW, newH;
      if (availableW / availableH > ratio) {
        newH = Math.min(baseH, availableH);
        newW = newH * ratio;
      } else {
        newW = Math.min(baseW, availableW);
        newH = newW / ratio;
      }

      newW = Math.max(280, Math.round(newW));
      newH = Math.max(160, Math.round(newH));

      if (Math.abs(canvas.getWidth() - newW) > 4 || Math.abs(canvas.getHeight() - newH) > 4) {
        canvas.setDimensions({ width: newW, height: newH });
        canvas.requestRenderAll();
      }
    }

    window.addEventListener('resize', () => setTimeout(fitCanvasToScreen, 100));
    window.addEventListener('orientationchange', () => setTimeout(fitCanvasToScreen, 200));

    setMode('select');
    setStatus('準備完了');
    setTimeout(fitCanvasToScreen, 400);
  </script>
</body>
</html>
