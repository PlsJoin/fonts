<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ロゴメーカー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol:wght@400;700&family=Kaisei+HarunoUmi:wght@400;700&family=Kaisei+Tokumin:wght@400;700;800&family=Klee+One:wght@400;600&family=Kosugi&family=Kosugi+Maru&family=M+PLUS+1p:wght@400;500;700;800;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;500;700;900&family=New+Tegomin&family=Nikukyu&family=Potta+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;500;700;800&family=Stick&family=Train+One&family=Yusei+Magic&family=Yuji+Boku&family=Yuji+Mai&family=Zen+Antique&family=Zen+Antique+Soft&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Kurenaido&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="fabric.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Noto Sans JP",sans-serif;background:#17181c;color:#e8e9eb}
button,input,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.topbar{height:54px;background:#1f2126;border-bottom:1px solid #33363f;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.logo{font-size:15px;font-weight:800;margin-right:10px;white-space:nowrap;letter-spacing:.02em}
.logo span{font-size:10px;color:#9aa0aa;font-weight:400;margin-left:5px}
.toolbar-group{display:flex;align-items:center;gap:3px;padding-right:8px;margin-right:2px;border-right:1px solid #33363f}
.tool-btn{height:34px;min-width:34px;padding:0 10px;border:1px solid transparent;background:transparent;border-radius:7px;color:#d6d8dc;font-size:12px;transition:background .15s,color .15s}
.tool-btn:hover{background:#2c2f37;color:#fff}
.tool-btn.danger:hover{color:#ff8a80;background:rgba(255,90,80,.12)}
.tool-btn.primary-btn{background:#5b7fff;border-color:#5b7fff;color:#fff;font-weight:700}
.tool-btn.primary-btn:hover{background:#6d8bff}
#installBtn{background:#5b7fff;border-color:#5b7fff;color:#fff;font-weight:700}
#installBtn:hover{background:#6d8bff}
.zoom-box{display:flex;align-items:center;gap:5px;margin-left:auto}
.zoom-box button{width:29px;height:29px;border:1px solid #3a3d46;background:#26282f;color:#e8e9eb;border-radius:6px}
.zoom-box button:hover{background:#2f323b}
.zoom-value{min-width:44px;text-align:center;font-size:11px;color:#c6c9cf}
.main{flex:1;min-height:0;display:flex}
.leftbar{width:68px;background:#1f2126;border-right:1px solid #33363f;padding:8px 5px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.left-tool{width:58px;min-height:48px;border:1px solid transparent;background:transparent;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:10px;color:#c6c9cf;transition:background .15s,color .15s}
.left-tool:hover{background:#2c2f37;color:#fff}
.left-tool.active{background:#5b7fff;border-color:#5b7fff;color:#fff}
.left-tool .icon{font-size:18px;line-height:1}
.tool-separator{height:1px;background:#33363f;margin:5px 8px}
.canvas-area{flex:1;min-width:0;min-height:0;overflow:auto;background:#131418;position:relative;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px}
.canvas-wrap{position:relative;width:1200px;height:800px;margin:18px auto;background:#fff;box-shadow:0 8px 34px rgba(0,0,0,.5);border-radius:2px}
.grid{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);background-size:20px 20px}
.canvas-container{position:absolute!important;left:0!important;top:0!important;z-index:2}
#loadingOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.45);color:#fff;font-size:14px;font-weight:700;letter-spacing:.08em;z-index:50}
#dropHint{position:absolute;inset:10px;display:none;align-items:center;justify-content:center;border:2px dashed #5b7fff;border-radius:10px;background:rgba(91,127,255,.10);color:#aebfff;font-size:15px;font-weight:700;z-index:40;pointer-events:none}
.rightbar{width:322px;background:#1f2126;border-left:1px solid #33363f;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.panel-title{height:40px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid #33363f;font-size:13px;font-weight:700;letter-spacing:.04em}
.properties{flex:1;overflow:auto}
.properties::-webkit-scrollbar,.layer-list::-webkit-scrollbar{width:9px}
.properties::-webkit-scrollbar-thumb,.layer-list::-webkit-scrollbar-thumb{background:#3a3d46;border-radius:5px}
.section{padding:11px 13px;border-bottom:1px solid #2b2e36}
.section-title{font-size:11px;font-weight:700;color:#9aa0aa;margin-bottom:9px;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
.label{width:70px;flex-shrink:0;font-size:11px;color:#a7abb5}
input[type="text"],input[type="number"],select{width:100%;height:31px;border:1px solid #3a3d46;background:#26282f;color:#eef0f3;border-radius:6px;padding:0 8px;font-size:12px;outline:none}
input[type="text"]:focus,input[type="number"]:focus,select:focus{border-color:#5b7fff}
input[type="color"]{width:42px;height:31px;border:1px solid #3a3d46;padding:2px;background:#26282f;border-radius:6px;cursor:pointer}
input[type="range"]{flex:1;accent-color:#5b7fff}
.range-value{width:38px;text-align:right;color:#9aa0aa;font-size:10px}
.check{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:12px;cursor:pointer}
.check input{accent-color:#5b7fff;width:15px;height:15px}
.color-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.color-row span{width:40px;font-size:11px;color:#a7abb5}
.gradient-preview{width:100%;height:26px;border:1px solid #3a3d46;border-radius:6px;margin-top:7px}
.small-btn{height:31px;border:1px solid #3a3d46;background:#26282f;color:#e8e9eb;border-radius:6px;padding:0 10px;font-size:11px;transition:background .15s}
.small-btn:hover{background:#2f323b}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.no-selection{padding:22px 13px;color:#8b9099;font-size:11px;line-height:1.8}
.layers{height:192px;border-top:1px solid #33363f;flex-shrink:0;display:flex;flex-direction:column}
.layer-list{flex:1;overflow:auto}
.layer-item{height:31px;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid #26282f;font-size:11px;cursor:pointer;color:#d6d8dc}
.layer-item:hover{background:#26282f}
.layer-item.selected{background:rgba(91,127,255,.18)}
.layer-icon{width:18px;text-align:center;color:#9aa0aa}
.layer-name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.statusbar{height:27px;background:#1f2126;border-top:1px solid #33363f;display:flex;align-items:center;gap:15px;padding:0 11px;font-size:10px;color:#9aa0aa;flex-shrink:0}
.modal-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:1000}
.modal{width:360px;background:#23252c;border:1px solid #3a3d46;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.5);overflow:hidden;color:#e8e9eb}
.modal-head{padding:13px 15px;border-bottom:1px solid #33363f;font-size:14px;font-weight:700}
.modal-body{padding:15px}
.modal-foot{padding:11px 15px;border-top:1px solid #33363f;display:flex;justify-content:flex-end;gap:7px}
.primary{background:#5b7fff;color:#fff;border-color:#5b7fff;font-weight:700}
.primary:hover{background:#6d8bff}
.context-menu{position:fixed;display:none;width:176px;background:#23252c;border:1px solid #3a3d46;box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:9px;z-index:2000;padding:5px 0}
.context-menu button{width:100%;height:31px;border:0;background:transparent;color:#e8e9eb;text-align:left;padding:0 13px;font-size:11px}
.context-menu button:hover{background:#2f323b}
.mobile-toggle-btn{display:none;position:fixed;top:10px;right:10px;z-index:3000;height:35px;padding:0 13px;background:#5b7fff;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.shape-picker{display:none;position:fixed;background:#23252c;border:1px solid #3a3d46;border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:9px;z-index:2600;grid-template-columns:repeat(3,1fr);gap:7px}
.shape-picker.open{display:grid}
.shape-picker button{width:58px;height:54px;border:1px solid #3a3d46;border-radius:8px;background:#26282f;color:#e8e9eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}
.shape-picker button:hover{background:#2f323b;border-color:#5b7fff}
.shape-picker .icon{font-size:20px}
@media (max-width:900px){
.leftbar{width:54px}
.left-tool{width:46px;min-height:44px;font-size:9px}
.left-tool .icon{font-size:16px}
.rightbar{position:fixed;top:0;right:0;bottom:0;width:292px;max-width:86vw;z-index:2500;transform:translateX(100%);transition:transform .22s ease;box-shadow:-6px 0 22px rgba(0,0,0,.4)}
.rightbar.open{transform:translateX(0)}
.mobile-toggle-btn{display:block}
.canvas-wrap{margin:10px auto}
.topbar{padding-right:104px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="logo">ロゴメーカー <span>Logo Editor</span></div>
<div class="toolbar-group">
<button class="tool-btn" onclick="undo()">↶</button>
<button class="tool-btn" onclick="redo()">↷</button>
</div>
<div class="toolbar-group">
<button class="tool-btn" onclick="copyObject()">コピー</button>
<button class="tool-btn" onclick="pasteObject()">貼り付け</button>
<button class="tool-btn" onclick="duplicateObject()">複製</button>
<button class="tool-btn danger" onclick="deleteObject()">削除</button>
</div>
<div class="toolbar-group">
<button class="tool-btn" onclick="bringFront()">最前面</button>
<button class="tool-btn" onclick="sendBack()">最背面</button>
</div>
<div class="toolbar-group">
<button class="tool-btn" onclick="alignLeft()">左</button>
<button class="tool-btn" onclick="alignCenter()">中央</button>
<button class="tool-btn" onclick="alignRight()">右</button>
<button class="tool-btn" onclick="centerObject()">中心へ</button>
</div>
<div class="toolbar-group" style="margin-left:auto;border:none;gap:3px">
<span style="font-size:11px;color:#666">W</span>
<input type="number" id="canvasW" value="1200" min="200" max="3000" style="width:54px;height:28px;font-size:11px" onchange="resizeCanvas(this.value,document.getElementById('canvasH').value)">
<span style="font-size:11px;color:#666">H</span>
<input type="number" id="canvasH" value="800" min="200" max="2000" style="width:54px;height:28px;font-size:11px" onchange="resizeCanvas(document.getElementById('canvasW').value,this.value)">
</div>
<div class="zoom-box">
<button onclick="changeZoom(-0.1)">−</button>
<div class="zoom-value" id="zoomValue">100%</div>
<button onclick="changeZoom(0.1)">＋</button>
</div>
<button class="tool-btn" onclick="newProject()">新規</button>
<button class="tool-btn" id="installBtn" style="display:none" onclick="installApp()">インストール</button>
<button class="tool-btn primary-btn" onclick="openExport()">PNG出力</button>
</header>
<button class="mobile-toggle-btn" onclick="toggleRightPanel()">プロパティ</button>
<main class="main">
<aside class="leftbar">
<button class="left-tool active" data-tool="select" onclick="setTool('select')"><span class="icon">↖</span>選択</button>
<button class="left-tool" data-tool="text" onclick="setTool('text')"><span class="icon">T</span>文字</button>
<button class="left-tool" data-tool="shape" onclick="toggleShapePicker(event)" id="shapeToolBtn"><span class="icon">◇</span>図形</button>
<div class="tool-separator"></div>
<button class="left-tool" data-tool="pen" onclick="setTool('pen')"><span class="icon">✎</span>ペン</button>
<button class="left-tool" data-tool="image" onclick="pickImage()"><span class="icon">▧</span>画像</button>
<input type="file" id="imageInput" accept="image/*" style="display:none">
</aside>
<section class="canvas-area" id="canvasArea">
<div id="dropHint">画像をドロップして追加できます</div>
<div id="loadingOverlay">読み込み中…</div>
<div class="canvas-wrap">
<div class="grid"></div>
<canvas id="logoCanvas" width="1200" height="800"></canvas>
</div>
</section>
<aside class="rightbar" id="rightbar">
<div class="panel-title">プロパティ</div>
<div class="properties" id="properties">
<div class="no-selection">オブジェクトを選択してください。<br>文字や図形を選ぶとここから編集できます。</div>
</div>
<div class="layers">
<div class="panel-title">レイヤー</div>
<div class="layer-list" id="layerList"></div>
</div>
</aside>
</main>
<footer class="statusbar">
<span id="objectStatus">オブジェクトなし</span>
<span id="positionStatus">X: -　Y: -</span>
<span id="sizeStatus">W: -　H: -</span>
<span id="toolStatus">選択ツール</span>
</footer>
</div>

<div class="shape-picker" id="shapePicker">
<button onclick="pickShape('rect')"><span class="icon">□</span>四角</button>
<button onclick="pickShape('circle')"><span class="icon">○</span>円</button>
<button onclick="pickShape('triangle')"><span class="icon">△</span>三角</button>
<button onclick="pickShape('star')"><span class="icon">☆</span>星</button>
<button onclick="pickShape('line')"><span class="icon">／</span>線</button>
</div>

<div class="modal-bg" id="exportModal">
<div class="modal">
<div class="modal-head">PNGとして書き出す</div>
<div class="modal-body">
<div class="row"><div class="label">倍率</div>
<select id="exportScale">
<option value="1">1倍</option>
<option value="2" selected>2倍</option>
<option value="3">3倍</option>
<option value="4">4倍</option>
</select>
</div>
<label class="check"><input type="checkbox" id="transparentExport" checked>背景を透明にする</label>
</div>
<div class="modal-foot">
<button class="small-btn" onclick="closeExport()">キャンセル</button>
<button class="small-btn primary" onclick="exportPNG()">PNGを書き出す</button>
</div>
</div>
</div>

<div class="context-menu" id="contextMenu">
<button onclick="contextCopy()">コピー</button>
<button onclick="contextPaste()">貼り付け</button>
<button onclick="duplicateObject();hideContext()">複製</button>
<button onclick="deleteObject();hideContext()">削除</button>
<button onclick="bringFront();hideContext()">最前面へ</button>
<button onclick="sendBack();hideContext()">最背面へ</button>
<button onclick="centerObject();hideContext()">中心へ</button>
</div>

<script>
const canvas = new fabric.Canvas("logoCanvas",{width:1200,height:800,selection:true,preserveObjectStacking:true,selectionColor:"rgba(50,100,255,.12)",selectionBorderColor:"#4d72ff",selectionLineWidth:1,backgroundColor:"#fff"});
let currentTool = "select";
let currentShape = "rect";
let clipboard = null;
let history = [];
let historyIndex = -1;
let restoringHistory = false;
let zoom = 1;
let penColor = "#222222";
let penWidth = 8;
let canvasWidth = 1200;
let canvasHeight = 800;
let gradientMode = "vertical";

const fonts = [["Noto Sans JP","Noto Sans JP","標準・万能"],["Noto Serif JP","Noto Serif JP","明朝・上品"],["Zen Kaku Gothic New","Zen Kaku Gothic New","現代・すっきり"],["Zen Maru Gothic","Zen Maru Gothic","丸文字・やわらか"],["Dela Gothic One","Dela Gothic One","極太・インパクト"],["M PLUS Rounded 1c","M PLUS Rounded 1c","丸文字・ポップ"],["Mochiy Pop One","Mochiy Pop One","ポップ・太文字"],["Shippori Mincho","Shippori Mincho","明朝・高級感"],["Yuji Boku","Yuji Boku","筆文字・和風"],["Train One","Train One","アウトライン"],["RocknRoll One","RocknRoll One","ロック・太文字"],["Rampart One","Rampart One","立体・装飾"],["DotGothic16","DotGothic16","ドット・ゲーム風"],["Hachi Maru Pop","Hachi Maru Pop","手書き・ゆるい"],["Klee One","Klee One","手書き・自然"],["sans-serif","sans-serif","標準"],["serif","serif","明朝"]];

function selectedObject(){return canvas.getActiveObject()}
function selectedObjects(){const o=canvas.getActiveObject();if(!o)return[];return o.type==="activeSelection"?o.getObjects():[o]}
function escapeHtml(t){return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function getColor(v){return (typeof v==="string"&&v.startsWith("#"))?v:"#222222"}

function setTool(tool){
  currentTool=tool;
  document.querySelectorAll(".left-tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===tool));
  canvas.isDrawingMode=tool==="pen";
  canvas.selection=tool==="select";
  canvas.defaultCursor=tool==="select"?"default":"crosshair";
  if(tool==="pen"){
    if(!canvas.freeDrawingBrush)canvas.freeDrawingBrush=new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color=penColor;
    canvas.freeDrawingBrush.width=penWidth;
  }
  if(tool!=="shape") hideShapePicker();
  const names={select:"選択ツール",text:"文字ツール",shape:"図形ツール",pen:"ペンツール",image:"画像ツール"};
  document.getElementById("toolStatus").textContent=names[tool]||tool;
  updateUI();
}

function toggleShapePicker(e){
  e.stopPropagation();
  const picker=document.getElementById("shapePicker");
  const btn=document.getElementById("shapeToolBtn");
  if(picker.classList.contains("open")){hideShapePicker();return}
  setTool("shape");
  const r=btn.getBoundingClientRect();
  picker.style.left=(r.right+6)+"px";
  picker.style.top=r.top+"px";
  picker.classList.add("open");
}

function hideShapePicker(){document.getElementById("shapePicker").classList.remove("open")}
function pickShape(type){currentShape=type;hideShapePicker();setTool("shape")}

function addText(x,y){
  const t=new fabric.IText("ロゴ",{left:x,top:y,fontFamily:"Dela Gothic One",fontSize:140,fontWeight:"700",fill:"#222",originX:"center",originY:"center",editable:true,padding:4});
  canvas.add(t);canvas.setActiveObject(t);t.enterEditing();t.selectAll();canvas.requestRenderAll();saveHistory();
}
function addRect(x,y){const o=new fabric.Rect({left:x,top:y,width:240,height:140,fill:"#222",rx:8,ry:8,originX:"center",originY:"center"});canvas.add(o);canvas.setActiveObject(o);saveHistory()}
function addCircle(x,y){const o=new fabric.Circle({left:x,top:y,radius:90,fill:"#222",originX:"center",originY:"center"});canvas.add(o);canvas.setActiveObject(o);saveHistory()}
function addTriangle(x,y){const o=new fabric.Triangle({left:x,top:y,width:200,height:180,fill:"#222",originX:"center",originY:"center"});canvas.add(o);canvas.setActiveObject(o);saveHistory()}
function createStarPoints(){const p=[];const outer=100,inner=42;for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180;const r=i%2===0?outer:inner;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r})}return p}
function addStar(x,y){const o=new fabric.Polygon(createStarPoints(),{left:x,top:y,fill:"#222",originX:"center",originY:"center"});canvas.add(o);canvas.setActiveObject(o);saveHistory()}
function addLine(x,y){const o=new fabric.Line([x-120,y,x+120,y],{stroke:"#222",strokeWidth:10});canvas.add(o);canvas.setActiveObject(o);saveHistory()}

canvas.on("mouse:down",function(opt){
  if(currentTool==="select"||currentTool==="pen")return;
  const p=canvas.getPointer(opt.e);
  if(currentTool==="text"){addText(p.x,p.y);setTool("select");return}
  if(currentTool==="shape"){
    if(currentShape==="rect")addRect(p.x,p.y);
    else if(currentShape==="circle")addCircle(p.x,p.y);
    else if(currentShape==="triangle")addTriangle(p.x,p.y);
    else if(currentShape==="star")addStar(p.x,p.y);
    else if(currentShape==="line")addLine(p.x,p.y);
    setTool("select");return;
  }
  if(currentTool==="image"){document.getElementById("imageInput").click();setTool("select")}
});

canvas.on("path:created",function(e){e.path.set({stroke:canvas.freeDrawingBrush.color,strokeWidth:canvas.freeDrawingBrush.width,fill:null});saveHistory();updateUI()});
function pickImage(){document.getElementById("imageInput").click()}
function showLoading(on){document.getElementById("loadingOverlay").style.display=on?"flex":"none"}
function loadImageFile(file){
  if(!file||!file.type||!file.type.startsWith("image/"))return;
  showLoading(true);
  const url=URL.createObjectURL(file);
  const probe=new Image();
  probe.onload=function(){
    const maxSide=1600;const w=probe.naturalWidth,h=probe.naturalHeight;
    const ratio=Math.min(1,maxSide/Math.max(w,h));
    let src=url;
    if(ratio<1){
      const c=document.createElement("canvas");c.width=Math.round(w*ratio);c.height=Math.round(h*ratio);

        restoringHistory=true;
        const size=(localStorage.getItem("logomaker-size")||"").split("x");
        if(size.length===2&&(Number(size[0])!==canvasWidth||Number(size[1])!==canvasHeight)){
          document.getElementById("canvasW").value=size[0];document.getElementById("canvasH").value=size[1];
          resizeCanvas(Number(size[0]),Number(size[1]));
        }
        canvas.loadFromJSON(saved,function(){canvas.renderAll();restoringHistory=false;setTool("select");saveHistory();updateUI()});
        return;
      }
    }
  }catch(e){}
  setTool("select");saveHistory();updateUI();
})();
function newProject(){if(!confirm("キャンバスを白紙に戻しますか？（「元に戻す」で戻せます）"))return;canvas.clear();canvas.backgroundColor="#fff";canvas.renderAll();saveHistory();updateUI()}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstallPrompt=e;document.getElementById("installBtn").style.display=""});
function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(function(){deferredInstallPrompt=null;document.getElementById("installBtn").style.display="none"})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
