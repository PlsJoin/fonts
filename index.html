<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ロゴメーカー</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Kosugi+Maru&family=Shippori+Mincho:wght@400;700;800&family=Zen+Maru+Gothic:wght@400;700;900&family=Kaisei+Decol:wght@400;700&family=Hina+Mincho&family=Yuji+Syuku&family=DotGothic16&family=Kiwi+Maru:wght@400;500&family=Mochiy+Pop+One&family=Stick&family=Train+One&family=Monospace&family=Arial&family=Georgia&display=swap" rel="stylesheet">
<script src="fabric.min.js"></script>
<style>
:root{--bg:#0a0a0b;--panel:#131315;--panel2:#1b1b1e;--panel3:#232327;--border:#26262c;--border2:#33333a;--text:#ececf1;--muted:#9c9ca6;--accent:#0d99ff;--accent-d:#0b85dd;--danger:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font-family:inherit;color:var(--text)}
.app{display:flex;height:100vh;height:100dvh}
/* ===== 左レール ===== */
.rail{width:66px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:30;overflow-y:auto;overflow-x:hidden}
.rail::-webkit-scrollbar{width:0}
.rail-brand{width:38px;height:38px;background:var(--accent);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;flex-shrink:0}
.rail-btn{width:56px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);border-radius:3px;position:relative;flex-shrink:0;padding:5px 0}
.rail-btn .ic{font-size:17px;line-height:1}
.rail-btn .lb{font-size:9px;line-height:1;letter-spacing:.02em}
.rail-btn:hover{background:var(--panel2);color:var(--text)}
.rail-btn.active{color:var(--accent)}
.rail-btn.active::before{content:"";position:absolute;left:-5px;top:8px;bottom:8px;width:3px;background:var(--accent)}
.rail-btn:disabled{opacity:.32;cursor:default;background:none;color:var(--muted)}
.rail-sep{width:36px;height:1px;background:var(--border2);margin:7px 0;flex-shrink:0}
.rail-spacer{flex:1;min-height:8px}
.rail-btn.primary{background:var(--accent);color:#fff}
.rail-btn.primary:hover{background:var(--accent-d);color:#fff}
.rail-btn.danger:hover{background:#3a1d1d;color:var(--danger)}
/* ===== ワークスペース ===== */
.workspace{flex:1;position:relative;overflow:auto;background-color:#080809;background-image:linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px;display:flex;align-items:center;justify-content:center;min-width:0}
.canvas-wrap{position:relative;box-shadow:0 10px 44px rgba(0,0,0,.65);flex-shrink:0;margin:auto}
.zoom-pill{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:2px;background:rgba(19,19,21,.94);border:1px solid var(--border2);border-radius:3px;padding:3px}
.zoom-pill button{height:28px;min-width:28px;padding:0 8px;font-size:12px;color:var(--muted);border-radius:2px}
.zoom-pill button:hover{background:var(--panel3);color:var(--text)}
.zoom-pill .zv{min-width:46px;text-align:center;font-size:12px;color:var(--text)}
.panel-toggle{display:none;position:absolute;top:12px;right:12px;z-index:25;background:rgba(19,19,21,.94);border:1px solid var(--border2);color:var(--text);height:36px;padding:0 14px;font-size:12px;border-radius:3px}
.save-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(8px);z-index:20;background:rgba(19,19,21,.94);border:1px solid var(--border2);color:var(--muted);font-size:11.5px;padding:7px 14px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.save-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#installCard{display:none;position:absolute;right:14px;bottom:14px;z-index:24;width:302px;max-width:calc(100vw - 110px);background:var(--accent);color:#fff;padding:14px 15px 13px;border-radius:3px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
#installCard .ic-title{font-size:14.5px;font-weight:800;margin-bottom:5px}
#installCard .ic-text{font-size:12px;line-height:1.65;opacity:.94}
#installCard .ic-row{display:flex;gap:8px;margin-top:11px;align-items:center}
#installCardBtn{background:#fff;color:var(--accent-d);font-weight:800;font-size:13px;padding:9px 16px;border-radius:2px;flex:1}
#installCardBtn:hover{background:#eaf5ff}
#installCardClose{background:transparent;color:#fff;font-size:17px;line-height:1;padding:5px 7px;opacity:.85}
#installCardClose:hover{opacity:1}
#dropHint{display:none;position:absolute;inset:14px;z-index:26;border:2px dashed var(--accent);background:rgba(13,153,255,.10);color:#bfe3ff;font-size:16px;font-weight:700;align-items:center;justify-content:center;pointer-events:none;border-radius:3px}
/* ===== 右サイドバー ===== */
.side{width:290px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:30;min-height:0}
.side-scroll{flex:1;overflow-y:auto;min-height:0}
.side-scroll::-webkit-scrollbar{width:9px}
.side-scroll::-webkit-scrollbar-thumb{background:#2c2c32;border-radius:5px}
.sec{padding:13px 14px 15px;border-bottom:1px solid var(--border)}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.09em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.label{width:64px;flex-shrink:0;font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{flex:1;min-width:0;height:31px;padding:0 8px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;font-size:12.5px;outline:none}
textarea{height:auto;padding:7px 8px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{width:40px;height:31px;padding:2px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;cursor:pointer;flex-shrink:0}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.num{width:58px;flex:none;height:31px;padding:0 6px;background:var(--panel2);border:1px solid var(--border2);border-radius:2px;font-size:12px;outline:none}
.num:focus{border-color:var(--accent)}
.btn{height:31px;padding:0 11px;background:var(--panel3);border:1px solid var(--border2);border-radius:2px;font-size:12px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:#4a4a54;background:#2a2a2f}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-grid .btn{width:100%}
.btn-row{display:flex;gap:6px}
.btn-row .btn{flex:1}
.gradient-preview{height:26px;border:1px solid var(--border2);border-radius:2px;margin-bottom:8px}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
.lock-note{background:#2b2113;border:1px solid #57451d;color:#f0c56b;font-size:11.5px;padding:8px 10px;border-radius:2px;line-height:1.6}
/* レイヤー */
.layers-sec{display:flex;flex-direction:column;max-height:46%}
.layer-list{overflow-y:auto;min-height:60px}
.layer-list::-webkit-scrollbar{width:9px}
.layer-list::-webkit-scrollbar-thumb{background:#2c2c32;border-radius:5px}
.layer-item{display:flex;align-items:center;gap:3px;padding:5px 6px;border-left:3px solid transparent;cursor:pointer;user-select:none}
.layer-item:hover{background:var(--panel2)}
.layer-item.active{background:rgba(13,153,255,.13);border-left-color:var(--accent)}
.layer-item .lname{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 4px}
.layer-item .lname-input{flex:1;min-width:0;height:26px;padding:0 6px;background:var(--panel2);border:1px solid var(--accent);border-radius:2px;font-size:12.5px;outline:none}
.lbtn{width:25px;height:25px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);border-radius:2px}
.lbtn:hover{background:var(--panel3);color:var(--text)}
.lbtn.off{color:#55555e}
.lbtn.del:hover{background:#3a1d1d;color:var(--danger)}
.layer-empty{font-size:11.5px;color:var(--muted);padding:8px 4px;line-height:1.7}
/* 図形ピッカー */
.shape-picker{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border2);border-radius:3px;box-shadow:0 14px 38px rgba(0,0,0,.6);padding:8px;display:none;grid-template-columns:repeat(3,64px);gap:5px}
.shape-picker button{height:52px;background:var(--panel2);border:1px solid var(--border);border-radius:2px;font-size:19px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.shape-picker button span{font-size:9.5px;color:var(--muted)}
.shape-picker button:hover{border-color:var(--accent);color:var(--accent)}
/* 右クリックメニュー */
.context-menu{position:fixed;z-index:300;background:#1c1c1f;border:1px solid #3a3a41;border-radius:3px;box-shadow:0 14px 38px rgba(0,0,0,.65);padding:5px;display:none;min-width:216px}
.context-menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;font-size:12.5px;color:var(--text);border-radius:2px;text-align:left}
.context-menu button:hover:not(:disabled){background:var(--accent);color:#fff}
.context-menu button:disabled{opacity:.35;cursor:default}
.context-menu button .sc{margin-left:auto;font-size:10.5px;color:var(--muted)}
.context-menu button:hover .sc{color:rgba(255,255,255,.75)}
.context-menu .sep{height:1px;background:#33333a;margin:5px 4px}
.context-menu .danger{color:#ff8080}
.context-menu .danger:hover{background:#a02c2c;color:#fff}
/* モーダル */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:400;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:3px;width:100%;max-width:400px;padding:20px;box-shadow:0 22px 55px rgba(0,0,0,.6)}
.modal h2{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
@media (max-width:900px){
  .side{position:fixed;top:0;right:0;bottom:0;transform:translateX(105%);transition:transform .25s;box-shadow:-14px 0 34px rgba(0,0,0,.5);width:min(300px,86vw)}
  .side.open{transform:translateX(0)}
  .panel-toggle{display:block}
  .zoom-pill{left:10px;bottom:10px}
  #installCard{right:10px;bottom:52px}
}
</style>
</head>
<body>
<div class="app">
  <!-- 左レール -->
  <nav class="rail">
    <div class="rail-brand">★</div>
    <button class="rail-btn active" data-tool="select" onclick="setTool('select')"><span class="ic">↖</span><span class="lb">選択</span></button>
    <button class="rail-btn" data-tool="text" onclick="quickAddText()"><span class="ic">T</span><span class="lb">文字</span></button>
    <button class="rail-btn" data-tool="shape" id="shapeToolBtn" onclick="toggleShapePicker(event)"><span class="ic">◆</span><span class="lb">図形</span></button>
    <button class="rail-btn" data-tool="image" onclick="pickImage()"><span class="ic">▦</span><span class="lb">画像</span></button>
    <button class="rail-btn" data-tool="pen" onclick="setTool('pen')"><span class="ic">✎</span><span class="lb">ペン</span></button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="undoBtn" onclick="undo()"><span class="ic">↶</span><span class="lb">戻す</span></button>
    <button class="rail-btn" id="redoBtn" onclick="redo()"><span class="ic">↷</span><span class="lb">進む</span></button>
    <button class="rail-btn" onclick="duplicateObject()"><span class="ic">⧉</span><span class="lb">複製</span></button>
    <button class="rail-btn danger" onclick="deleteObject()"><span class="ic">✕</span><span class="lb">削除</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="installBtn" style="display:none" onclick="installApp()"><span class="ic">⬇</span><span class="lb">アプリ版</span></button>
    <button class="rail-btn" onclick="newProject()"><span class="ic">＋</span><span class="lb">新規</span></button>
    <button class="rail-btn primary" onclick="openExport()"><span class="ic">↓</span><span class="lb">PNG出力</span></button>
  </nav>

  <!-- ワークスペース -->
  <div class="workspace" id="canvasArea">
    <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div>
    <div class="zoom-pill">
      <button onclick="fitZoom()" title="全体表示">全体表示</button>
      <button onclick="changeZoom(-0.1)" title="縮小">−</button>
      <span class="zv" id="zoomValue">100%</span>
      <button onclick="changeZoom(0.1)" title="拡大">＋</button>
    </div>
    <button class="panel-toggle" id="panelToggle" onclick="togglePanel()">パネル</button>
    <div class="save-toast" id="saveToast">自動保存しました</div>
    <div id="installCard">
      <div class="ic-title">アプリ版がおすすめ！</div>
      <div class="ic-text">インストールすると全画面で広々使えて、ネットがなくても開けます。作品は自動保存されるので、続きからすぐ再開できます。</div>
      <div class="ic-row">
        <button id="installCardBtn" onclick="installApp()">今すぐインストール</button>
        <button id="installCardClose" onclick="dismissInstallCard()" title="閉じる">×</button>
      </div>
    </div>
    <div id="dropHint">画像をドロップして追加</div>
  </div>

  <!-- 右サイドバー -->
  <aside class="side" id="rightbar">
    <div class="side-scroll">
      <div class="sec">
        <div class="sec-title">キャンバス</div>
        <div class="row"><span class="label">背景色</span><input type="color" id="canvasBg" value="#ffffff" onchange="setCanvasBg(this.value)"><span class="hint">アートボードの色</span></div>
        <div class="row"><span class="label">サイズ</span><input type="number" class="num" id="canvasW" value="1200" min="100" max="4000" style="flex:1"><span style="color:var(--muted);font-size:12px">×</span><input type="number" class="num" id="canvasH" value="800" min="100" max="4000" style="flex:1"><button class="btn" onclick="applyCanvasSize()">適用</button></div>
      </div>
      <div class="sec" id="properties"></div>
    </div>
    <div class="sec layers-sec" style="border-bottom:none">
      <div class="sec-title"><span>レイヤー</span><span class="hint" style="letter-spacing:0">上が前面 ／ ドラッグで移動</span></div>
      <div class="layer-list" id="layerList"></div>
    </div>
  </aside>
</div>

<!-- 図形ピッカー -->
<div class="shape-picker" id="shapePicker">
  <button onclick="pickShape('rect')">■<span>四角</span></button>
  <button onclick="pickShape('circle')">●<span>丸</span></button>
  <button onclick="pickShape('triangle')">▲<span>三角</span></button>
  <button onclick="pickShape('star')">★<span>星</span></button>
  <button onclick="pickShape('line')">―<span>線</span></button>
</div>

<!-- 右クリックメニュー -->
<div class="context-menu" id="contextMenu">
  <button data-act="copy">コピー<span class="sc">Ctrl+C</span></button>
  <button data-act="paste">貼り付け<span class="sc">Ctrl+V</span></button>
  <button data-act="duplicate">複製<span class="sc">Ctrl+D</span></button>
  <button data-act="rename">名前を変更</button>
  <div class="sep"></div>
  <button data-act="front">最前面へ</button>
  <button data-act="back">最背面へ</button>
  <button data-act="lock">ロック / 解除</button>
  <div class="sep"></div>
  <button data-act="delete" class="danger">削除<span class="sc">Delete</span></button>
</div>

<!-- PNG書き出しモーダル -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>PNGで書き出し</h2>
    <p>ロゴを画像として保存します。倍率を上げると大きな画像になります。</p>
    <div class="row"><span class="label">倍率</span>
      <select id="exportScale">
        <option value="1">1倍（そのまま）</option>
        <option value="2" selected>2倍</option>
        <option value="3">3倍</option>
        <option value="4">4倍</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="transparentBg">背景を透明にする</label>
    <div class="actions">
      <button class="btn" onclick="closeExport()">キャンセル</button>
      <button class="btn primary" onclick="downloadPNG()">ダウンロード</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<script>
const canvas = new fabric.Canvas("canvas", { preserveObjectStacking: true, backgroundColor: "#ffffff", selectionColor: "rgba(13,153,255,0.12)", selectionBorderColor: "#0d99ff", selectionLineWidth: 1 });
fabric.Object.prototype.set({ transparentCorners: false, cornerColor: "#ffffff", cornerStrokeColor: "#0d99ff", cornerSize: 9, cornerStyle: "rect", borderColor: "#0d99ff", borderScaleFactor: 1.4, padding: 0 });
fabric.Object.prototype.customType = "";
let canvasWidth = 1200, canvasHeight = 800;
canvas.setWidth(canvasWidth); canvas.setHeight(canvasHeight);
let currentTool = "select", currentShape = "rect", clipboard = null, copiedStyleSource = null;
let history = [], historyIndex = -1, isLoadingHistory = false, zoom = 1;
let gradientMode = "vertical";
let layerDragObj = null, renamingObj = null;
const FONT_OPTIONS = ["Noto Sans JP","M PLUS 1p","Noto Serif JP","Shippori Mincho","Kosugi Maru","Zen Maru Gothic","Kaisei Decol","Hina Mincho","Yuji Syuku","DotGothic16","Kiwi Maru","Mochiy Pop One","Stick","Train One","Arial","Georgia","Monospace","sans-serif","serif"];
function fontOptionsHTML(selected){return FONT_OPTIONS.map(f=>`<option value="${f}" ${f===selected?"selected":""} style="font-family:'${f}'">${f}</option>`).join("")}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
/* ========= ツール ========= */
function setTool(tool){
  currentTool = tool;
  document.querySelectorAll(".rail-btn[data-tool]").forEach(b=>b.classList.toggle("active", b.dataset.tool===tool));
  hideShapePicker();
  if(tool==="pen"){
    canvas.isDrawingMode = true;
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.width = 5; canvas.freeDrawingBrush.color = "#111111";
  } else {
    canvas.isDrawingMode = false;
  }
  updateProperties();
}
function togglePanel(){document.getElementById("rightbar").classList.toggle("open")}
function toggleShapePicker(e){
  if(e)e.stopPropagation();
  const picker = document.getElementById("shapePicker");
  if(picker.style.display==="grid"){hideShapePicker();return}
  const btn = document.getElementById("shapeToolBtn"), r = btn.getBoundingClientRect();
  picker.style.display = "grid";
  picker.style.left = (r.right + 10) + "px";
  picker.style.top = Math.max(8, r.top - 4) + "px";
}
function hideShapePicker(){document.getElementById("shapePicker").style.display = "none"}
document.addEventListener("pointerdown", e=>{
  const picker = document.getElementById("shapePicker");
  if(picker.style.display==="grid" && !picker.contains(e.target) && e.target.id!=="shapeToolBtn" && !document.getElementById("shapeToolBtn").contains(e.target)) hideShapePicker();
});
function pickShape(type){currentShape=type;hideShapePicker();addShapeAt(canvasWidth/2,canvasHeight/2,type);setTool("select")}
function addShapeAt(x,y,type){if(type==="rect")addRect(x,y);else if(type==="circle")addCircle(x,y);else if(type==="triangle")addTriangle(x,y);else if(type==="star")addStar(x,y);else if(type==="line")addLine(x,y)}
canvas.on("mouse:down", function(opt){
  if(currentTool==="text"){const p=canvas.getPointer(opt.e);addText(p.x,p.y);setTool("select");return}
  if(currentTool==="shape"){const p=canvas.getPointer(opt.e);addShapeAt(p.x,p.y,currentShape);setTool("select");return}
});
document.getElementById("canvasArea").addEventListener("click", function(e){
  if(e.target.id==="canvasArea") canvas.discardActiveObject().renderAll();
});
/* ========= 追加 ========= */
function finishAdd(obj){obj.customType = obj.customType || obj.type;canvas.add(obj);canvas.setActiveObject(obj);canvas.renderAll();saveHistory();updateUI()}
function quickAddText(){addText(canvasWidth/2, canvasHeight/2); setTool("select")}
function addText(x,y){
  const t = new fabric.IText("テキスト", { left:x, top:y, originX:"center", originY:"center", fontFamily:"Noto Sans JP", fontSize:64, fontWeight:800, fill:"#111111" });
  t.customType = "text"; finishAdd(t);
  setTimeout(()=>{ try{ t.enterEditing(); t.selectAll(); }catch(e){} }, 60);
}
function addRect(x,y){const o=new fabric.Rect({left:x,top:y,originX:"center",originY:"center",width:220,height:150,fill:"#0d99ff"});o.customType="rect";finishAdd(o)}
function addCircle(x,y){const o=new fabric.Circle({left:x,top:y,originX:"center",originY:"center",radius:90,fill:"#ff5a76"});o.customType="circle";finishAdd(o)}
function addTriangle(x,y){const o=new fabric.Triangle({left:x,top:y,originX:"center",originY:"center",width:190,height:170,fill:"#ffb020"});o.customType="triangle";finishAdd(o)}
function starPoints(cx,cy,spikes,outer,inner){const pts=[];let rot=Math.PI/2*3;const step=Math.PI/spikes;let px=cx,py=cy-outer;pts.push(new fabric.Point(px,py));for(let i=0;i<spikes;i++){px=cx+Math.cos(rot)*outer;py=cy+Math.sin(rot)*outer;pts.push(new fabric.Point(px,py));rot+=step;px=cx+Math.cos(rot)*inner;py=cy+Math.sin(rot)*inner;pts.push(new fabric.Point(px,py));rot+=step}pts.push(new fabric.Point(cx,cy-outer));return pts}
function addStar(x,y){const o=new fabric.Polygon(starPoints(0,0,5,100,44),{left:x,top:y,originX:"center",originY:"center",fill:"#7c5cff"});o.customType="star";finishAdd(o)}
function addLine(x,y){const o=new fabric.Line([x-110,y,x+110,y],{stroke:"#111111",strokeWidth:7,originX:"center",originY:"center"});o.customType="line";finishAdd(o)}
function pickImage(){document.getElementById("fileInput").click()}
function loadImageFile(file, cx, cy){
  if(!file || !file.type || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const MAX = 1600; let w = img.width, h = img.height;
      if(Math.max(w,h) > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
      const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
      tmp.getContext("2d").drawImage(img, 0, 0, w, h);
      fabric.Image.fromURL(tmp.toDataURL("image/png"), function(fimg){
        const maxSide = 460, scale = Math.min(1, maxSide/Math.max(fimg.width, fimg.height));
        fimg.set({ left: cx||canvasWidth/2, top: cy||canvasHeight/2, originX:"center", originY:"center", scaleX: scale, scaleY: scale });
        fimg.customType = "image"; finishAdd(fimg);
      });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
document.getElementById("fileInput").addEventListener("change", function(){ loadImageFile(this.files[0]); this.value=""; });
/* ========= プロパティパネル ========= */
function getActive(){return canvas.getActiveObject()}
function isTextObj(o){return o && (o.type==="i-text" || o.type==="text" || o.customType==="text")}
function isShapeObj(o){return o && !isTextObj(o) && o.type!=="image" && o.type!=="path" && o.type!=="group" && o.type!=="activeSelection"}
function fillValue(o){if(!o) return "#000000"; if(typeof o.fill==="string") return o.fill; if(o.fill && o.fill.colorStops && o.fill.colorStops[0]) return o.fill.colorStops[0].color; return "#000000"}
function updateUI(){updateProperties();updateLayers();updateUndoBtns()}
function updateProperties(){
  const area = document.getElementById("properties");
  const obj = getActive();
  if(currentTool==="pen" && !obj){ area.innerHTML = penPanel(); return; }
  if(!obj){
    area.innerHTML = `<div class="sec-title">追加する</div>
    <div class="btn-grid">
      <button class="btn" onclick="quickAddText()">＋ 文字</button>
      <button class="btn" onclick="document.getElementById('shapeToolBtn').click()">＋ 図形</button>
      <button class="btn" onclick="pickImage()">＋ 画像</button>
      <button class="btn" onclick="setTool('pen')">✎ ペンで描く</button>
    </div>
    <p class="hint" style="margin:10px 0 0">オブジェクトを選択すると、ここで色・大きさ・位置を編集できます。右クリックでも操作できます。</p>`;
    return;
  }
  let html = "";
  if(obj.lockMovementX) html += `<div class="lock-note" style="margin-bottom:10px">このオブジェクトはロック中です。レイヤーの鍵ボタン、または右クリックから解除できます。</div>`;
  if(isTextObj(obj)) html += textPanel(obj);
  else if(obj.type==="image") html += imagePanel(obj);
  else if(isShapeObj(obj)) html += shapePanel(obj);
  else html += `<div class="sec-title">プロパティ</div><p class="hint">このオブジェクトは共通設定のみ編集できます。</p>`;
  html += commonPanel(obj);
  area.innerHTML = html;
}
function penPanel(){
  return `<div class="sec-title">ペン</div>
  <div class="row"><span class="label">太さ</span><input type="range" min="1" max="60" value="${canvas.freeDrawingBrush?canvas.freeDrawingBrush.width:5}" oninput="setPenWidth(this.value)"><input class="num" type="number" value="${canvas.freeDrawingBrush?canvas.freeDrawingBrush.width:5}" onchange="setPenWidth(this.value)"></div>
  <div class="row"><span class="label">色</span><input type="color" value="${canvas.freeDrawingBrush?canvas.freeDrawingBrush.color:'#111111'}" onchange="setPenColor(this.value)"></div>
  <p class="hint">キャンバス上をドラッグすると線を描けます。描いた線はあとから選択して移動・削除できます。</p>`;
}
function setPenWidth(v){if(canvas.freeDrawingBrush)canvas.freeDrawingBrush.width=Number(v);updateProperties()}
function setPenColor(v){if(canvas.freeDrawingBrush)canvas.freeDrawingBrush.color=v}
function textPanel(o){
  return `<div class="sec-title">文字</div>
  <div class="row"><textarea rows="2" onchange="setTextContent(this.value)">${esc(o.text||"")}</textarea></div>
  <div class="row"><span class="label">フォント</span><select onchange="setFont(this.value)">${fontOptionsHTML(o.fontFamily||"Noto Sans JP")}</select></div>
  <div class="row"><span class="label">サイズ</span><input type="range" min="10" max="240" value="${Math.round(o.fontSize||48)}" oninput="setFontSize(this.value)"><input class="num" type="number" value="${Math.round(o.fontSize||48)}" onchange="setFontSize(this.value)"></div>
  <div class="row"><span class="label">字間</span><input type="range" min="-50" max="300" value="${o.charSpacing||0}" oninput="setCharSpacing(this.value)"><input class="num" type="number" value="${o.charSpacing||0}" onchange="setCharSpacing(this.value)"></div>
  <div class="row"><span class="label">行間</span><input type="range" min="0.6" max="2.5" step="0.05" value="${o.lineHeight||1.1}" oninput="setLineHeight(this.value)"><input class="num" type="number" step="0.05" value="${o.lineHeight||1.1}" onchange="setLineHeight(this.value)"></div>
  <div class="row"><span class="label">スタイル</span><div class="btn-row" style="flex:1">
    <button class="btn ${o.fontWeight==="bold"||Number(o.fontWeight)>=700?"on":""}" onclick="toggleBold()">太字</button>
    <button class="btn ${o.fontStyle==="italic"?"on":""}" onclick="toggleItalic()">斜体</button>
    <button class="btn ${o.underline?"on":""}" onclick="toggleUnderline()">下線</button>
  </div></div>
  ${fillPanel(o)}`;
}
function shapePanel(o){
  return `<div class="sec-title">図形</div>
  ${fillPanel(o)}
  <div class="row"><span class="label">枠線の色</span><input type="color" value="${typeof o.stroke==='string'?o.stroke:'#000000'}" onchange="setStrokeColor(this.value)"></div>
  <div class="row"><span class="label">枠線の太さ</span><input type="range" min="0" max="40" value="${o.strokeWidth||0}" oninput="setStrokeWidth(this.value)"><input class="num" type="number" value="${o.strokeWidth||0}" onchange="setStrokeWidth(this.value)"></div>`;
}
function imagePanel(o){
  return `<div class="sec-title">画像</div>
  <div class="row"><span class="label">角丸</span><input type="range" min="0" max="200" value="${o.rx||0}" oninput="setImageRadius(this.value)"><input class="num" type="number" value="${Math.round(o.rx||0)}" onchange="setImageRadius(this.value)"></div>
  <div class="row"><span class="label">枠線の色</span><input type="color" value="${typeof o.stroke==='string'?o.stroke:'#000000'}" onchange="setStrokeColor(this.value)"></div>
  <div class="row"><span class="label">枠線の太さ</span><input type="range" min="0" max="40" value="${o.strokeWidth||0}" oninput="setStrokeWidth(this.value)"><input class="num" type="number" value="${o.strokeWidth||0}" onchange="setStrokeWidth(this.value)"></div>`;
}
function fillPanel(o){
  const isGrad = o.fill && typeof o.fill==="object";
  let gradColors = ["#ff5a76","#ffb020"];
  if(isGrad && o.fill.colorStops && o.fill.colorStops.length>=2) gradColors = [o.fill.colorStops[0].color, o.fill.colorStops[1].color];
  let html = `<div class="row"><span class="label">塗り</span><div class="btn-row" style="flex:1">
    <button class="btn ${!isGrad?"on":""}" onclick="setFillMode('solid')">単色</button>
    <button class="btn ${isGrad?"on":""}" onclick="setFillMode('gradient')">グラデ</button>
  </div></div>`;
  if(!isGrad){
    html += `<div class="row"><span class="label">色</span><input type="color" value="${fillValue(o)}" onchange="setFill(this.value)"></div>`;
  } else {
    const preview = `background:linear-gradient(${gradientMode==="radial"?"circle":"to right"},${gradColors[0]},${gradColors[1]})`;
    html += `<div class="gradient-preview" style="${preview}"></div>
    <div class="row"><span class="label">色 1</span><input type="color" value="${gradColors[0]}" onchange="setGradientColor(0,this.value)"><span class="label" style="width:auto">色 2</span><input type="color" value="${gradColors[1]}" onchange="setGradientColor(1,this.value)"></div>
    <div class="row"><span class="label">向き</span><div class="btn-row" style="flex:1">
      <button class="btn ${gradientMode==="vertical"?"on":""}" onclick="setGradientMode('vertical')">縦</button>
      <button class="btn ${gradientMode==="horizontal"?"on":""}" onclick="setGradientMode('horizontal')">横</button>
      <button class="btn ${gradientMode==="radial"?"on":""}" onclick="setGradientMode('radial')">円</button>
    </div></div>`;
  }
  return html;
}
function shadowPanel(o){
  const sh = o.shadow;
  const color = sh ? sh.color : "#000000";
  const blur = sh ? sh.blur : 0;
  const off = sh ? sh.offsetX : 0;
  return `<div class="sec-title" style="margin-top:14px">影</div>
  <div class="row"><span class="label">色</span><input type="color" value="${color}" onchange="setShadow()"></div>
  <div class="row"><span class="label">ぼかし</span><input type="range" min="0" max="60" value="${blur}" oninput="setShadowLive()" onchange="setShadow()"></div>
  <div class="row"><span class="label">ずれ</span><input type="range" min="-40" max="40" value="${off}" oninput="setShadowLive()" onchange="setShadow()"></div>`;
}
function commonPanel(o){
  return `${shadowPanel(o)}
  <div class="sec-title" style="margin-top:14px">配置</div>
  <div class="row"><span class="label">位置 X / Y</span><input class="num" type="number" value="${Math.round(o.left||0)}" onchange="setPos('left',this.value)" style="flex:1"><input class="num" type="number" value="${Math.round(o.top||0)}" onchange="setPos('top',this.value)" style="flex:1"></div>
  <div class="row"><span class="label">回転</span><input type="range" min="0" max="360" value="${Math.round(o.angle||0)}" oninput="setAngle(this.value)"><input class="num" type="number" value="${Math.round(o.angle||0)}" onchange="setAngle(this.value)"></div>
  <div class="row"><span class="label">透明度</span><input type="range" min="5" max="100" value="${Math.round((o.opacity==null?1:o.opacity)*100)}" oninput="setOpacity(this.value)"><input class="num" type="number" value="${Math.round((o.opacity==null?1:o.opacity)*100)}" onchange="setOpacity(this.value)"></div>
  <div class="btn-grid" style="margin-bottom:6px">
    <button class="btn" onclick="alignObj('left')">左揃え</button>
    <button class="btn" onclick="alignObj('center')">中央揃え</button>
    <button class="btn" onclick="alignObj('right')">右揃え</button>
    <button class="btn" onclick="alignObj('middle')">上下中央</button>
    <button class="btn" onclick="bringFront()">最前面へ</button>
    <button class="btn" onclick="sendBack()">最背面へ</button>
    <button class="btn" onclick="flipObj('flipX')">左右反転</button>
    <button class="btn" onclick="flipObj('flipY')">上下反転</button>
  </div>`;
}
/* ========= プロパティ変更 ========= */
function refresh(o){o.setCoords();canvas.renderAll()}
function setTextContent(v){const o=getActive();if(!o)return;o.set("text",v);refresh(o);saveHistory();updateLayers()}
function setFont(v){const o=getActive();if(!o)return;o.set("fontFamily",v);refresh(o);saveHistory();updateProperties()}
function setFontSize(v){const o=getActive();if(!o)return;o.set("fontSize",Number(v));refresh(o);saveHistory()}
function setCharSpacing(v){const o=getActive();if(!o)return;o.set("charSpacing",Number(v));refresh(o);saveHistory()}
function setLineHeight(v){const o=getActive();if(!o)return;o.set("lineHeight",Number(v));refresh(o);saveHistory()}
function toggleBold(){const o=getActive();if(!o)return;const bold=o.fontWeight==="bold"||Number(o.fontWeight)>=700;o.set("fontWeight",bold?"normal":"bold");refresh(o);saveHistory();updateProperties()}
function toggleItalic(){const o=getActive();if(!o)return;o.set("fontStyle",o.fontStyle==="italic"?"normal":"italic");refresh(o);saveHistory();updateProperties()}
function toggleUnderline(){const o=getActive();if(!o)return;o.set("underline",!o.underline);refresh(o);saveHistory();updateProperties()}
function setFill(v){const o=getActive();if(!o)return;o.set("fill",v);refresh(o);saveHistory()}
function setFillMode(mode){
  const o=getActive();if(!o)return;
  if(mode==="solid"){ o.set("fill", fillValue(o)); }
  else { applyGradient(o, [fillValue(o), "#ffb020"]); }
  refresh(o); saveHistory(); updateProperties();
}
function applyGradient(o, colors){
  const w = Math.max(1,(o.width||100)*(o.scaleX||1)), h = Math.max(1,(o.height||100)*(o.scaleY||1));
  let grad;
  if(gradientMode==="radial") grad = new fabric.Gradient({type:"radial",gradientUnits:"pixels",coords:{x1:w/2,y1:h/2,r1:10,x2:w/2,y2:h/2,r2:Math.max(w,h)/1.4},colorStops:[{offset:0,color:colors[0]},{offset:1,color:colors[1]}]});
  else if(gradientMode==="horizontal") grad = new fabric.Gradient({type:"linear",gradientUnits:"pixels",coords:{x1:0,y1:0,x2:w,y2:0},colorStops:[{offset:0,color:colors[0]},{offset:1,color:colors[1]}]});
  else grad = new fabric.Gradient({type:"linear",gradientUnits:"pixels",coords:{x1:0,y1:0,x2:0,y2:h},colorStops:[{offset:0,color:colors[0]},{offset:1,color:colors[1]}]});
  o.set("fill", grad);
}
function currentGradColors(o){ if(o.fill && o.fill.colorStops && o.fill.colorStops.length>=2) return [o.fill.colorStops[0].color, o.fill.colorStops[1].color]; return [fillValue(o),"#ffb020"]; }
function setGradientColor(idx, v){const o=getActive();if(!o)return;const c=currentGradColors(o);c[idx]=v;applyGradient(o,c);refresh(o);saveHistory();updateProperties()}
function setGradientMode(m){gradientMode=m;const o=getActive();if(!o)return;applyGradient(o,currentGradColors(o));refresh(o);saveHistory();updateProperties()}
function setStrokeColor(v){const o=getActive();if(!o)return;o.set("stroke",v);if(!o.strokeWidth)o.set("strokeWidth",1);refresh(o);saveHistory();updateProperties()}
function setStrokeWidth(v){const o=getActive();if(!o)return;o.set("strokeWidth",Number(v));refresh(o);saveHistory()}
function setImageRadius(v){const o=getActive();if(!o)return;o.set("rx",Number(v));o.set("ry",Number(v));refresh(o);saveHistory()}
function setOpacity(v){const o=getActive();if(!o)return;o.set("opacity",Number(v)/100);refresh(o);saveHistory()}
function setAngle(v){const o=getActive();if(!o)return;o.set("angle",Number(v));refresh(o);saveHistory()}
function setPos(prop,v){const o=getActive();if(!o)return;o.set(prop,Number(v)||0);refresh(o);saveHistory()}
function flipObj(prop){const o=getActive();if(!o)return;o.set(prop,!o[prop]);refresh(o);saveHistory()}
function shadowControls(){
  const titles=[...document.querySelectorAll("#properties .sec-title")];
  const t=titles.find(el=>el.textContent.trim()==="影");
  if(!t) return null;
  const rows=[]; let el=t.nextElementSibling;
  while(el && !el.classList.contains("sec-title") && rows.length<3){ rows.push(el); el=el.nextElementSibling; }
  if(rows.length<3) return null;
  return { color: rows[0].querySelector("input"), blur: rows[1].querySelector("input"), off: rows[2].querySelector("input") };
}
function applyShadowFromPanel(withHistory){
  const o=getActive(); if(!o) return;
  const c=shadowControls(); if(!c) return;
  o.set("shadow", new fabric.Shadow({ color:c.color.value, blur:Number(c.blur.value), offsetX:Number(c.off.value), offsetY:Number(c.off.value) }));
  refresh(o); if(withHistory) saveHistory();
}
function setShadow(){applyShadowFromPanel(true)}
function setShadowLive(){applyShadowFromPanel(false)}
function alignObj(mode){
  const o=getActive(); if(!o) return;
  const r=o.getBoundingRect();
  if(mode==="left") o.left += (0 - r.left);
  else if(mode==="center") o.left += (canvasWidth/2 - (r.left + r.width/2));
  else if(mode==="right") o.left += (canvasWidth - (r.left + r.width));
  else if(mode==="middle") o.top += (canvasHeight/2 - (r.top + r.height/2));
  refresh(o); saveHistory(); updateProperties();
}
function bringFront(){const o=getActive();if(!o)return;canvas.bringToFront(o);canvas.renderAll();saveHistory();updateLayers()}
function sendBack(){const o=getActive();if(!o)return;canvas.sendToBack(o);canvas.renderAll();saveHistory();updateLayers()}
/* ========= レイヤー ========= */
const ICONS = {
  eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>',
  lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  unlock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 7.7-2.3"/></svg>',
  trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2m-8 0l1 13h8l1-13"/></svg>'
};
function getObjectLabel(o){
  if(o.customName) return o.customName;
  if(isTextObj(o)) return (o.text||"テキスト").split("\n")[0].slice(0,14) || "テキスト";
  switch(o.customType){
    case "image": return "画像"; case "rect": return "四角"; case "circle": return "丸";
    case "triangle": return "三角"; case "star": return "星"; case "line": return "線";
    case "path": return "ペンの線"; default: return o.type==="group" ? "グループ" : "オブジェクト";
  }
}
function updateLayers(){
  const list = document.getElementById("layerList");
  list.innerHTML = "";
  const objs = canvas.getObjects();
  if(!objs.length){ list.innerHTML = '<div class="layer-empty">まだ何もありません。左のツールから文字や図形を追加できます。</div>'; return; }
  const active = getActive();
  [...objs].reverse().forEach(obj=>{
    const item = document.createElement("div");
    item.className = "layer-item" + (obj===active ? " active" : "");
    const editing = obj===renamingObj;
    item.draggable = !editing;
    const eye = document.createElement("button");
    eye.className = "lbtn" + (obj.visible===false ? " off" : "");
    eye.innerHTML = obj.visible===false ? ICONS.eyeOff : ICONS.eye;
    eye.title = obj.visible===false ? "表示する" : "隠す";
    eye.onclick = e=>{ e.stopPropagation(); toggleVisible(obj); };
    item.appendChild(eye);
    const lock = document.createElement("button");
    lock.className = "lbtn" + (obj.lockMovementX ? "" : " off");
    lock.innerHTML = obj.lockMovementX ? ICONS.lock : ICONS.unlock;
    lock.title = obj.lockMovementX ? "ロックを解除" : "ロックする";
    lock.onclick = e=>{ e.stopPropagation(); toggleLock(obj); };
    item.appendChild(lock);
    if(editing){
      const inp = document.createElement("input");
      inp.className = "lname-input"; inp.type = "text";
      inp.value = obj.customName || getObjectLabel(obj);
      inp.onclick = e=>e.stopPropagation();
      inp.onkeydown = e=>{ if(e.key==="Enter") commitRename(inp); if(e.key==="Escape"){ renamingObj=null; updateLayers(); } };
      inp.onblur = ()=>{ if(renamingObj===obj) commitRename(inp); };
      item.appendChild(inp);
    } else {
      const name = document.createElement("span");
      name.className = "lname"; name.textContent = getObjectLabel(obj);
      name.title = getObjectLabel(obj) + "（ダブルクリックで名前を変更）";
      name.ondblclick = e=>{ e.stopPropagation(); startRename(obj); };
      item.appendChild(name);
    }
    const del = document.createElement("button");
    del.className = "lbtn del"; del.innerHTML = ICONS.trash; del.title = "削除";
    del.onclick = e=>{ e.stopPropagation(); deleteLayerObj(obj); };
    item.appendChild(del);
    item.onclick = ()=>{ if(obj.visible!==false){ canvas.setActiveObject(obj); canvas.requestRenderAll(); updateUI(); } };
    item.addEventListener("dragstart", ()=>{ layerDragObj = obj; });
    item.addEventListener("dragover", e=>e.preventDefault());
    item.addEventListener("drop", e=>{
      e.preventDefault();
      if(layerDragObj && layerDragObj!==obj){
        canvas.moveTo(layerDragObj, canvas.getObjects().indexOf(obj));
        canvas.renderAll(); saveHistory(); updateLayers();
      }
      layerDragObj = null;
    });
    list.appendChild(item);
  });
}
function startRename(obj){ renamingObj = obj; updateLayers(); const inp = document.querySelector(".lname-input"); if(inp){ inp.focus(); inp.select(); } }
function commitRename(inp){
  const obj = renamingObj; if(!obj){ renamingObj = null; return; }
  const v = inp.value.trim(); if(v) obj.set("customName", v);
  renamingObj = null; updateLayers(); saveHistory();
}
function toggleVisible(obj){
  obj.visible = obj.visible===false ? true : false;
  if(obj.visible===false && getActive()===obj) canvas.discardActiveObject();
  canvas.renderAll(); saveHistory(); updateLayers(); updateProperties();
}
function toggleLock(obj){
  const on = !obj.lockMovementX;
  obj.set({ lockMovementX:on, lockMovementY:on, lockRotation:on, lockScalingX:on, lockScalingY:on, lockScalingFlip:on, hasControls:!on });
  canvas.renderAll(); saveHistory(); updateLayers(); updateProperties();
}
function deleteLayerObj(obj){
  if(renamingObj===obj) renamingObj = null;
  canvas.remove(obj); canvas.renderAll(); saveHistory(); updateUI();
}
/* ========= 履歴 ========= */
function saveHistory(){
  if(isLoadingHistory) return;
  const json = JSON.stringify(canvas.toJSON(["customType","customName"]));
  history = history.slice(0, historyIndex+1);
  history.push(json);
  if(history.length > 60) history.shift();
  historyIndex = history.length - 1;
  updateUndoBtns(); saveProject();
}
function loadHistory(json){
  isLoadingHistory = true;
  canvas.loadFromJSON(json, function(){
    canvas.getObjects().forEach(o=>{ if(o.lockMovementX) o.hasControls = false; });
    canvas.renderAll(); isLoadingHistory = false; updateUI();
  });
}
function undo(){ if(historyIndex<=0) return; historyIndex--; loadHistory(history[historyIndex]); updateUndoBtns(); }
function redo(){ if(historyIndex>=history.length-1) return; historyIndex++; loadHistory(history[historyIndex]); updateUndoBtns(); }
function updateUndoBtns(){
  const u = document.getElementById("undoBtn"), r = document.getElementById("redoBtn");
  if(u) u.disabled = historyIndex<=0;
  if(r) r.disabled = historyIndex>=history.length-1;
}
/* ========= コピー・複製・削除 ========= */
function copyObject(){ const o=getActive(); if(!o) return; o.clone(function(c){ clipboard=c; copiedStyleSource=o; }, ["customType","customName"]); }
function pasteObject(){
  if(!clipboard) return;
  clipboard.clone(function(c){
    c.set({ left:(c.left||0)+24, top:(c.top||0)+24, evented:true });
    if(c.lockMovementX) c.hasControls = false;
    canvas.add(c); canvas.setActiveObject(c); canvas.renderAll(); saveHistory(); updateUI();
  }, ["customType","customName"]);
}
function duplicateObject(){ copyObject(); setTimeout(pasteObject, 60); }
function deleteObject(){ const o=getActive(); if(!o) return; canvas.remove(o); canvas.discardActiveObject(); canvas.renderAll(); saveHistory(); updateUI(); }
/* ========= ズーム・キャンバス ========= */
function applyZoom(){
  canvas.setZoom(zoom);
  canvas.setDimensions({ width: canvasWidth*zoom, height: canvasHeight*zoom });
  const wrap = document.getElementById("canvasWrap");
  if(wrap){ wrap.style.width = (canvasWidth*zoom)+"px"; wrap.style.height = (canvasHeight*zoom)+"px"; }
  document.getElementById("zoomValue").textContent = Math.round(zoom*100)+"%";
}
function changeZoom(d){ zoom += d; zoom = Math.max(0.1, Math.min(3, zoom)); applyZoom(); }
function fitZoom(){
  const area = document.getElementById("canvasArea"); if(!area) return;
  zoom = Math.max(0.1, Math.min((area.clientWidth-56)/canvasWidth, (area.clientHeight-56)/canvasHeight, 1.5));
  applyZoom();
}
function setCanvasBg(v){ canvas.setBackgroundColor(v, canvas.renderAll.bind(canvas)); saveProject(); }
function applyCanvasSize(){
  const w = Math.max(100, Math.min(4000, Number(document.getElementById("canvasW").value)||1200));
  const h = Math.max(100, Math.min(4000, Number(document.getElementById("canvasH").value)||800));
  canvasWidth = w; canvasHeight = h;
  canvas.setWidth(w); canvas.setHeight(h);
  applyZoom(); saveHistory();
}
/* ========= 書き出し ========= */
function openExport(){ document.getElementById("exportModal").classList.add("open"); }
function closeExport(){ document.getElementById("exportModal").classList.remove("open"); }
document.getElementById("exportModal").addEventListener("click", function(e){ if(e.target===this) closeExport(); });
function downloadPNG(){
  const scale = Number(document.getElementById("exportScale").value)||2;
  const transparent = document.getElementById("transparentBg").checked;
  const oldZoom = zoom;
  canvas.setZoom(1); canvas.setDimensions({ width: canvasWidth, height: canvasHeight });
  canvas.discardActiveObject(); canvas.renderAll();
  const oldBg = canvas.backgroundColor;
  if(transparent) canvas.backgroundColor = null;
  const url = canvas.toDataURL({ format:"png", multiplier: scale });
  canvas.backgroundColor = oldBg;
  zoom = oldZoom; applyZoom(); canvas.renderAll();
  const a = document.createElement("a"); a.href = url; a.download = "logo.png"; a.click();
  closeExport();
}
/* ========= 右クリックメニュー ========= */
const contextMenu = document.getElementById("contextMenu");
let contextTarget = null;
function showContextMenu(x, y){
  const has = !!contextTarget;
  contextMenu.querySelectorAll("button").forEach(b=>{ b.disabled = b.dataset.act==="paste" ? !clipboard : !has; });
  contextMenu.style.display = "block";
  const mw = 230, mh = 330;
  contextMenu.style.left = Math.min(x, window.innerWidth-mw) + "px";
  contextMenu.style.top = Math.min(y, window.innerHeight-mh) + "px";
}
function hideContextMenu(){ contextMenu.style.display = "none"; }
document.getElementById("canvasArea").addEventListener("contextmenu", function(e){
  e.preventDefault();
  let target = null;
  try{ target = canvas.findTarget(e); }catch(err){}
  if(target && target!==canvas){ contextTarget = target; canvas.setActiveObject(target); canvas.renderAll(); updateUI(); }
  else contextTarget = getActive();
  showContextMenu(e.clientX, e.clientY);
});
document.addEventListener("pointerdown", function(e){ if(!contextMenu.contains(e.target)) hideContextMenu(); });
contextMenu.querySelectorAll("button").forEach(b=>{
  b.addEventListener("click", function(){
    const act = b.dataset.act, o = contextTarget;
    hideContextMenu();
    if(act==="paste"){ pasteObject(); return; }
    if(!o) return;
    if(act==="copy"){ canvas.setActiveObject(o); copyObject(); }
    else if(act==="duplicate"){ canvas.setActiveObject(o); duplicateObject(); }
    else if(act==="delete"){ canvas.setActiveObject(o); deleteObject(); }
    else if(act==="front"){ canvas.setActiveObject(o); bringFront(); }
    else if(act==="back"){ canvas.setActiveObject(o); sendBack(); }
    else if(act==="lock"){ toggleLock(o); }
    else if(act==="rename"){ canvas.setActiveObject(o); updateUI(); startRename(o); document.getElementById("rightbar").classList.add("open"); }
  });
});
/* ========= キーボード ========= */
document.addEventListener("keydown", function(e){
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase()==="z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod && (e.key.toLowerCase()==="y" || (e.key.toLowerCase()==="z" && e.shiftKey))){ e.preventDefault(); redo(); }
  else if(mod && e.key.toLowerCase()==="c"){ copyObject(); }
  else if(mod && e.key.toLowerCase()==="v"){ pasteObject(); }
  else if(mod && e.key.toLowerCase()==="d"){ e.preventDefault(); duplicateObject(); }
  else if(mod && e.key.toLowerCase()==="s"){ e.preventDefault(); openExport(); }
  else if(e.key==="Delete" || e.key==="Backspace"){ const o=getActive(); if(o && !o.isEditing){ e.preventDefault(); deleteObject(); } }
});
/* ========= ドラッグ&ドロップ / 貼り付け ========= */
const area = document.getElementById("canvasArea"), dropHint = document.getElementById("dropHint");
area.addEventListener("dragover", function(e){ e.preventDefault(); dropHint.style.display = "flex"; });
area.addEventListener("dragleave", function(e){ if(e.target===area) dropHint.style.display = "none"; });
area.addEventListener("drop", function(e){
  e.preventDefault(); dropHint.style.display = "none";
  const file = e.dataTransfer.files && e.dataTransfer.files[0]; if(!file) return;
  const rect = canvas.upperCanvas.getBoundingClientRect();
  const p = canvas.getPointer({ clientX:e.clientX, clientY:e.clientY, preventDefault:function(){} });
  loadImageFile(file, p.x, p.y);
});
document.addEventListener("paste", function(e){
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){ if(it.type && it.type.startsWith("image/")){ loadImageFile(it.getAsFile()); break; } }
});
/* ========= インストール ========= */
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredInstallPrompt = e;
  document.getElementById("installBtn").style.display = "";
  if(localStorage.getItem("logomaker-card-dismissed")!=="1") document.getElementById("installCard").style.display = "block";
});
function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(function(){
    deferredInstallPrompt = null;
    document.getElementById("installBtn").style.display = "none";
    document.getElementById("installCard").style.display = "none";
  });
}
function dismissInstallCard(){ document.getElementById("installCard").style.display = "none"; localStorage.setItem("logomaker-card-dismissed", "1"); }
window.addEventListener("appinstalled", function(){
  document.getElementById("installCard").style.display = "none";
  document.getElementById("installBtn").style.display = "none";
});
/* ========= 新規・保存・復元 ========= */
function newProject(){
  if(!confirm("今の作品を消して、まっさらな状態から始めますか？")) return;
  isLoadingHistory = true;
  canvas.clear(); canvas.setBackgroundColor("#ffffff", canvas.renderAll.bind(canvas));
  document.getElementById("canvasBg").value = "#ffffff";
  isLoadingHistory = false;
  history = []; historyIndex = -1;
  saveHistory(); updateUI();
}
let toastDelay = null, toastTimer = null;
function showSaveToast(){
  const t = document.getElementById("saveToast");
  clearTimeout(toastDelay);
  toastDelay = setTimeout(()=>{
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 1500);
  }, 700);
}
function saveProject(){
  try{
    localStorage.setItem("logo-maker-autosave-v1", JSON.stringify({
      json: canvas.toJSON(["customType","customName"]),
      width: canvasWidth, height: canvasHeight,
      bg: typeof canvas.backgroundColor==="string" ? canvas.backgroundColor : "#ffffff"
    }));
    if(!isLoadingHistory) showSaveToast();
  }catch(e){}
}
(function restoreProject(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem("logo-maker-autosave-v1")); }catch(e){}
  if(data && data.json){
    isLoadingHistory = true;
    if(data.width){ canvasWidth = data.width; document.getElementById("canvasW").value = data.width; }
    if(data.height){ canvasHeight = data.height; document.getElementById("canvasH").value = data.height; }
    canvas.setWidth(canvasWidth); canvas.setHeight(canvasHeight);
    if(data.bg) document.getElementById("canvasBg").value = data.bg;
    canvas.loadFromJSON(data.json, function(){
      canvas.getObjects().forEach(o=>{ if(o.lockMovementX) o.hasControls = false; });
      canvas.renderAll(); isLoadingHistory = false;
      history = []; historyIndex = -1; saveHistory(); updateUI();
    });
  } else { saveHistory(); updateUI(); }
})();
canvas.on("object:added", function(){ if(!isLoadingHistory){ saveHistory(); updateLayers(); } });
canvas.on("object:removed", function(){ if(!isLoadingHistory){ saveHistory(); updateLayers(); } });
canvas.on("object:modified", function(){ if(!isLoadingHistory){ saveHistory(); updateProperties(); } });
canvas.on("path:created", function(e){ if(e.path){ e.path.customType = "path"; } if(!isLoadingHistory){ saveHistory(); updateLayers(); } });
canvas.on("selection:created", updateUI);
canvas.on("selection:updated", updateUI);
canvas.on("selection:cleared", updateUI);
canvas.on("text:changed", function(){ updateLayers(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
setTimeout(fitZoom, 60);
</script>
