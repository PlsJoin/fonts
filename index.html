<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ロゴ作成ツール</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        "Yu Gothic UI",
        "Meiryo",
        "Noto Sans JP",
        Arial,
        sans-serif;
    color: #222;
    background: #e9e9e9;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   全体
========================= */

.app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   上部ツールバー
========================= */

.topbar {
    height: 46px;
    background: #f7f7f7;
    border-bottom: 1px solid #bdbdbd;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 4px;
    flex-shrink: 0;
}

.file-title {
    min-width: 150px;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.toolbar-separator {
    width: 1px;
    height: 25px;
    background: #c9c9c9;
    margin: 0 4px;
}

.tool-button {
    height: 30px;
    min-width: 34px;
    padding: 0 9px;
    border: 1px solid transparent;
    background: transparent;
    color: #222;
    font-size: 13px;
    border-radius: 2px;
}

.tool-button:hover {
    background: #e5e5e5;
    border-color: #c8c8c8;
}

.tool-button:active {
    background: #d8d8d8;
}

.tool-button.primary {
    background: #ffffff;
    border: 1px solid #aaa;
}

.tool-button.primary:hover {
    background: #eeeeee;
}

.spacer {
    flex: 1;
}

.zoom-area {
    display: flex;
    align-items: center;
    gap: 5px;
}

.zoom-area button {
    width: 28px;
    height: 28px;
    border: 1px solid #bbb;
    background: #fff;
    border-radius: 2px;
}

.zoom-value {
    width: 55px;
    text-align: center;
    font-size: 12px;
}

/* =========================
   メイン
========================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================
   左ツール
========================= */

.left-panel {
    width: 58px;
    background: #f4f4f4;
    border-right: 1px solid #bdbdbd;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 5px;
    flex-shrink: 0;
}

.left-tool {
    width: 48px;
    height: 46px;
    margin-bottom: 2px;
    border: 1px solid transparent;
    background: transparent;
    color: #222;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    font-size: 11px;
}

.left-tool .icon {
    font-size: 18px;
    line-height: 18px;
}

.left-tool:hover {
    background: #e5e5e5;
    border-color: #ccc;
}

.left-tool.active {
    background: #dcdcdc;
    border-color: #aaa;
}

/* =========================
   中央作業領域
========================= */

.workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #dcdcdc;
}

/* Fabric Canvas を置く場所 */

.canvas-wrapper {
    position: absolute;
    inset: 0;
    overflow: auto;
}

/* スクロールバー */

.canvas-wrapper::-webkit-scrollbar {
    width: 14px;
    height: 14px;
}

.canvas-wrapper::-webkit-scrollbar-track {
    background: #eeeeee;
}

.canvas-wrapper::-webkit-scrollbar-thumb {
    background: #b5b5b5;
    border: 3px solid #eeeeee;
}

.canvas-area {
    position: relative;
    margin: 60px auto;
    width: 1200px;
    height: 800px;
    background: #fff;
    box-shadow:
        0 1px 4px rgba(0,0,0,0.25);
}

/* グリッド */

.grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(to right, #e8e8e8 1px, transparent 1px),
        linear-gradient(to bottom, #e8e8e8 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: 0;
}

.grid.large {
    background-image:
        linear-gradient(to right, #d5d5d5 1px, transparent 1px),
        linear-gradient(to bottom, #d5d5d5 1px, transparent 1px),
        linear-gradient(to right, #e8e8e8 1px, transparent 1px),
        linear-gradient(to bottom, #e8e8e8 1px, transparent 1px);
    background-size:
        100px 100px,
        100px 100px,
        20px 20px,
        20px 20px;
}

#canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
}

/* =========================
   右プロパティ
========================= */

.right-panel {
    width: 280px;
    background: #f6f6f6;
    border-left: 1px solid #bdbdbd;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
}

.panel-title {
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #c5c5c5;
    font-size: 13px;
    font-weight: 600;
    background: #ededed;
}

.property-content {
    padding: 10px;
    overflow-y: auto;
}

.property-section {
    border-bottom: 1px solid #d2d2d2;
    padding-bottom: 12px;
    margin-bottom: 12px;
}

.property-section:last-child {
    border-bottom: 0;
}

.section-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #444;
}

.property-row {
    display: flex;
    align-items: center;
    min-height: 30px;
    margin-bottom: 5px;
}

.property-label {
    width: 70px;
    font-size: 12px;
    color: #444;
}

.property-input {
    flex: 1;
    height: 27px;
    border: 1px solid #aaa;
    background: #fff;
    padding: 3px 6px;
    font-size: 12px;
    border-radius: 1px;
}

.property-input:focus {
    outline: none;
    border-color: #777;
}

.property-select {
    flex: 1;
    height: 27px;
    border: 1px solid #aaa;
    background: #fff;
    font-size: 12px;
}

.color-input {
    width: 48px;
    height: 27px;
    padding: 1px;
    border: 1px solid #aaa;
    background: white;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
}

.checkbox-row input {
    margin: 0;
}

.no-selection {
    color: #777;
    font-size: 12px;
    line-height: 1.7;
    padding: 8px 0;
}

/* =========================
   レイヤー
========================= */

.layers {
    border-top: 1px solid #c5c5c5;
    flex: 1;
    min-height: 150px;
    display: flex;
    flex-direction: column;
}

.layer-list {
    overflow-y: auto;
    flex: 1;
}

.layer-item {
    height: 34px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 7px;
    font-size: 12px;
    cursor: pointer;
}

.layer-item:hover {
    background: #e8e8e8;
}

.layer-item.selected {
    background: #d9d9d9;
}

.layer-number {
    width: 20px;
    color: #777;
    text-align: center;
}

.layer-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.layer-actions {
    height: 35px;
    display: flex;
    border-top: 1px solid #ccc;
}

.layer-actions button {
    flex: 1;
    border: 0;
    border-right: 1px solid #ccc;
    background: #f2f2f2;
    font-size: 11px;
}

.layer-actions button:hover {
    background: #e3e3e3;
}

/* =========================
   下部ステータス
========================= */

.statusbar {
    height: 25px;
    background: #ededed;
    border-top: 1px solid #bdbdbd;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 11px;
    color: #555;
    flex-shrink: 0;
}

.status-left {
    display: flex;
    gap: 18px;
}

.status-right {
    margin-left: auto;
}

/* =========================
   テキスト編集
========================= */

.text-toolbar {
    position: absolute;
    display: none;
    height: 36px;
    background: #f7f7f7;
    border: 1px solid #aaa;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    z-index: 20;
    padding: 3px;
    gap: 3px;
}

.text-toolbar button {
    min-width: 30px;
    border: 1px solid transparent;
    background: transparent;
}

.text-toolbar button:hover {
    background: #e4e4e4;
    border-color: #ccc;
}

/* =========================
   右クリックメニュー
========================= */

.context-menu {
    display: none;
    position: fixed;
    width: 180px;
    background: #fff;
    border: 1px solid #999;
    box-shadow: 2px 3px 8px rgba(0,0,0,0.2);
    z-index: 9999;
    padding: 3px 0;
}

.context-menu-item {
    height: 29px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    font-size: 12px;
}

.context-menu-item:hover {
    background: #e6e6e6;
}

/* =========================
   モーダル
========================= */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.28);
    z-index: 10000;
    align-items: center;
    justify-content: center;
}

.modal {
    width: 390px;
    background: #f7f7f7;
    border: 1px solid #999;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.modal-header {
    height: 40px;
    border-bottom: 1px solid #ccc;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
}

.modal-body {
    padding: 15px;
}

.modal-footer {
    height: 50px;
    border-top: 1px solid #ccc;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
}

.modal-button {
    min-width: 75px;
    height: 29px;
    border: 1px solid #aaa;
    background: #fff;
    font-size: 12px;
}

.modal-button:hover {
    background: #e8e8e8;
}

/* =========================
   レスポンシブ
========================= */

@media (max-width: 900px) {

    .right-panel {
        width: 240px;
    }

    .file-title {
        min-width: 100px;
    }
}

@media (max-width: 700px) {

    .right-panel {
        display: none;
    }

    .left-panel {
        width: 52px;
    }

    .left-tool {
        width: 44px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         上部
    ========================== -->

    <div class="topbar">

        <div class="file-title">
            ロゴ作成
        </div>

        <div class="toolbar-separator"></div>

        <button class="tool-button primary" id="undoButton">
            元に戻す
        </button>

        <button class="tool-button primary" id="redoButton">
            やり直す
        </button>

        <div class="toolbar-separator"></div>

        <button class="tool-button" id="copyButton">
            コピー
        </button>

        <button class="tool-button" id="pasteButton">
            貼り付け
        </button>

        <button class="tool-button" id="duplicateButton">
            複製
        </button>

        <button class="tool-button" id="deleteButton">
            削除
        </button>

        <div class="toolbar-separator"></div>

        <button class="tool-button" id="frontButton">
            前面へ
        </button>

        <button class="tool-button" id="backButton">
            背面へ
        </button>

        <div class="spacer"></div>

        <div class="zoom-area">

            <button id="zoomOut">−</button>

            <div class="zoom-value" id="zoomValue">
                100%
            </div>

            <button id="zoomIn">＋</button>

        </div>

        <div class="toolbar-separator"></div>

        <button class="tool-button primary" id="exportButton">
            PNG出力
        </button>

    </div>


    <!-- =========================
         メイン
    ========================== -->

    <div class="main">

        <!-- 左 -->

        <div class="left-panel">

            <button class="left-tool active" id="selectTool">
                <div class="icon">↖</div>
                <div>選択</div>
            </button>

            <button class="left-tool" id="textTool">
                <div class="icon">T</div>
                <div>文字</div>
            </button>

            <button class="left-tool" id="rectTool">
                <div class="icon">□</div>
                <div>四角形</div>
            </button>

            <button class="left-tool" id="circleTool">
                <div class="icon">○</div>
                <div>円</div>
            </button>

            <button class="left-tool" id="lineTool">
                <div class="icon">／</div>
                <div>線</div>
            </button>

            <button class="left-tool" id="imageTool">
                <div class="icon">▧</div>
                <div>画像</div>
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                style="display:none;"
            >

        </div>


        <!-- 作業領域 -->

        <div class="workspace">

            <div class="canvas-wrapper">

                <div class="canvas-area">

                    <div class="grid"></div>

                    <canvas
                        id="canvas"
                        width="1200"
                        height="800">
                    </canvas>

                </div>

            </div>

        </div>


        <!-- 右 -->

        <div class="right-panel">

            <div class="panel-title">
                オブジェクト
            </div>

            <div
                class="property-content"
                id="propertyContent">

                <div class="no-selection">
                    オブジェクトを選択すると、<br>
                    ここに設定項目が表示されます。
                </div>

            </div>


            <div class="layers">

                <div class="panel-title">
                    レイヤー
                </div>

                <div
                    class="layer-list"
                    id="layerList">
                </div>

                <div class="layer-actions">

                    <button id="layerUp">
                        ↑ 前面
                    </button>

                    <button id="layerDown">
                        ↓ 背面
                    </button>

                    <button id="layerTop">
                        最前面
                    </button>

                    <button id="layerBottom">
                        最背面
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         ステータス
    ========================== -->

    <div class="statusbar">

        <div class="status-left">

            <span id="objectStatus">
                オブジェクト 0
            </span>

            <span id="positionStatus">
                X: -　Y: -
            </span>

            <span id="sizeStatus">
                W: -　H: -
            </span>

        </div>

        <div class="status-right">
            1200 × 800 px
        </div>

    </div>

</div>


<!-- =========================
     コンテキストメニュー
========================== -->

<div
    class="context-menu"
    id="contextMenu">

    <div
        class="context-menu-item"
        data-action="copy">
        コピー
    </div>

    <div
        class="context-menu-item"
        data-action="paste">
        貼り付け
    </div>

    <div
        class="context-menu-item"
        data-action="duplicate">
        複製
    </div>

    <div
        class="context-menu-item"
        data-action="delete">
        削除
    </div>

    <div style="height:1px;background:#ddd;margin:3px 0;"></div>

    <div
        class="context-menu-item"
        data-action="front">
        前面へ
    </div>

    <div
        class="context-menu-item"
        data-action="back">
        背面へ
    </div>

</div>


<!-- =========================
     PNG設定
========================== -->

<div
    class="modal-bg"
    id="exportModal">

    <div class="modal">

        <div class="modal-header">
            PNG画像を書き出す
        </div>

        <div class="modal-body">

            <div class="property-row">

                <div class="property-label">
                    サイズ
                </div>

                <select
                    class="property-select"
                    id="exportSize">

                    <option value="1">
                        元のサイズ（1200 × 800）
                    </option>

                    <option value="2">
                        2倍（2400 × 1600）
                    </option>

                    <option value="3">
                        3倍（3600 × 2400）
                    </option>

                </select>

            </div>

            <div
                class="checkbox-row"
                style="margin-top:12px;">

                <input
                    type="checkbox"
                    id="transparentBackground"
                    checked>

                <label for="transparentBackground">
                    背景を透過する
                </label>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="modal-button"
                id="cancelExport">
                キャンセル
            </button>

            <button
                class="modal-button"
                id="confirmExport">
                書き出す
            </button>

        </div>

    </div>

</div>


<script>
/* =========================================================
   基本設定
========================================================= */

const canvas = new fabric.Canvas("canvas", {
    preserveObjectStacking: true,
    selection: true,
    backgroundColor: "transparent"
});

const canvasWidth = 1200;
const canvasHeight = 800;

let currentTool = "select";

let copiedObject = null;

let history = [];
let historyIndex = -1;
let isRestoringHistory = false;


/* =========================================================
   履歴
========================================================= */

function saveHistory() {

    if (isRestoringHistory) {
        return;
    }

    const json = JSON.stringify(canvas.toJSON());

    history = history.slice(0, historyIndex + 1);

    history.push(json);

    historyIndex++;

    if (history.length > 50) {

        history.shift();
        historyIndex--;

    }
}

function restoreHistory(index) {

    if (index < 0 || index >= history.length) {
        return;
    }

    isRestoringHistory = true;

    canvas.loadFromJSON(
        history[index],
        function() {

            canvas.renderAll();

            isRestoringHistory = false;

            updateProperties();
            updateLayers();
            updateStatus();

        }
    );

    historyIndex = index;
}

function undo() {

    if (historyIndex <= 0) {
        return;
    }

    restoreHistory(historyIndex - 1);
}

function redo() {

    if (historyIndex >= history.length - 1) {
        return;
    }

    restoreHistory(historyIndex + 1);
}


/* =========================================================
   ツール切り替え
========================================================= */

function setTool(tool) {

    currentTool = tool;

    document.querySelectorAll(".left-tool").forEach(function(button) {
        button.classList.remove("active");
    });

    if (tool === "select") {
        document.getElementById("selectTool").classList.add("active");
        canvas.selection = true;
        canvas.defaultCursor = "default";
    }

    if (tool === "text") {
        document.getElementById("textTool").classList.add("active");
        canvas.selection = false;
        canvas.defaultCursor = "text";
    }

    if (tool === "rect") {
        document.getElementById("rectTool").classList.add("active");
        canvas.selection = false;
        canvas.defaultCursor = "crosshair";
    }

    if (tool === "circle") {
        document.getElementById("circleTool").classList.add("active");
        canvas.selection = false;
        canvas.defaultCursor = "crosshair";
    }

    if (tool === "line") {
        document.getElementById("lineTool").classList.add("active");
        canvas.selection = false;
        canvas.defaultCursor = "crosshair";
    }

    if (tool === "image") {
        document.getElementById("imageTool").classList.add("active");
        canvas.selection = false;
        canvas.defaultCursor = "default";
    }
}


/* =========================================================
   テキスト追加
========================================================= */

function addText(x, y) {

    const text = new fabric.IText("文字を入力", {

        left: x,
        top: y,

        fontFamily: "Yu Gothic",
        fontSize: 60,

        fill: "#222222",

        fontWeight: "normal",
        fontStyle: "normal",

        originX: "left",
        originY: "top",

        transparentCorners: false,

        cornerColor: "#ffffff",
        cornerStrokeColor: "#555555",
        borderColor: "#555555",

        padding: 5

    });

    canvas.add(text);

    canvas.setActiveObject(text);

    text.enterEditing();
    text.selectAll();

    canvas.renderAll();

    saveHistory();
    updateProperties();
    updateLayers();
    updateStatus();
}


/* =========================================================
   四角形
========================================================= */

function addRect(x, y) {

    const rect = new fabric.Rect({

        left: x,
        top: y,

        width: 200,
        height: 120,

        fill: "#d9d9d9",
        stroke: "#333333",
        strokeWidth: 2,

        originX: "left",
        originY: "top",

        transparentCorners: false,

        cornerColor: "#ffffff",
        cornerStrokeColor: "#555555",
        borderColor: "#555555",

        padding: 0

    });

    canvas.add(rect);

    canvas.setActiveObject(rect);

    canvas.renderAll();

    saveHistory();
    updateProperties();
    updateLayers();
    updateStatus();
}


/* =========================================================
   円
========================================================= */

function addCircle(x, y) {

    const circle = new fabric.Circle({

        left: x,
        top: y,

        radius: 70,

        fill: "#d9d9d9",
        stroke: "#333333",
        strokeWidth: 2,

        originX: "left",
        originY: "top",

        transparentCorners: false,

        cornerColor: "#ffffff",
        cornerStrokeColor: "#555555",
        borderColor: "#555555"

    });

    canvas.add(circle);

    canvas.setActiveObject(circle);

    canvas.renderAll();

    saveHistory();
    updateProperties();
    updateLayers();
    updateStatus();
}


/* =========================================================
   線
========================================================= */

function addLine(x, y) {

    const line = new fabric.Line(
        [0, 0, 200, 0],
        {

            left: x,
            top: y,

            stroke: "#222222",
            strokeWidth: 3,

            originX: "left",
            originY: "top",

            transparentCorners: false,

            cornerColor: "#ffffff",
            cornerStrokeColor: "#555555",
            borderColor: "#555555"

        }
    );

    canvas.add(line);

    canvas.setActiveObject(line);

    canvas.renderAll();

    saveHistory();
    updateProperties();
    updateLayers();
    updateStatus();
}


/* =========================================================
   画像
========================================================= */

function addImage(file) {

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        fabric.Image.fromURL(
            event.target.result,
            function(img) {

                const maxWidth = 400;
                const maxHeight = 300;

                const scaleX = maxWidth / img.width;
                const scaleY = maxHeight / img.height;

                let scale = Math.min(scaleX, scaleY, 1);

                img.set({

                    left: 100,
                    top: 100,

                    scaleX: scale,
                    scaleY: scale,

                    transparentCorners: false,

                    cornerColor: "#ffffff",
                    cornerStrokeColor: "#555555",
                    borderColor: "#555555"

                });

                canvas.add(img);

                canvas.setActiveObject(img);

                canvas.renderAll();

                saveHistory();

                updateProperties();
                updateLayers();
                updateStatus();

                setTool("select");

            }
        );

    };

    reader.readAsDataURL(file);
}


/* =========================================================
   キャンバスクリック
========================================================= */

canvas.on("mouse:down", function(event) {

    if (currentTool === "select") {
        return;
    }

    if (currentTool === "image") {
        document.getElementById("imageInput").click();
        return;
    }

    const pointer = canvas.getPointer(event.e);

    if (currentTool === "text") {
        addText(pointer.x, pointer.y);
        setTool("select");
        return;
    }

    if (currentTool === "rect") {
        addRect(pointer.x, pointer.y);
        setTool("select");
        return;
    }

    if (currentTool === "circle") {
        addCircle(pointer.x, pointer.y);
        setTool("select");
        return;
    }

    if (currentTool === "line") {
        addLine(pointer.x, pointer.y);
        setTool("select");
        return;
    }

});

/* =========================================================
   グリッド吸着
========================================================= */

function snapObject(object) {

    const gridSize = 20;

    object.set({
        left: Math.round(object.left / gridSize) * gridSize,
        top: Math.round(object.top / gridSize) * gridSize
    });

    object.setCoords();

}

/* =========================================================
   プロパティイベント
========================================================= */

function attachPropertyEvents(object) {

    const x = document.getElementById("propX");

    if (x) {

        x.addEventListener("change", function() {

            object.set("left", Number(this.value));

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateLayers();
            updateStatus();

        });

    }


    const y = document.getElementById("propY");

    if (y) {

        y.addEventListener("change", function() {

            object.set("top", Number(this.value));

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateLayers();
            updateStatus();

        });

    }


    const width = document.getElementById("propWidth");

    if (width) {

        width.addEventListener("change", function() {

            const newWidth = Number(this.value);

            if (object.width) {

                object.scaleX =
                    newWidth / object.width;

            }

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateProperties();
            updateStatus();

        });

    }


    const height = document.getElementById("propHeight");

    if (height) {

        height.addEventListener("change", function() {

            const newHeight = Number(this.value);

            if (object.height) {

                object.scaleY =
                    newHeight / object.height;

            }

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateProperties();
            updateStatus();

        });

    }


    const opacity = document.getElementById("propOpacity");

    if (opacity) {

        opacity.addEventListener("change", function() {

            let value = Number(this.value);

            value = Math.max(
                0,
                Math.min(100, value)
            );

            object.set(
                "opacity",
                value / 100
            );

            canvas.renderAll();

            saveHistory();

        });

    }


    const angle = document.getElementById("propAngle");

    if (angle) {

        angle.addEventListener("change", function() {

            object.set(
                "angle",
                Number(this.value)
            );

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateStatus();

        });

    }


    const fill = document.getElementById("propFill");

    if (fill) {

        fill.addEventListener("input", function() {

            object.set(
                "fill",
                this.value
            );

            canvas.renderAll();

        });

        fill.addEventListener("change", function() {

            saveHistory();

        });

    }


    const stroke = document.getElementById("propStroke");

    if (stroke) {

        stroke.addEventListener("input", function() {

            object.set(
                "stroke",
                this.value
            );

            canvas.renderAll();

        });

        stroke.addEventListener("change", function() {

            saveHistory();

        });

    }


    const strokeWidth =
        document.getElementById("propStrokeWidth");

    if (strokeWidth) {

        strokeWidth.addEventListener("change", function() {

            object.set(
                "strokeWidth",
                Number(this.value)
            );

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateStatus();

        });

    }


    const font =
        document.getElementById("propFont");

    if (font) {

        font.addEventListener("change", function() {

            object.set(
                "fontFamily",
                this.value
            );

            canvas.renderAll();

            saveHistory();

        });

    }


    const fontSize =
        document.getElementById("propFontSize");

    if (fontSize) {

        fontSize.addEventListener("change", function() {

            object.set(
                "fontSize",
                Number(this.value)
            );

            object.setCoords();

            canvas.renderAll();

            saveHistory();
            updateProperties();
            updateStatus();

        });

    }


    const bold =
        document.getElementById("propBold");

    if (bold) {

        bold.addEventListener("change", function() {

            object.set(
                "fontWeight",
                this.checked
                    ? "bold"
                    : "normal"
            );

            canvas.renderAll();

            saveHistory();

        });

    }


    const italic =
        document.getElementById("propItalic");

    if (italic) {

        italic.addEventListener("change", function() {

            object.set(
                "fontStyle",
                this.checked
                    ? "italic"
                    : "normal"
            );

            canvas.renderAll();

            saveHistory();

        });

    }

}


/* =========================================================
   HEX変換
========================================================= */

function toHex(color) {

    if (!color) {
        return "#000000";
    }

    if (color.startsWith("#")) {
        return color;
    }

    if (color === "transparent") {
        return "#ffffff";
    }

    const ctx =
        document.createElement("canvas")
            .getContext("2d");

    ctx.fillStyle = color;

    return ctx.fillStyle;

}


/* =========================================================
   レイヤー更新
========================================================= */

function updateLayers() {

    const list =
        document.getElementById("layerList");

    list.innerHTML = "";

    const objects = canvas.getObjects();

    const selected =
        canvas.getActiveObject();

    objects
        .slice()
        .reverse()
        .forEach(function(object, reverseIndex) {

            const actualIndex =
                objects.length - 1 - reverseIndex;

            const item =
                document.createElement("div");

            item.className =
                "layer-item";

            if (object === selected) {
                item.classList.add("selected");
            }

            const number =
                document.createElement("div");

            number.className =
                "layer-number";

            number.textContent =
                actualIndex + 1;


            const name =
                document.createElement("div");

            name.className =
                "layer-name";

            name.textContent =
                getObjectName(object);


            item.appendChild(number);
            item.appendChild(name);

            item.addEventListener("click", function() {

                canvas.setActiveObject(object);

                canvas.renderAll();

                updateProperties();
                updateLayers();
                updateStatus();

            });

            list.appendChild(item);

        });

}


function getObjectName(object) {

    if (
        object.type === "i-text" ||
        object.type === "text"
    ) {

        return object.text || "文字";

    }

    if (object.type === "rect") {
        return "四角形";
    }

    if (object.type === "circle") {
        return "円";
    }

    if (object.type === "line") {
        return "線";
    }

    if (object.type === "image") {
        return "画像";
    }

    return "オブジェクト";

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

    const objects =
        canvas.getObjects();

    document.getElementById("objectStatus")
        .textContent =
        "オブジェクト " + objects.length;


    const object =
        canvas.getActiveObject();

    if (!object) {

        document.getElementById("positionStatus")
            .textContent =
            "X: -　Y: -";

        document.getElementById("sizeStatus")
            .textContent =
            "W: -　H: -";

        return;
    }


    document.getElementById("positionStatus")
        .textContent =
        "X: " +
        Math.round(object.left) +
        "　Y: " +
        Math.round(object.top);


    document.getElementById("sizeStatus")
        .textContent =
        "W: " +
        Math.round(object.getScaledWidth()) +
        "　H: " +
        Math.round(object.getScaledHeight());

}


/* =========================================================
   コピー
========================================================= */

function copyObject() {

    const object =
        canvas.getActiveObject();

    if (!object) {
        return;
    }

    object.clone(function(cloned) {

        copiedObject = cloned;

    });

}


/* =========================================================
   貼り付け
========================================================= */

function pasteObject() {

    if (!copiedObject) {
        return;
    }

    copiedObject.clone(function(clonedObj) {

        clonedObj.set({

            left:
                (clonedObj.left || 0) + 20,

            top:
                (clonedObj.top || 0) + 20

        });

        canvas.add(clonedObj);

        canvas.setActiveObject(clonedObj);

        canvas.renderAll();

        saveHistory();

        updateProperties();
        updateLayers();
        updateStatus();

    });

}


/* =========================================================
   複製
========================================================= */

function duplicateObject() {

    copyObject();

    setTimeout(function() {

        pasteObject();

    }, 10);

}


/* =========================================================
   削除
========================================================= */

function deleteObject() {

    const active =
        canvas.getActiveObjects();

    if (!active.length) {
        return;
    }

    active.forEach(function(object) {

        canvas.remove(object);

    });

    canvas.discardActiveObject();

    canvas.renderAll();

    saveHistory();

    updateProperties();
    updateLayers();
    updateStatus();

}

/* =========================================================
   キーボード操作
========================================================= */

document.addEventListener("keydown", function(event) {

    const active =
        canvas.getActiveObject();

    /* Ctrl + Z */

    if (
        event.ctrlKey &&
        !event.shiftKey &&
        event.key.toLowerCase() === "z"
    ) {

        event.preventDefault();

        undo();

        return;

    }


    /* Ctrl + Y */

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "y"
    ) {

        event.preventDefault();

        redo();

        return;

    }


    /* Ctrl + C */

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "c"
    ) {

        if (
            active &&
            !isTextEditing()
        ) {

            event.preventDefault();

            copyObject();

        }

        return;

    }


    /* Ctrl + V */

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "v"
    ) {

        if (!isTextEditing()) {

            event.preventDefault();

            pasteObject();

        }

        return;

    }


    /* Ctrl + D */

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "d"
    ) {

        if (
            active &&
            !isTextEditing()
        ) {

            event.preventDefault();

            duplicateObject();

        }

        return;

    }


    /* Delete */

    if (
        event.key === "Delete" &&
        !isTextEditing()
    ) {

        deleteObject();

        return;

    }


    /* 矢印 */

    if (
        active &&
        !isTextEditing() &&
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(event.key)
    ) {

        event.preventDefault();

        const step =
            event.shiftKey ? 10 : 1;

        if (event.key === "ArrowUp") {
            active.top -= step;
        }

        if (event.key === "ArrowDown") {
            active.top += step;
        }

        if (event.key === "ArrowLeft") {
            active.left -= step;
        }

        if (event.key === "ArrowRight") {
            active.left += step;
        }

        active.setCoords();

        canvas.renderAll();

        updateProperties();
        updateStatus();

        return;

    }

});


function isTextEditing() {

    const active =
        canvas.getActiveObject();

    return (
        active &&
        (
            active.type === "i-text" ||
            active.type === "text"
        ) &&
        active.isEditing
    );

}

========================================================= */

let zoom = 1;

function setZoom(value) {

    zoom = Math.max(
        0.5,
        Math.min(2, value)
    );

    canvas.setZoom(zoom);

    document.getElementById("zoomValue")
        .textContent =
        Math.round(zoom * 100) + "%";

}


document.getElementById("zoomIn")
    .addEventListener(
        "click",
        function() {

            setZoom(zoom + 0.1);

        }
    );


document.getElementById("zoomOut")
    .addEventListener(
        "click",
        function() {

            setZoom(zoom - 0.1);

        }
    );

    }

});


document.addEventListener("click", function() {

    document.getElementById("contextMenu")
        .style.display = "none";

});


document.querySelectorAll(".context-menu-item")
    .forEach(function(item) {

        item.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                const action =
                    this.dataset.action;

                if (action === "copy") {
                    copyObject();
                }

                if (action === "paste") {
                    pasteObject();
                }

                if (action === "duplicate") {
                    duplicateObject();
                }

                if (action === "delete") {
                    deleteObject();
                }

                if (action === "front") {
                    bringForward();
                }

                if (action === "back") {
                    sendBackward();
                }

            }
        );

    });


/* =========================================================
   PNG出力
========================================================= */

document.getElementById("exportButton")
    .addEventListener(
        "click",
        function() {

            document.getElementById("exportModal")
                .style.display = "flex";

        }
    );


document.getElementById("cancelExport")
    .addEventListener(
        "click",
        function() {

            document.getElementById("exportModal")
                .style.display = "none";

        }
    );


document.getElementById("confirmExport")
    .addEventListener(
        "click",
        function() {

            const multiplier =
                Number(
                    document.getElementById(
                        "exportSize"
                    ).value
                );

            const transparent =
                document.getElementById(
                    "transparentBackground"
                ).checked;


            const oldBackground =
                canvas.backgroundColor;


            if (transparent) {

                canvas.backgroundColor =
                    "transparent";

            } else {

                canvas.backgroundColor =
                    "#ffffff";

            }


            canvas.discardActiveObject();

            canvas.renderAll();


            const dataURL =
                canvas.toDataURL({

                    format: "png",

                    multiplier:
                        multiplier,

                    enableRetinaScaling: false

                });


            canvas.backgroundColor =
                oldBackground;

            canvas.renderAll();


            const link =
                document.createElement("a");

            link.href = dataURL;

            link.download =
                "logo.png";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            document.getElementById("exportModal")
                .style.display = "none";

        }
    );


/* =========================================================
   初期状態
========================================================= */

saveHistory();

updateLayers();

updateStatus();

setTool("select");


/* =========================================================
   キャンバス外クリック
========================================================= */

canvas.on("mouse:down", function(event) {

    updateProperties();
    updateLayers();
    updateStatus();

});


/* =========================================================
   初期サンプルは置かない
========================================================= */

canvas.renderAll();

</script>
