<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>白紙シート | Excel風メモ＆PNG書き出し</title>
<style>
  :root{
    --font: 'Helvetica Neue', Helvetica, Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif;
    --bg:#eceff4;
    --paper:#ffffff;
    --ink:#1f2430;
    --line:#d8dee8;
    --accent:#2f6fed;
    --accent-soft:#e8f0ff;
    --muted:#6b7686;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- toolbar ---------- */
  header{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:10px 14px;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 3px rgba(20,30,50,.05);
    z-index:5;
  }
  .brand{
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    margin-right:6px;
    white-space:nowrap;
  }
  .brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px;}
  .btn{
    font-family:inherit;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:8px;
    cursor:pointer;
    line-height:1.2;
    transition:background .12s, border-color .12s, color .12s;
  }
  .btn:hover{background:#f5f7fb;border-color:#c6d0de;}
  .btn:active{transform:translateY(1px);}
  .btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn.primary:hover{background:#2560d8;}
  .field{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  select, input[type="color"]{
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    padding:5px 6px;
    cursor:pointer;
  }
  input[type="color"]{padding:2px;width:38px;height:30px;}
  .spacer{flex:1 1 auto;}
  .meta{font-size:12px;color:var(--muted);white-space:nowrap;}
  .keys{font-size:12px;color:var(--muted);white-space:nowrap;}
  .keys kbd{
    font-family:inherit;
    background:#f2f4f8;
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:4px;
    padding:1px 5px;
    font-size:11px;
    color:#44506a;
  }

  /* ---------- canvas ---------- */
  #stage{
    flex:1 1 auto;
    overflow:auto;
    padding:22px;
  }
  #sheet{
    position:relative;
    width:3200px;
    height:2200px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 2px 12px rgba(20,30,50,.13), 0 0 0 1px rgba(20,30,50,.05);
  }
  #sheetHint{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    color:#c3cbd8;
    font-size:19px;
    letter-spacing:.04em;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .cell{
    position:absolute;
    padding:4px 8px;
    white-space:pre;
    cursor:move;
    border-radius:4px;
    outline:none;
    min-width:14px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    caret-color:var(--accent);
  }
  .cell:hover{background:rgba(47,111,237,.055);}
  .cell.sel{
    box-shadow:0 0 0 1.5px rgba(47,111,237,.6);
    background:rgba(47,111,237,.045);
  }
  .cell.editing{
    cursor:text;
    user-select:text;
    -webkit-user-select:text;
    touch-action:auto;
    background:#fff;
    box-shadow:0 0 0 1.5px var(--accent), 0 0 0 5px rgba(47,111,237,.13);
  }
  footer{
    padding:6px 14px;
    font-size:11.5px;
    color:var(--muted);
    background:#fff;
    border-top:1px solid var(--line);
    white-space:nowrap;
    overflow-x:auto;
  }
</style>
</head>
<body>

<header>
  <div class="brand">白紙シート<span>Excel風・マスなし</span></div>

  <button id="boldBtn" class="btn" title="太字 (Ctrl+B)"><b>B</b> 太字</button>

  <label class="field">サイズ
    <select id="sizeSel">
      <option value="12">12</option>
      <option value="14">14</option>
      <option value="16">16</option>
      <option value="18" selected>18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="32">32</option>
      <option value="40">40</option>
      <option value="48">48</option>
      <option value="56">56</option>
      <option value="72">72</option>
    </select>
  </label>

  <label class="field">色
    <input type="color" id="colorInp" value="#1f2430" />
  </label>

  <button id="delBtn" class="btn">セル削除</button>
  <button id="clearBtn" class="btn">全消去</button>
  <button id="pngBtn" class="btn primary">PNGで保存</button>

  <span class="spacer"></span>
  <span class="meta" id="count">セル数 0</span>
</header>

<div id="stage">
  <div id="sheet">
    <div id="sheetHint">クリックした場所に入力できます</div>
  </div>
</div>

<footer>
  クリック＝新規入力 ／ ダブルクリック＝編集 ／ ドラッグ＝移動 ／ <kbd>Enter</kbd><kbd>Tab</kbd>＝次のセル ／ 矢印キー＝移動 ／ <kbd>Delete</kbd>＝文字を消去 ／ <kbd>Esc</kbd>＝選択解除 ／ <kbd>Ctrl</kbd>+<kbd>Z</kbd>＝元に戻す ／ <kbd>Ctrl</kbd>+<kbd>S</kbd>＝PNG保存
</footer>

<script>
(function(){
  'use strict';

  /* ===== 定数 ===== */
  var FONT = "'Helvetica Neue', Helvetica, Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif";
  var PAD_X = 8;        // CSS の padding-left/right と一致させる
  var PAD_Y = 4;        // CSS の padding-top/bottom と一致させる
  var LINE  = 1.35;     // 行送り倍率（CSS の line-height と一致させる）
  var NEW_GAP_X = 14;   // Tab で作る新セルの横間隔
  var NEW_GAP_Y = 6;    // Enter で作る新セルの縦間隔

  /* ===== 要素 ===== */
  var stage    = document.getElementById('stage');
  var sheet    = document.getElementById('sheet');
  var hint     = document.getElementById('sheetHint');
  var boldBtn  = document.getElementById('boldBtn');
  var sizeSel  = document.getElementById('sizeSel');
  var colorInp = document.getElementById('colorInp');
  var delBtn   = document.getElementById('delBtn');
  var clearBtn = document.getElementById('clearBtn');
  var pngBtn   = document.getElementById('pngBtn');
  var countEl  = document.getElementById('count');

  /* ===== 状態 ===== */
  var cells    = [];              // {id,x,y,text,size,bold,color}
  var byId     = new Map();       // id -> cell
  var els      = new Map();       // id -> DOM要素
  var seq      = 0;
  var selectedId = null;
  var editingId  = null;
  var textBefore = '';
  var defaults = { size: 18, bold: false, color: '#1f2430' };
  var history  = [];
  var redoStack = [];
  var drag     = null;
  var emptyDown = null;

  /* ===== 履歴（空セルは保存しない） ===== */
  function snapshot(){
    var list = cells.filter(function(c){ return c.text !== ''; });
    return JSON.stringify(list);
  }
  function pushHistory(){
    history.push(snapshot());
    if (history.length > 80) history.shift();
    redoStack.length = 0;
  }
  function undo(){
    if (!history.length) return;
    redoStack.push(snapshot());
    cells = JSON.parse(history.pop());
    rebuild();
  }
  function redo(){
    if (!redoStack.length) return;
    history.push(snapshot());
    cells = JSON.parse(redoStack.pop());
    rebuild();
  }
  function rebuild(){
    editingId = null;
    els.forEach(function(el){ el.remove(); });
    els.clear();
    byId.clear();
    seq = 0;
    cells.forEach(function(c){
      byId.set(c.id, c);
      if (c.id > seq) seq = c.id;
      makeEl(c);
    });
    if (selectedId !== null && !byId.has(selectedId)) selectedId = null;
    syncSelection();
    updateCount();
  }

  /* ===== セル生成・描画 ===== */
  function makeEl(c){
    var el = document.createElement('div');
    el.className = 'cell';
    el.setAttribute('data-id', String(c.id));
    el.setAttribute('contenteditable', 'false');
    el.spellcheck = false;
    el.textContent = c.text;
    syncEl(c, el);
    sheet.appendChild(el);
    els.set(c.id, el);
    return el;
  }
  function syncEl(c, el){
    el = el || els.get(c.id);
    if (!el) return;
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.fontFamily = FONT;
    el.style.fontSize = c.size + 'px';
    el.style.lineHeight = (c.size * LINE) + 'px';
    el.style.fontWeight = c.bold ? '700' : '400';
    el.style.color = c.color;
  }
  function addCell(opts){
    opts = opts || {};
    seq += 1;
    var c = {
      id: seq,
      x: Math.max(0, opts.x || 0),
      y: Math.max(0, opts.y || 0),
      text: opts.text || '',
      size: opts.size || defaults.size,
      bold: ('bold' in opts) ? !!opts.bold : defaults.bold,
      color: opts.color || defaults.color
    };
    cells.push(c);
    byId.set(c.id, c);
    makeEl(c);
    updateCount();
    return c;
  }
  function removeCell(id, silent){
    var idx = -1;
    for (var i = 0; i < cells.length; i++){ if (cells[i].id === id){ idx = i; break; } }
    if (idx < 0) return;
    if (!silent) pushHistory();
    cells.splice(idx, 1);
    byId.delete(id);
    var el = els.get(id);
    if (el){ el.remove(); els.delete(id); }
    if (selectedId === id) selectedId = null;
    if (editingId === id) editingId = null;
    updateCount();
  }

  /* ===== 選択・ツールバー ===== */
  function select(id){ selectedId = id; syncSelection(); }
  function syncSelection(){
    els.forEach(function(el, id){ el.classList.toggle('sel', id === selectedId); });
    updateToolbar();
  }
  function updateToolbar(){
    var c = (selectedId !== null) ? byId.get(selectedId) : null;
    var size  = c ? c.size  : defaults.size;
    var bold  = c ? c.bold  : defaults.bold;
    var color = c ? c.color : defaults.color;
    if (String(sizeSel.value) !== String(size)) sizeSel.value = String(size);
    boldBtn.classList.toggle('active', !!bold);
    colorInp.value = color;
  }
  function updateCount(){
    var n = 0;
    for (var i = 0; i < cells.length; i++){ if (cells[i].text !== '') n++; }
    countEl.textContent = 'セル数 ' + n;
    hint.style.display = (n === 0 && editingId === null) ? 'block' : 'none';
  }
  function applyFormat(patch){
    if ('bold'  in patch) defaults.bold  = !!patch.bold;
    if ('size'  in patch) defaults.size  = patch.size;
    if ('color' in patch) defaults.color = patch.color;
    var c = (selectedId !== null) ? byId.get(selectedId) : null;
    if (!c){ updateToolbar(); return; }
    pushHistory();
    if ('bold'  in patch) c.bold  = !!patch.bold;
    if ('size'  in patch) c.size  = patch.size;
    if ('color' in patch) c.color = patch.color;
    syncEl(c);
    updateToolbar();
  }

  /* ===== 編集モード ===== */
  function readText(el){
    var t = (el.innerText != null) ? el.innerText : el.textContent;
    t = String(t).replace(/\u00a0/g, ' ').replace(/\r/g, '');
    return t.replace(/\n+$/, '');
  }
  function caretToEnd(el){
    var r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }
  function startEdit(id, ch){
    if (editingId !== null && editingId !== id) commitEdit();
    var c = byId.get(id);
    var el = els.get(id);
    if (!c || !el) return;
    selectedId = id;
    editingId = id;
    textBefore = c.text;
    el.classList.add('editing');
    el.setAttribute('contenteditable', 'true');
    if (ch != null){
      c.text = ch;
      el.textContent = ch;
    } else {
      el.textContent = c.text;
    }
    el.focus();
    caretToEnd(el);
    syncSelection();
    updateCount();
  }
  function commitEdit(){
    if (editingId === null) return;
    var id = editingId;
    var el = els.get(id);
    var c  = byId.get(id);
    editingId = null;
    if (!el || !c) return;
    el.classList.remove('editing');
    el.setAttribute('contenteditable', 'false');
    var t = readText(el);
    if (t !== textBefore) pushHistory();
    if (t.trim() === ''){
      removeCell(id, true);
      selectedId = null;
    } else {
      c.text = t;
      el.textContent = t;
    }
    syncSelection();
    updateCount();
  }
  function cancelEdit(){
    if (editingId === null) return;
    var id = editingId;
    var el = els.get(id);
    var c  = byId.get(id);
    editingId = null;
    if (!el || !c) return;
    el.classList.remove('editing');
    el.setAttribute('contenteditable', 'false');
    if (textBefore === ''){
      removeCell(id, true);
      selectedId = null;
    } else {
      c.text = textBefore;
      el.textContent = textBefore;
    }
    syncSelection();
    updateCount();
  }

  /* ===== 移動 ===== */
  function findNeighbor(cur, dx, dy){
    var best = null, bestScore = Infinity;
    for (var i = 0; i < cells.length; i++){
      var c = cells[i];
      if (c.id === cur.id) continue;
      var ddx = c.x - cur.x, ddy = c.y - cur.y;
      if (dx > 0 && ddx <= 0) continue;
      if (dx < 0 && ddx >= 0) continue;
      if (dy > 0 && ddy <= 0) continue;
      if (dy < 0 && ddy >= 0) continue;
      var primary, secondary;
      if (dx !== 0){ primary = Math.abs(ddx); secondary = Math.abs(ddy); }
      else         { primary = Math.abs(ddy); secondary = Math.abs(ddx); }
      var score = primary + secondary * 2.5;
      if (score < bestScore){ bestScore = score; best = c; }
    }
    return best;
  }
  function moveSelection(dx, dy, create){
    if (selectedId === null) return;
    var cur = byId.get(selectedId);
    if (!cur){ selectedId = null; syncSelection(); return; }
    var n = findNeighbor(cur, dx, dy);
    if (n){ select(n.id); return; }
    if (!create) return;
    var el = els.get(cur.id);
    var w = el ? el.offsetWidth : 40;
    var h = el ? el.offsetHeight : (cur.size * LINE + PAD_Y * 2);
    var nx = cur.x, ny = cur.y;
    if (dx !== 0) nx = cur.x + w + NEW_GAP_X;
    if (dy !== 0) ny = cur.y + h + NEW_GAP_Y;
    var c2 = addCell({ x: nx, y: ny });
    startEdit(c2.id, null);
  }
  function commitAndMove(dx, dy){
    if (editingId === null) return;
    var el = els.get(editingId);
    var gx = el ? parseFloat(el.style.left || '0') : 60;
    var gy = el ? parseFloat(el.style.top || '0') : 60;
    var gw = el ? el.offsetWidth : 40;
    var gh = el ? el.offsetHeight : 24;
    commitEdit();
    if (selectedId === null){
      var nx = (dx !== 0) ? gx + gw + NEW_GAP_X : gx;
      var ny = (dy !== 0) ? gy + gh + NEW_GAP_Y : gy;
      var c = addCell({ x: nx, y: ny });
      startEdit(c.id, null);
      return;
    }
    moveSelection(dx, dy, true);
  }
  function clearCell(){
    if (selectedId === null) return;
    var c = byId.get(selectedId);
    if (!c) return;
    pushHistory();
    if (c.text === ''){
      removeCell(selectedId, true);
      selectedId = null;
    } else {
      c.text = '';
      var el = els.get(c.id);
      if (el) el.textContent = '';
    }
    syncSelection();
    updateCount();
  }

  /* ===== クリック・ドラッグ ===== */
  function localPoint(e){
    var r = sheet.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onPointerDown(e){
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    var el = e.target && e.target.closest ? e.target.closest('.cell') : null;

    if (editingId !== null && (!el || Number(el.getAttribute('data-id')) !== editingId)){
      commitEdit();
    }
    if (!el){
      emptyDown = { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY };
      return;
    }
    var id = Number(el.getAttribute('data-id'));
    if (editingId === id) return;      // 編集中はテキスト選択を優先
    e.preventDefault();
    select(id);
    drag = { id: id, sx: e.clientX, sy: e.clientY, ox: byId.get(id).x, oy: byId.get(id).y, moved: false };
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
  }
  function onPointerMove(e){
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (!drag.moved) drag.moved = true;
    var c = byId.get(drag.id), el = els.get(drag.id);
    if (!c || !el) return;
    c.x = Math.max(0, drag.ox + dx);
    c.y = Math.max(0, drag.oy + dy);
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
  }
  function onPointerUp(){
    if (drag && drag.moved) pushHistory();
    drag = null;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);

    if (emptyDown){
      var d = Math.abs(emptyDown.px - emptyDown.x) + Math.abs(emptyDown.py - emptyDown.y);
      var p = emptyDown;
      emptyDown = null;
      if (d > 6) return;
      var pt = localPoint({ clientX: p.px, clientY: p.py });
      var x = Math.max(0, Math.min(pt.x - PAD_X, sheet.clientWidth - 30));
      var y = Math.max(0, Math.min(pt.y - PAD_Y, sheet.clientHeight - 30));
      var c = addCell({ x: x, y: y });
      startEdit(c.id, null);
    }
  }
  sheet.addEventListener('pointerdown', onPointerDown);
  sheet.addEventListener('dblclick', function(e){
    var el = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (el) startEdit(Number(el.getAttribute('data-id')), null);
  });
  sheet.addEventListener('paste', function(e){
    var el = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!el || editingId === null) return;
    e.preventDefault();
    var txt = '';
    try { txt = (e.clipboardData || window.clipboardData).getData('text/plain') || ''; } catch (err){ txt = ''; }
    txt = txt.replace(/\r\n?/g, '\n');
    document.execCommand('insertText', false, txt);
  });

  /* ===== キーボード ===== */
  document.addEventListener('keydown', function(e){
    var meta = e.ctrlKey || e.metaKey;

    if (editingId !== null){
      if (e.key === 'Escape'){ e.preventDefault(); cancelEdit(); return; }
      if (e.key === 'Enter' && e.shiftKey){
        e.preventDefault();
        document.execCommand('insertText', false, '\n');
        return;
      }
      if (e.key === 'Enter'){ e.preventDefault(); commitAndMove(0, 1); return; }
      if (e.key === 'Tab'){ e.preventDefault(); commitAndMove(e.shiftKey ? -1 : 1, 0); return; }
      return;
    }

    if (e.key === 'Enter'){ e.preventDefault(); if (selectedId === null) createAtViewport(); else moveSelection(0, 1, true); return; }
    if (e.key === 'Tab'){ e.preventDefault(); if (selectedId === null) createAtViewport(); else moveSelection(e.shiftKey ? -1 : 1, 0, true); return; }
    if (e.key === 'ArrowUp'){ e.preventDefault(); moveSelection(0, -1, false); return; }
    if (e.key === 'ArrowDown'){ e.preventDefault(); moveSelection(0, 1, false); return; }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); moveSelection(-1, 0, false); return; }
    if (e.key === 'ArrowRight'){ e.preventDefault(); moveSelection(1, 0, false); return; }
    if (e.key === 'Escape'){ if (selectedId !== null){ selectedId = null; syncSelection(); } return; }
    if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); clearCell(); return; }
    if (meta && (e.key === 'b' || e.key === 'B')){
      e.preventDefault();
      var c = (selectedId !== null) ? byId.get(selectedId) : null;
      applyFormat({ bold: c ? !c.bold : !defaults.bold });
      return;
    }
    if (meta && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (meta && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }
    if (meta && (e.key === 's' || e.key === 'S')){ e.preventDefault(); exportPNG(); return; }
    if (meta || e.altKey) return;
    if (e.key.length === 1){
      if (e.key === ' ' && selectedId === null) return;
      e.preventDefault();
      var target = (selectedId !== null) ? byId.get(selectedId) : createAtViewport();
      if (!target) return;
      startEdit(target.id, e.key);
    }
  });
  function createAtViewport(){
    var x = stage.scrollLeft + 40;
    var y = stage.scrollTop + 40;
    var c = addCell({ x: x, y: y });
    startEdit(c.id, null);
    return c;
  }

  /* ===== ツールバー操作 ===== */
  boldBtn.addEventListener('click', function(){
    var c = (selectedId !== null) ? byId.get(selectedId) : null;
    applyFormat({ bold: c ? !c.bold : !defaults.bold });
    boldBtn.blur();
  });
  sizeSel.addEventListener('change', function(){
    applyFormat({ size: Number(sizeSel.value) });
    sizeSel.blur();
  });
  colorInp.addEventListener('input', function(){
    applyFormat({ color: colorInp.value });
  });
  delBtn.addEventListener('click', function(){
    if (editingId !== null) commitEdit();
    if (selectedId !== null) removeCell(selectedId, false);
    syncSelection();
    delBtn.blur();
  });
  clearBtn.addEventListener('click', function(){
    if (!cells.length) return;
    if (!window.confirm('シート上のすべての文字を消去します。よろしいですか？')) return;
    if (editingId !== null){ editingId = null; }
    pushHistory();
    cells = [];
    rebuild();
    clearBtn.blur();
  });
  pngBtn.addEventListener('click', function(){ exportPNG(); pngBtn.blur(); });

  /* ===== PNG書き出し（DOMは使わず canvas に直接描画） ===== */
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function stamp(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
      + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
  }
  function exportPNG(){
    if (editingId !== null) commitEdit();

    var list = cells.filter(function(c){ return c.text !== '' && els.has(c.id); });
    var PAD = 48;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    list.forEach(function(c){
      var el = els.get(c.id);
      var w = el.offsetWidth, h = el.offsetHeight;
      if (c.x < minX) minX = c.x;
      if (c.y < minY) minY = c.y;
      if (c.x + w > maxX) maxX = c.x + w;
      if (c.y + h > maxY) maxY = c.y + h;
    });
    if (!isFinite(minX)){ minX = 0; minY = 0; maxX = 1000; maxY = 600; }

    var W = Math.max(1, Math.ceil(maxX - minX + PAD * 2));
    var H = Math.max(1, Math.ceil(maxY - minY + PAD * 2));
    var scale = Math.max(2, window.devicePixelRatio || 1);

    var cv = document.createElement('canvas');
    cv.width  = Math.round(W * scale);
    cv.height = Math.round(H * scale);
    var ctx = cv.getContext('2d');
    if (!ctx){ window.alert('お使いのブラウザではPNG書き出しを利用できません。'); return; }

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    list.forEach(function(c){
      var el = els.get(c.id);
      var w = el.offsetWidth, h = el.offsetHeight;
      var ox = c.x - minX + PAD;
      var oy = c.y - minY + PAD;
      var lh = c.size * LINE;
      var lines = String(c.text).split('\n');
      var blockH = lh * lines.length;
      var firstCenter = oy + (h - blockH) / 2 + lh / 2;

      ctx.font = (c.bold ? '700 ' : '400 ') + c.size + 'px ' + FONT;
      ctx.fillStyle = c.color;
      for (var i = 0; i < lines.length; i++){
        ctx.fillText(lines[i], ox + PAD_X, firstCenter + lh * i);
      }
    });

    var name = 'shiro-sheet_' + stamp() + '.png';
    if (cv.toBlob){
      cv.toBlob(function(blob){
        if (!blob){ window.alert('PNGの生成に失敗しました。'); return; }
        saveBlob(blob, name);
      }, 'image/png');
    } else {
      var a = document.createElement('a');
      a.href = cv.toDataURL('image/png');
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  }
  function saveBlob(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  /* ===== 初期化 ===== */
  updateCount();
  updateToolbar();
  syncSelection();
})();
</script>
</body>
</html>
