<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VTuberロゴメーカー（機能改善・軽量全文版）</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; gap: 20px; }
        .panel { background: white; padding: 15px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 10px; align-items: center; }
        .row label { flex: 1; font-size: 0.8rem; font-weight: bold; }
        input[type="text"], select, input[type="number"] { padding: 6px; width: 100%; box-sizing: border-box; }
        input[type="color"] { width: 40px; height: 28px; cursor: pointer; border: 1px solid #ccc; }
        button { padding: 10px; font-weight: bold; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #357abd; }
        canvas { border: 2px dashed #999; background: #fff; background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), linear-gradient(45deg, #eee 25%, white 25%, white 75%, #eee 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
        .preload { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

<!-- フォント化け防止の先読み -->
<div class="preload" style="font-family: 'Rampart One';">a</div><div class="preload" style="font-family: 'Dela Gothic One';">a</div>
<div class="preload" style="font-family: 'Hachi Maru Pop';">a</div><div class="preload" style="font-family: 'M PLUS Rounded 1c';">a</div>

<div class="panel">
    <div><label>テキスト</label><input type="text" id="txt" value="ドル鯖"></div>
    <div><label>フォント</label>
        <select id="font">
            <option value="'Rampart One', cursive">Rampart One（立体）</option>
            <option value="'Dela Gothic One', sans-serif">Dela Gothic One（太ゴ）</option>
            <option value="'Hachi Maru Pop', cursive">Hachi Maru Pop（ポップ）</option>
            <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded（丸ゴ）</option>
        </select>
    </div>
    <div><label>サイズ</label><input type="number" id="size" value="100"></div>
    <div class="row">
        <label><input type="radio" id="solid" name="type" checked>単色</label>
        <label><input type="radio" id="grad" name="type">グラデ</label>
    </div>
    <div class="row"><label>文字色 (開始/終了)</label><input type="color" id="c1" value="#0055ff"><input type="color" id="c2" value="#8ec8ff"></div>
    <div class="row"><label>縁の色</label><input type="color" id="sc" value="#ff2200"></div>
    <div class="row"><label><input type="checkbox" id="outer" checked>外側のみ適用（内側を潰さない）</label></div>
    <div><label>縁の幅</label><input type="number" id="sw" value="12"></div>
    <div class="row"><label>影色</label><input type="color" id="shc" value="#000000"></div>
    <div class="row"><label>影ぼかし/ズレ</label><input type="number" id="shb" value="10"><input type="number" id="sho" value="6"></div>
    <button id="save">PNG保存 (4x)</button>
</div>

<canvas id="cv" width="600" height="400"></canvas>

<script>
    const cv = document.getElementById('cv'); const ctx = cv.getContext('2d');
    const el = (id) => document.getElementById(id);
    const inputs = ['txt', 'font', 'size', 'c1', 'c2', 'sc', 'outer', 'sw', 'shc', 'shb', 'sho'];

    function draw(targetCtx, targetCanvas, scale = 1) {
        targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        const s = parseInt(el('size').value, 10) * scale;
        const x = targetCanvas.width / 2; const y = targetCanvas.height / 2;
        const fontStr = `bold ${s}px ${el('font').value}`;
        
        targetCtx.font = fontStr; targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle';

        let fill = el('c1').value;
        if (el('grad').checked) {
            const g = targetCtx.createLinearGradient(x, y - s/2, x, y + s/2);
            g.addColorStop(0, el('c1').value); g.addColorStop(1, el('c2').value);
            fill = g;
        }

        targetCtx.save();
        targetCtx.shadowColor = el('shc').value;
        targetCtx.shadowBlur = parseInt(el('shb').value, 10) * scale;
        targetCtx.shadowOffsetX = parseInt(el('sho').value, 10) * scale;
        targetCtx.shadowOffsetY = parseInt(el('sho').value, 10) * scale;

        const w = parseInt(el('sw').value, 10) * scale;

        if (el('outer').checked && w > 0) {
            targetCtx.strokeStyle = el('sc').value; targetCtx.lineWidth = w * 2; targetCtx.lineJoin = 'round';
            targetCtx.strokeText(el('txt').value, x, y);
            targetCtx.restore();
            targetCtx.save();
            targetCtx.font = fontStr; targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle';
            targetCtx.fillStyle = fill; targetCtx.fillText(el('txt').value, x, y);
        } else {
            if (w > 0) {
                targetCtx.strokeStyle = el('sc').value; targetCtx.lineWidth = w * 2; targetCtx.lineJoin = 'round';
                targetCtx.strokeText(el('txt').value, x, y);
            }
            targetCtx.fillStyle = fill; targetCtx.fillText(el('txt').value, x, y);
        }
        targetCtx.restore();
    }

    const update = () => { draw(ctx, cv); setTimeout(() => draw(ctx, cv), 50); };
    inputs.forEach(id => el(id).addEventListener('input', update));
    ['solid', 'grad'].forEach(id => el(id).addEventListener('change', update));
    document.fonts.ready.then(() => { draw(ctx, cv); setTimeout(() => draw(ctx, cv), 300); });

    el('save').addEventListener('click', () => {
        const out = document.createElement('canvas'); out.width = cv.width * 4; out.height = cv.height * 4;
        draw(out.getContext('2d'), out, 4);
        const a = document.createElement('a'); a.download = 'logo.png'; a.href = out.toDataURL('image/png'); a.click();
    });
</script>
</body>
</html>
